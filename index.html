  ['증량 성공','증량','pos'],['증량 준비','준비','pos'],['달성','달성','pos'],['순항','순항','pos'],
  ['우수','우수','pos'],['양호','양호','pos'],['준수','준수','pos'],['확보','확보','pos'],
  ['적절','적절','pos'],['가능','가능','pos'],['유지','유지',''],
  ['첫 기록','신규','']
];
function aiStat(t){
  for(var i=0;i<AISTAT.length;i++)if(t.indexOf(AISTAT[i][0])>=0)return AISTAT[i];
  return null;
}
/* 불렛 한 줄 → 라벨·상태칩·수치바 카드 */
function aiTr(body,tone,hl,noBar){
  var ix=body.indexOf(' — ');
  if(ix<1)ix=body.indexOf(' - ');
  if(ix<1||ix>26)ix=-1;
  var k=ix>0?body.slice(0,ix):body, v=ix>0?body.slice(ix+3):'';
  if(hl){k=hlNum(k);v=hlNum(v);}
  var st=aiStat(v||k), cls=tone==='neg'?'neg':'';
  if(st&&!cls)cls=st[2]==='neg'?'neg':(st[2]==='pos'?'pos':'');
  /* "5/10" 형태가 있으면 미니 바로 시각화 */
  var mb='',m=noBar?null:(k+' '+v).match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
  if(m){
    var cv=parseFloat(m[1]),gv=parseFloat(m[2]);
    if(gv>0)mb='<div class="mini"><b style="width:'+Math.max(0,Math.min(100,Math.round(cv*100/gv)))+'%"></b></div>';
  }
  return '<div class="ai-tr'+(cls?' '+cls:'')+'">'
    +'<div class="kr"><span class="k">'+k+'</span>'
    +(st?'<span class="st">'+st[1]+'</span>':'')+'</div>'
    +(v?'<span class="v">'+v+'</span>':'')+mb+'</div>';
}
function bhHead(body){
  var ix=body.indexOf(' — ');
  if(ix<1)ix=body.indexOf(' - ');
  if(ix<1||ix>26)return body;
  return '<b class="bh">'+body.slice(0,ix)+'</b><em class="bd2">—</em>'+body.slice(ix+3);
}
/* ── 판정 ──
   문턱은 전부 이미 코드에 있던 것을 그대로 쓴다. 목표+3 초과,
   페이스 환산, 디로드 2종목, 연속 3일 — 새 숫자를 지어내지 않는다. */
function vzVerdict(cur,goal){
  cur=+cur||0;goal=+goal||0;
  /* 기록이 없는 것이 아니라 그 부위에 주간 목표를 안 정한 것이다.
     '미기록' 이라 쓰면 세트를 다 채운 사람에게도 그렇게 뜬다. */
  if(!(goal>0))return {t:TX('목표 없음'),c:''};
  var ph=(computedFacts()||{}).weekPhase||'';
  var late=(ph==='막바지'||ph==='마지막날');
  if(!late){
    /* 주 중반에 목표와 그대로 맞대면 늘 미달로 보인다 — 경과분으로 환산한다.
       그러므로 이 판정은 '주 목표에 못 미쳤다' 가 아니라 '여기까지 왔어야 할
       몫에 못 미쳤다' 다. 아래 마감 판정과 다른 말이라 다르게 적는다. */
    var pl=paceLeft();
    if(pl>=20){
      var exp=Math.round(goal*pl/100);
      return cur>=exp?{t:TX('페이스 맞음'),c:'pos'}:{t:TX('페이스 밀림'),c:'neg'};
    }
    return {t:TX('주 초반'),c:''};
  }
  if(cur>=goal+3)return {t:TX('목표 초과'),c:'warn'};   /* 목표+3 문턱 */
  if(cur>=goal)return {t:TX('목표 달성'),c:'pos'};
  return {t:TX('목표 미달'),c:'neg'};
}
/* 랜드마크는 목표 대비가 아니라 구간 안에 있는지로 본다 */
function vzZone(cur,L,easy){
  cur=+cur||0;easy=+easy||0;
  var mrv=Math.round(L[3]*0.8);                 /* 감량기 보정 — lmRow 와 같은 식 */
  var z1=Math.min(L[1],mrv),z2=Math.min(L[2],mrv);
  /* 어느 랜드마크를 넘고 못 미치는지를 낱말이 말해야 한다 — '초과' 만으로는
     MEV 를 넘었다는 말인지 MRV 를 넘었다는 말인지 알 수 없다.
     ok 는 '손댈 것이 아님' 표시다. 이것을 글자로 견주면 이름을 바꾸는 순간
     조용히 깨진다(planPayload 이 그렇게 걸러 내고 있었다). */
  if(cur>mrv)return {t:'MRV 초과',c:'neg',z:'over'};
  if(cur>=Math.round(mrv*0.9))return {t:'MRV 근접',c:'warn',z:'over'};
  if(cur<L[0]){
    /* 유효 세트로는 MEV 를 못 넘는데 버린 세트를 얹으면 넘는다 —
       세트가 모자란 게 아니라 가벼웠던 것이다. 낱말만 바꾸고 열쇠는
       under 로 둔다: 묶음은 여전히 '손댈 것' 쪽이라야 한다.
       다 합쳐도 MEV 미달이면 그건 진짜 볼륨 부족이라 안 건드린다. */
    if(easy>=2&&cur+easy>=L[0])return {t:'강도 부족',c:'neg',z:'under'};
    return {t:'MEV 미만',c:'neg',z:'under'};
  }
  if(cur>=z1&&cur<=z2)return {t:'MAV 안',c:'pos',ok:1,z:'ok'};
  return {t:'유지 구간',c:'',ok:1,z:'ok'};
}

/* ── 앱이 직접 그리는 조각 ──
   지금까지 이 마크업은 aiFmt 안에만 있어서, 앱이 그리려면 같은 HTML 을
   다시 써야 했다. 함수로 빼서 앱과 AI 렌더가 같은 조각을 쓴다. */

/* 진행바 한 줄. 예전에는 Math.min(100) 으로 잘라 24/21 과 21/21 이 같은
   꽉 찬 막대였다. 넘치면 lmRow 처럼 눈금을 옮긴다 — 축의 끝을 실적에 맞추고
   목표 자리에 선을 그어 '이 선을 넘었다' 가 자리로 보이게 한다.
   mark: 경과일 눈금을 켤지. 유산소 줄에 근력 경과일을 꽂으면 뜻이 안 맞는다. */
function vzBar(name,cur,goal,sub,vd,mark){
  cur=+cur||0;goal=+goal||0;
  var over=goal>0&&cur>goal;
  var mx=Math.max(goal,cur)||1;
  var fill=Math.max(0,Math.min(100,Math.round(cur*100/mx)));
  var gp=Math.max(0,Math.min(100,Math.round(goal*100/mx)));
  var mk='';
  if(over)mk='<i class="gl" style="left:'+gp+'%"></i>';
  else if(mark){var pl=paceLeft();if(pl>0&&pl<100)mk='<i class="mk" style="left:'+pl+'%"></i>';}
  /* 3px 막대가 여섯 줄 늘어서면 밝은 팔레트에서는 보이지도 않으면서 자리만
     먹는다. 숫자 자체를 판정 색으로 칠하면 훑기만 해도 어디가 넘쳤는지 읽힌다.
     세부 랜드마크는 자기 눈금이 있으므로 거기는 그대로 둔다. */
  return '<div class="zrow'+(vd&&vd.c?' '+vd.c:'')+'">'
    +'<span class="nm">'+esc(name)+'</span>'
    +(vd&&vd.t?'<span class="st">'+esc(vd.t)+'</span>':'')
    +'<span class="num">'+cur+'<em>/'+goal+'</em></span>'
    +(sub?('<span class="sub">'+esc(sub)+'</span>'):'')
    +'</div>';
}
/* 목표 열량에서 탄단지 눈금을 뽑는다. 감량기 표준 순서 — 단백질을 먼저
   못박고, 지방은 바닥을 깔고, 남는 것이 탄수다.
   이 순서라야 목표 열량이 바뀔 때 탄수만 움직이고 단백질·지방 바닥은
   그대로다. 지켜야 할 것이 지켜진다. */
function macroGoals(kcalGoal){
  if(!(BW>0)||!(kcalGoal>0))return null;
  var p=Math.round(BW*PRO_PER_KG),f=Math.round(BW*FAT_PER_KG);
  var left=kcalGoal-p*4-f*9;
  /* 남는 열량이 없으면 탄수 눈금을 안 준다. 0 을 눈금으로 두면 몇 g 을
     먹어도 무한대가 된다. */
  var c=left>0?Math.round(left/4):0;
  return {p:p,f:f,c:c};
}
/* 원 하나. 눈금은 셋 다 '적어도 이만큼' 이다 — 넘긴 것은 잘못이 아니라
   채운 것이므로 어떤 원도 넘겼다고 경고색을 쓰지 않는다. 못 채운 것만 말한다.
   눈금이 없으면(탄수 몫이 0) 퍼센트 자리에 — 를 둔다. 기준 없는 원은 거짓말이다.
   kind: 'opt' 적정(단백질만) · 'min' 최소(지방·탄수) */
function vzRing(name,kind,cur,goal,unit){
  cur=Math.round(+cur||0);goal=Math.round(+goal||0);
  var R=26,C=2*Math.PI*R;
  var rate=goal>0?cur/goal:0,met=goal>0&&cur>=goal;
  var fill=Math.max(0,Math.min(1,rate))*C;
  var pct=goal>0?Math.round(rate*100):null;
  var h='<div class="ring"><div class="rgn">'+esc(name)
    +'<i>'+(kind==='opt'?TX('적정'):TX('최소'))+'</i></div>'
    +'<svg viewBox="0 0 64 64" class="rgs">'
    +'<circle class="tr" cx="32" cy="32" r="'+R+'"/>';
  if(goal>0&&fill>0)
    h+='<circle class="fl'+(met?' met':'')+'" cx="32" cy="32" r="'+R+'" '
      +'stroke-dasharray="'+fill.toFixed(1)+' '+C.toFixed(1)+'"/>';
  h+='<text x="32" y="36" class="rgp">'+(pct===null?'—':pct+'%')+'</text></svg>'
    +'<div class="rgv">'+cur.toLocaleString()
    +(goal>0?'<em> / '+goal.toLocaleString()+'</em>':'')+' '+esc(unit)+'</div>'
    /* 58% 는 상태고 '67g 더' 는 할 일이다. 감량기에 필요한 것은
       상태가 아니라 다음 끼니에 뭘 먹느냐다. */
    +'<div class="rgd'+(met?' met':'')+'">'
    +(goal<=0?'—':(met?TX('충족'):TX1('{0}{1} 더',(goal-cur).toLocaleString(),esc(unit))))+'</div>'
    +'</div>';
  return h;
}
function vzTotal(label,cur,goal){
  return '<div class="ztot"><span>'+esc(label)+'</span>'
    +'<span class="num">'+(+cur||0)+'<em>/'+(+goal||0)+'</em></span></div>';
}
/* 하루 열량을 끼니 칸으로 나눈 막대. 먹은 끼니는 실제 열량으로 채우고,
   남은 끼니는 남은 몫을 고르게 나눈 테두리 칸으로 둔다.
   전에 끼니 막대를 걷어낸 적이 있는데 그때는 '이미 먹은 끼니는 되돌릴 수
   없어 알아도 바꿀 것이 없다' 가 까닭이었다. 이것은 남은 끼니를 그리므로
   그 까닭에 안 걸린다 — 바꿀 수 있는 것만 그린다. */
function mealPlan(bm,miss,left,goal){
  var ORD=['breakfast','lunch','dinner','snack'],
      NM={breakfast:TX('아침'),lunch:TX('점심'),dinner:TX('저녁'),snack:TX('간식')};
  var segs=[],i,mv;
  for(i=0;i<ORD.length;i++){
    mv=bm&&bm[ORD[i]];
    if(mv&&+mv.kcal>0)segs.push({n:NM[ORD[i]],v:Math.round(+mv.kcal),on:true});
  }
  /* 끼니 구분이 안 온 날은 먹은 것을 한 칸으로. 못 가른다고 안 그릴 일은 아니다 */
  var done=0;for(i=0;i<segs.length;i++)done+=segs[i].v;
  var ate=Math.max(0,Math.round(goal-left));
  if(!segs.length&&ate>0)segs.push({n:TX('먹음'),v:ate,on:true});
  else if(segs.length&&ate-done>1)segs.push({n:TX('그 밖'),v:ate-done,on:true});
  var per=(miss.length&&left>0)?Math.round(left/miss.length):0;
  if(per>0)for(i=0;i<miss.length;i++)segs.push({n:NM[miss[i]]||miss[i],v:per,on:false});
  if(segs.length<2)return '';
  var h='<div class="mplan">';
  for(i=0;i<segs.length;i++){
    if(segs[i].v<=0)continue;
    h+='<div class="mslot'+(segs[i].on?' on':'')+'" style="flex:'+segs[i].v+' 1 0">'
      +'<b>'+esc(segs[i].n)+'</b><em>'+segs[i].v.toLocaleString()
      +(segs[i].on?' '+TX('먹음'):' '+TX('남음'))+'</em></div>';
  }
  return h+'</div>';
}
/* 하루 태우는 열량을 두 조각으로 가른다 — 밥으로 되채우는 몫과 안 채우는
   몫. 안 채우는 그 조각이 곧 적자다. 조각으로 그리면 볼 것이 하나뿐이다.
   적자는 dailyDeficitTarget 이 아니라 tdee-goal 로 낸다. 목표 열량이 0 으로
   잘린 날에는 둘이 어긋나는데, 그림이 거짓말을 하느니 식을 맞춘다. */
function deficitBars(tdee,goal){
  tdee=Math.round(+tdee||0);goal=Math.round(+goal||0);
  if(!(tdee>0&&goal>0&&goal<tdee))return '';
  var cut=tdee-goal;
  return '<div class="dfb">'
    +'<div class="dfh">'+TX1('소비 <b>{0}</b> = <em class="e">섭취 {1}</em> + <em class="c">적자 {2}</em>',
        tdee.toLocaleString(),goal.toLocaleString(),cut.toLocaleString())+'</div>'
    +'<div class="dfbar"><i class="eat" style="flex:'+goal+' 1 0"></i>'
    +'<i class="cut" style="flex:'+cut+' 1 0"></i></div>'
    /* '한 주로는 3,850kcal — 지방 0.5kg 어치' 를 적었었다. 가드 때문에 cut 은
       늘 정확히 dfc 이고 cut*7/7700 은 반올림 없이 WR 그대로라, 설정에서 본인이
       정한 주당 -0.5kg 이 두 단계를 돌아 되돌아온 것이다. 바로 윗줄
       '주당 -0.5kg 에서 나옴' 이 이미 하는 말이다. */
    +'</div>';
}
/* ── 평균 탭 · 요일 격자 ───────────────────────────────────────────
   deficitBars 바로 뒤(7562행 근처)에 둔다. 함수 선언이라 호이스팅되므로
   vzDiet 보다 뒤에 있어도 된다. insISO(6419) · vzLine(7564) 은 이미 있다. */

/* 평균 한 줄. .zrow 를 쓰지 않은 까닭 둘 —
   (1) .zrow.warn 의 숫자·칩 색이 --acc-br 이라, 같은 카드에서 '초과' 가
       격자에선 --sig, 줄에선 --acc-br 로 두 색이 된다. 한 낱말에 두 색이면
       둘이 다른 뜻인지 짚어 보게 된다.
   (2) .zrow 한 줄이 57px 다. 격자를 얹으면 평균 탭이 380px 를 넘어
       '한눈에' 가 스크롤로 깨진다.
   큰 수는 어떤 판정에서도 --tx 다 — 잰 값은 잘잘못이 아니다. 색은 칩만 진다. */
function dgHead(nf){
  var avD=Math.round(nf.completedDaysAvgDiff||0);
  /* 하루 판정과 같은 폭을 쓴다. 예전엔 평균이 부호만 보고 음수면 전부
     '준수' 라, 같은 -158 이 하루로는 부족이고 평균으로는 준수였다.
     감량기에 만성적으로 덜 먹는 것은 근손실 쪽이라 칭찬할 일이 아니다. */
  var bnd=okBand(nf.completedDaysAvgTarget);
  var ppk=(typeof nf.completedDaysProteinPerKg==='number')?nf.completedDaysProteinPerKg:null;
  var pgoal=nf.proteinPerKgGoal||PRO_PER_KG;
  var cls=avD>bnd?'dgh-ov':(avD<-bnd?'dgh-un':'dgh-ok');
  var vt=avD>bnd?TX('목표 초과'):(avD<-bnd?TX('목표 미달'):TX('목표 안'));
  /* '±100 기준' 이라는 꼬리말을 뺐다. 밑의 격자가 그 밴드를 띠로 그려 놓았고,
     그림이 제 일을 하면 설명이 필요 없다. */
  return '<div class="dgh '+cls+'">'
    +'<span class="dgk">'+TX('평균 섭취')+'</span><span class="dgcp">'+vt+'</span>'
    +'<span class="dgv">'+Math.round(nf.completedDaysAvgIntake).toLocaleString()+'</span>'
    +'<span class="dgun">kcal</span></div>'
    /* 창(21일)과 기록이 들어온 날 수는 다른 값이다. '13일' 만 적으면
       최근 열사흘로 읽힌다 — 그건 기간이 아니라 표본 크기다. */
    +'<div class="dgsb">'+TX1('목표 {0}',Math.round(nf.completedDaysAvgTarget).toLocaleString())
    +TX1(' · 차이 <b>{0}</b>',(avD>0?'+':'')+avD.toLocaleString())
    /* 감량기에 무너지는 것은 열량보다 단백질인데 이 갈래엔 한 글자도 없었다.
       값은 이미 nutriFacts 가 내고 있었고 아무도 안 읽고 있었다.
       자리는 '최근 21일 중 N일 기록' 을 '21일 중 N일' 로 줄여 만든다.
       판정 색에 .dgh 의 dgh-un 을 쓰면 안 된다 — 그건 열량 판정이라 덮어쓴다.
       체중이 없으면 값이 null 이라 그때는 조각을 통째로 뺀다. */
    +(ppk!==null?TX1(' · 단백질 <b class="dgpr{0}">{1}</b> g/kg',
        (ppk<pgoal?' lo':''),ppk.toFixed(1)):'')
    +TX1(' · 21일 중 <b>{0}일</b>',nf.completedDaysCount)+'</div>';
}

/* 최근 21일을 요일 격자로. 평균 한 줄은 '얼마나' 는 말해도 '언제' 를 못
   말한다 — 같은 +122 가 고르게 지킨 세 주일 수도, 토요일마다 무너진 세
   주일 수도 있고 둘은 다음에 할 일이 다르다.
   길이로 값을 싣지 않는다. 폰 폭에 21칸을 놓으면 쓸 수 있는 길이 차이가
   5px 뿐이라, 막대처럼 생겨 놓고 길이에 값이 안 실리면 눈이 먼저 읽는 쪽이
   거짓말을 하게 된다. 크기는 위의 평균 줄이 지고, 격자는 판정과 자리만
   진다 — 그래서 칸 안에 수가 하나도 없다.
   농도로도 값을 안 싣는다. 회색 두 칸의 진하기를 견주는 일은 사람이 못 한다. */
function dgWeekGrid(nf){
  var W=320,GL=30,CW=(W-GL-2)/7,HH=10,RH=18;
  var WD=TX('월,화,수,목,금,토,일').split(',');
  var now=new Date();
  /* nutriFacts 의 21일 창과 같은 식이라 격자의 표식 수와 daysOnTarget/
     Over/Under 의 합이 정확히 맞는다. 창을 따로 잡으면 두 수가 갈라진다. */
  var lo=new Date(now);lo.setDate(now.getDate()-20);
  var dwLo=(lo.getDay()+6)%7;                       /* 월=0 */
  var st=new Date(lo);st.setDate(lo.getDate()-dwLo); /* 창 첫날이 든 주의 월요일 */
  /* 요일이 세로줄이 되어야 무늬가 보이므로 격자를 월요일에 맞춘다.
     창이 주 경계에 안 맞으면 줄이 하나 는다 — 창을 자르느니 줄을 늘린다.
     오늘이 일요일일 때만 세 줄이고, 그때는 카드가 18px 짧아진다. */
  var ROWS=Math.ceil((dwLo+21)/7),H=HH+RH*ROWS;
  var loIso=insISO(lo),tdIso=insISO(now);
  var wN=[0,0,0,0,0,0,0],wO=[0,0,0,0,0,0,0],wU=[0,0,0,0,0,0,0],wS=[0,0,0,0,0,0,0];
  var g='',r,c,q;
  for(c=0;c<7;c++)
    g+='<text class="dgw'+(c>4?' dgwe':'')+'" x="'+(GL+CW*c+CW/2).toFixed(1)
      +'" y="7.5" text-anchor="middle">'+WD[c]+'</text>';
  for(r=0;r<ROWS;r++){
    var cy=HH+RH*r+RH/2,mk='',lab='',runS=-1,dt=null;
    /* c===7 은 줄 끝에서 띠 도막을 닫으려고 한 번 더 도는 자리다 */
    for(c=0;c<8;c++){
      var iso='',rec=null,isTd=false,inWin=false;
      if(c<7){
        dt=new Date(st.getTime());dt.setDate(st.getDate()+r*7+c);
        iso=insISO(dt);
        inWin=(iso>=loIso&&iso<=tdIso);
        isTd=(iso===tdIso);
        rec=inWin?(nf.byDay[iso]||null):null;
      }
      /* 띠는 기록이 있는 날 위에만 이어 깐다. 이어 그려야 '길' 이 되고,
         길이라야 길에서 벗어난 것이 읽힌다. 기록이 없는 날에서 띠가
         끊기므로 안 온 날과 0kcal 먹은 날이 모양으로 갈린다 —
         빈 동그라미 표식을 하나 더 두면 그때부터 범례가 필요해진다. */
      var hasBand=(c<7&&inWin&&(rec||isTd));
      if(hasBand&&runS<0)runS=c;
      if(!hasBand&&runS>=0){
        g+='<rect class="dgb" x="'+(GL+CW*runS+1.5).toFixed(1)+'" y="'+(cy-2).toFixed(1)
          +'" width="'+(CW*(c-runS)-3).toFixed(1)+'" height="4" rx="2"/>';
        runS=-1;
      }
      if(c>=7||!inWin)continue;
      /* 줄머리는 그 줄에서 처음 그린 칸의 날짜다. 그 주 월요일을 적으면
         라벨이 가리키는 칸이 없는 줄이 생긴다(첫 줄이 늘 그렇다). */
      if(!lab)lab=(dt.getMonth()+1)+'/'+dt.getDate();
      var cx=GL+CW*c+CW/2;
      if(isTd){
        /* 오늘은 아직 안 끝났다. 판정하면 아침만 먹은 낮 열두시가 '부족'
           이 된다. 파선으로 그린다 — 팔레트 28개를 재 보면 --acc-br 은
           --pos 와 늘 구분되지만(ΔE 15 이상), 색 하나에만 기대는 것보다
           모양으로도 갈리는 편이 작은 표식에서 확실하다. */
        mk+='<circle class="dgt" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.4"/>';
        continue;
      }
      if(!rec)continue;
      var df=Math.round(rec.diff||0);
      wN[c]++;wS[c]+=df;
      /* 그날의 목표로 그날의 폭을 낸다 — 운동한 날은 목표가 커서 폭도 넓다 */
      var db=okBand(rec.target);
      if(df>db){
        wO[c]++;
        mk+='<rect class="dgu" x="'+(cx-5.5).toFixed(1)+'" y="'+(cy-8.5).toFixed(1)
          +'" width="11" height="7.5" rx="2.5"/>';
      }else if(df<-db){
        wU[c]++;
        mk+='<rect class="dgd" x="'+(cx-5.5).toFixed(1)+'" y="'+(cy+1).toFixed(1)
          +'" width="11" height="7.5" rx="2.5"/>';
      }else{
        mk+='<circle class="dgo" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.2"/>';
      }
    }
    if(lab)g+='<text class="dgl" x="'+(GL-5)+'" y="'+(cy+2.8).toFixed(1)
      +'" text-anchor="end">'+lab+'</text>';
    g+=mk;   /* 표식을 띠보다 뒤에 그려야 띠에 안 먹힌다 */
  }
  var h='<svg class="dggrid" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'
    +esc(TX('최근 21일을 요일별로 놓은 격자. 그날 목표 언저리에 든 날은 띠 위의 점, '
      +'더 먹은 날은 띠 위로 솟은 칸, 덜 먹은 날은 띠 아래로 내린 칸'))+'">'+g+'</svg>';

  var on=nf.daysOnTarget||0,ov=nf.daysOverTarget||0,un=nf.daysUnderTarget||0;

    +'<span class="dgbd">'+TX1('±{0} 안',okBand(nf.completedDaysAvgTarget).toLocaleString())+'</span>'

    var bi=-1,bs=-1,bd='',over=false;
    for(q=0;q<7;q++){
      if(wN[q]<3)continue;
      mAv=Math.abs(Math.round(wS[q]/wN[q]));

      else if(wU[q]===wN[q]&&mAv>bs){bs=mAv;bi=q;bd=TX('부족');over=false;}

        WD[bi],bd,dgSgn(Math.round(wS[bi]/wN[bi])));
      if(over)ntc=' dgnt-up';
    }
  }
  if(nt)h+='<div class="dgnt'+ntc+'">'+nt+'</div>';
  return h;

/* 판정 칩. AI 글에서는 aiStat 이 문자열을 되짚어 붙이느라

   앱이 그릴 때는 되짚을 이유가 없으므로 판정을 그대로 받는다. */

function aiFmt(txt,ck,ph){
  ck=ck||[];
  var ckOn=ph!=='post';
  var esc=String(txt).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  var lines=esc.split(/\n/),out='',i,ln,m,sec='',ckIdx=0;
  for(i=0;i<lines.length;i++){
    ln=lines[i].trim();
    if(!ln)continue;
    m=ln.match(/^\[(.+)\]$/);
    if(m){sec=m[1];out+='<div class="ai-h">'+m[1]+'</div>';continue;}

    /* '가슴 18/15' 를 막대로 다시 그리던 분기를 뺐다. 화면이 이미 그리는
       숫자를 AI 가 베끼면 앱이 그것을 예쁘게 렌더해 주고 있었다 —
       되풀이를 거들던 셈이다. 이제 베껴도 그냥 글줄로 나온다. */
    /* 영어판 프롬프트는 섹션 이름이 영어다 — 둘 다 받는다 */
    var noBar=(sec.indexOf('다음 끼니')>=0||sec.indexOf('체중')>=0||sec.indexOf('영양')>=0||sec.indexOf('Next meal')>=0);
    if(ln.indexOf('- ')===0){
      var body=ln.slice(2),tone='',ki;
      /* 처방·방향 섹션은 탭 가능한 체크 항목으로 */
      if(ckOn&&(sec.indexOf('방향')>=0||sec.indexOf('처방')>=0||sec.indexOf('Prescribe')>=0)){
        var done=ck.indexOf(ckIdx)>=0;
        out+='<button class="ai-ck'+(done?' done':'')+'" data-act="ckp" data-v="'+ckIdx+'"><i>'+(done?'✓':'')+'</i><span>'+bhHead(body)+'</span></button>';
        ckIdx++;
        continue;
      }
      for(ki=0;ki<AIPOS.length;ki++)if(body.indexOf(AIPOS[ki])>=0){tone='pos';break;}
      if(!tone)for(ki=0;ki<AINEG.length;ki++)if(body.indexOf(AINEG[ki])>=0){tone='neg';break;}
      out+=aiTr(body,tone,sec.indexOf('정체')>=0,noBar);
      continue;
    }
    out+='<div class="ai-p">'+ln+'</div>';
  }
  return out;
}

function aiExtract(eng,d){

    if(eng==='ant'){var t='',i;for(i=0;i<(d.content||[]).length;i++)t+=(d.content[i].text||'');return {txt:t};}
    var t2='',ps=(((d.candidates||[])[0]||{}).content||{}).parts||[];

/* 전체 시한이 아니라 '조용한 시간' 으로 끊는다 — 긴 리포트는 오래 걸리는 것이
   정상이고, 진짜 문제는 아무것도 안 오는 것이다. */
function sseFetch(url,opt,idleMs,onText){
  idleMs=idleMs||25000;
  var ac=(typeof AbortController!=='undefined')?new AbortController():null;
  if(ac)opt.signal=ac.signal;
  var t=null,bust=null;
  /* abort() 가 읽기까지 닿는지에 기대지 않는다 — 안 닿으면 읽기가 영영 안
     끝나 화면이 Analyzing 에 갇힌다. 시한을 따로 걸어 반드시 끝나게 한다. */
  var dead=new Promise(function(_,rej){bust=rej;});
  function poke(){
    if(t)clearTimeout(t);
    t=setTimeout(function(){
      try{ac&&ac.abort();}catch(e){}
      bust(new Error('idle'));
    },idleMs);
  }
  poke();
  return Promise.race([dead,fetch(url,opt).then(function(r){
    if(!r.ok||!r.body)throw new Error('nostream:'+r.status);
    var rd=r.body.getReader(),dec=new TextDecoder(),buf='',txt='';
    function pump(){
      return rd.read().then(function(res){
        poke();
        if(res.done){if(t)clearTimeout(t);return txt;}
        buf+=dec.decode(res.value,{stream:true});
        var lines=buf.split('\n');
        buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var ln=lines[i].trim();
          if(ln.indexOf('data:')!==0)continue;
          var js=ln.slice(5).trim();
          if(!js||js==='[DONE]')continue;
          try{
            var d=JSON.parse(js);
            var ps=d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
            if(ps)for(var q=0;q<ps.length;q++)txt+=(ps[q].text||'');
            if(onText)onText(txt);
          }catch(e2){}
        }
        return pump();
      });
    }
    return pump();
  })]).then(function(v){if(t)clearTimeout(t);return v;},
            function(e){if(t)clearTimeout(t);throw e;});
}

function grabBind(){
  var sh=document.getElementById('sheet');
  var g=sh?sh.querySelector('.grab'):null;
  if(!g||g.dataset.bound)return;
  g.dataset.bound='1';
  var y0=0,dy=0,drag=false,h0=0;
  function down(e){
    var t=e.touches?e.touches[0]:e;
    y0=t.clientY;dy=0;drag=true;
    h0=sh.getBoundingClientRect().height;
    sh.classList.add('drag');
  }
  function move(e){
    if(!drag)return;
    var t=e.touches?e.touches[0]:e;
    dy=t.clientY-y0;
    if(dy>0){
      sh.style.transform='translateY('+dy+'px)';
    }else{
      var grow=Math.min(-dy,window.innerHeight*0.9-h0);
      if(grow>0)sh.style.height=(h0+grow)+'px';
    }
    if(e.cancelable)e.preventDefault();
  }
  function up(){
    if(!drag)return;
    drag=false;
    sh.classList.remove('drag');
    sh.style.transform='';
    if(dy>90){
      navDrop();
      if(UI.open)closeEx();
      UI.sheet=null;UI.arm=null;render();
    }
  }
  g.addEventListener('touchstart',down,{passive:true});
  g.addEventListener('touchmove',move,{passive:false});
  g.addEventListener('touchend',up);
  g.addEventListener('touchcancel',up);
  g.addEventListener('mousedown',function(e){down(e);
    var mm=function(ev){move(ev);},mu=function(){up();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
}

          if(gv>=3&&gv<=40){GF=Math.round(gv*10)/10;if(canLS){try{localStorage.setItem(KEY+'.gf',String(GF));}catch(e7){}}}
        }
        if(canLS){
          try{localStorage.setItem(KEY+'.wt',JSON.stringify(WTGT));}catch(e2){}

        }
        widgetSync();restNotify();
        toast('<em>Settings saved</em>');
        render();
        renderSheet();
      })();
      break;
    case 'rs':
      if(UI.arm==='rs'){
        /* OFF 는 설정이 아니라 날짜 데이터라 S 와 함께 지운다.
           UNDO 에 같이 담지 않으면 되돌려도 쉬는 날만 안 돌아온다. */

        mem=null;S=load();OFF={};
        UI.open=null;UI.sheet=null;UI.arm=null;UI.draft={};UI.dirty={};
        render();
        toast('<em>Reset</em> <button class="tundo" data-act="un">UNDO</button>',8000);
      }else{UI.arm='rs';render();}
      break;
  }
});

      if(chk2&&Object.prototype.toString.call(chk2.m)==='[object Array]'&&chk2.m.length){

});

var HOLD={t1:null,t2:null,skip:false};
function holdClear(){clearTimeout(HOLD.t1);clearInterval(HOLD.t2);HOLD.t1=HOLD.t2=null;}
if(window.PointerEvent){
  document.addEventListener('pointerdown',function(e){
    var t=e.target.closest('[data-act]');if(!t)return;
    var a=t.getAttribute('data-act');
    if(a!=='w+'&&a!=='w-'&&a!=='r+'&&a!=='r-')return;
    holdClear();
    HOLD.t1=setTimeout(function(){
      HOLD.skip=true;
      syncFromDom();
      var k=a[0],d=a[1]==='+'?1:-1;
      step(k,d);
      HOLD.t2=setInterval(function(){step(k,d);},110);
    },450);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    document.addEventListener(ev,function(){if(HOLD.t2)setTimeout(holdClear,0);else holdClear();});
  });
}

/* updatefound 는 sw.js 가 바이트로 바뀌어야만 울린다. 화면(index.html)만 고치면
   sw.js 는 그대로라 알림이 영영 안 뜨고, 앱은 WebView 라 한 번 띄우면 계속 살아
   있어 옛 판을 며칠씩 본다 — 설정에서 고른 새 시안이 안 먹는 것처럼 보인다.
   서버의 index.html 이 바뀌었는지 ETag 로 직접 묻는다. 본문은 400KB 라 HEAD 만. */
var BTAG='',BTAGT=0,BTOLD=false;
function newBuild(){
  if(BTOLD)return;
  BTOLD=true;
  try{toast(TX('<em>새 버전</em>이 나왔음 — <button class="tundo" data-act="rlod">새로고침</button>'),12000);}catch(e){}
}
function buildPing(force){
  var now=+new Date();
  if(!force&&now-BTAGT<600000)return;   /* 10분에 한 번이면 넉넉하다 */
  BTAGT=now;
  try{
    /* ETag 만 보던 것은 '켜 둔 사이에 바뀌었나' 만 답한다. 처음 본 값을
       기준으로 삼기 때문에, 이미 옛 판으로 시작했으면 서버가 아무리
       새것이어도 영영 안 뜬다 — 실제로 그렇게 며칠 묵은 판을 봤다.
       version.txt 에 그 판의 BUILD 를 적어 두고 지금 돌고 있는 BUILD 와
       바로 견준다. 언제 켰는지와 무관하게 낡았으면 낡았다고 나온다. */
    fetch('version.txt',{cache:'no-cache'}).then(function(r){
      if(!r.ok)throw 0;
      return r.text();
    }).then(function(t){
      t=(t||'').trim();
      if(t&&t!==BUILD)newBuild();
    }).catch(function(){
      /* version.txt 가 없는 판에서도 예전처럼은 돌게 둔다 */
      fetch('index.html',{method:'HEAD',cache:'no-cache'}).then(function(r){
        var t2=r.headers.get('ETag')||r.headers.get('Last-Modified')||'';
        if(!t2)return;
        if(!BTAG){BTAG=t2;return;}
        if(t2!==BTAG)newBuild();
      }).catch(function(){});
    });
  }catch(e){}
}
if(location.protocol==='https:'){
  buildPing(true);

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    /* 앱을 켜 둔 채로는 새 화면이 와도 모른다. 받아 놓고 알려만 준다 —
       쓰던 중에 제멋대로 새로고침하면 입력하던 것이 날아간다. */
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller)newBuild();
      });
    });
    /* 앱으로 돌아올 때마다 새 판이 있는지 물어본다 */
    addEventListener('visibilitychange',function(){
      if(!document.hidden){try{reg.update();}catch(e){}}
    });
  }).catch(function(){});
}
