/* 이 브랜드에 속한 라인 목록 — 내장 프리셋 + 사용자가 만든 값 */
function lineListOf(b){
  b = normBrand(b);
  var list = (LINES[b] || []).slice(), seen = {}, i;
  for (i = 0; i < list.length; i++) seen[list[i]] = 1;
  for (i = 0; i < S.m.length; i++) {
    var ln = (S.m[i].ln || '').trim();
    if (ln && (S.m[i].b || '') === b && !seen[ln]) { seen[ln] = 1; list.push(ln); }
  }
  return list;
}
/* 브랜드 목록 — 내장 + 사용자가 만든 값 */
function brandListAll(){
  var list = [], seen = {}, k, i;
  for (k in LINES) { if (!seen[k]) { seen[k] = 1; list.push(k); } }
  for (i = 0; i < S.m.length; i++) {
    var b = (S.m[i].b || '').trim();
    if (b && !seen[b]) { seen[b] = 1; list.push(b); }
  }
  return list;
}

var PENDWD=null;
function setWd(ds){
  /* 빈 드래프트(삭제 대기)·유령 항목은 이동 시 자동 폐기 — 저장본은 그대로라 손실 없음 */

    var d0=UI.draft[k];
    if(!UI.dirty[k]||!machById(k)||!d0||!d0.length){delete UI.dirty[k];delete UI.draft[k];}
  }
  if(anyDirty()){
    PENDWD=(ds>today())?today():ds;
    var names=[],k2,m2;
    for(k2 in UI.dirty)if(UI.dirty[k2]){m2=machById(k2);if(m2)names.push(m2.n);}
    var lb=names.length?(names.length>1?TX1('{0} 외 {1}종목',esc(names[0]),names.length-1):esc(names[0])):'';
    toast(TX1('<em>미저장</em> {0} — 저장하거나 <button class="tundo" data-act="dcd">DISCARD</button>',lb),7000);
    return false;
  }
  if(ds>today())ds=today();
  UI.wd=ds;UI.open=null;UI.hist=false;UI.esIdx=null;UI.draft={};UI.dirty={};
  /* 앱을 켤 때 14일치만 받아 온다. 그보다 앞으로 넘기면 그 날짜는 아직
     없는 구간이라 '기록 없음' 으로 보인다 — 필요한 만큼 더 당겨 온다.
     결과가 오면 hcNative 가 병합하고 열려 있는 화면을 다시 그린다. */
  try{
    if(hcOn()&&!HC.days[ds]){
      var back=daysAgo(ds);
      /* 그날 아무것도 안 먹었으면 받아 와도 HC.days 에 안 남는다. 그래서
         받아 온 범위를 따로 기억해 두지 않으면 그 날짜를 오갈 때마다
         같은 요청을 되풀이한다. */
      if(back>0&&back<=120&&back>(HC.back||14)){
        HC.back=Math.min(120,back+3);
        hcSave();
        hcPull(HC.back);
      }
    }
  }catch(eHc){}
  if(ds===today())loadDraft();
  return true;
}

  if(setWd(s))render();

  if(!(w>0)||!(r>0))return;
  var set=[Math.round(w*10)/10,cd?Math.round(r*10)/10:r];

      toast(TX('<em>범위 확인</em> 속도·경사가 일반 범위를 벗어남 — 칼로리는 상한으로 계산됨'));
  }

  if(!UI.draft[UI.open])UI.draft[UI.open]=[];

  }

    UI.draft[UI.open][UI.esIdx]=set;

    if(!cd){TMR.b=0;TMR.ts=Date.now();tmrMark=0;tmrSave();tmrDraw();restNotify();}

function brandGroups(list){
  var order=[],g={},etc=[],i,b;
  for(i=0;i<list.length;i++){b=(list[i].b||'').trim();if(b&&order.indexOf(b)<0)order.push(b);}
  for(i=0;i<list.length;i++){
    b=(list[i].b||'').trim();
    if(b)(g[b]=g[b]||[]).push(list[i]);
    else etc.push(list[i]);
  }
  var out=[];
  for(i=0;i<order.length;i++)out.push({n:order[i],items:g[order[i]]});
  if(etc.length)out.push({n:'ETC',items:etc});

      }

         더하면 종목마다 휴식 한 번이 유령으로 붙는다.
         칸이 한 자리 밀려 있었다. 쓰는 쪽(3821행)은 타이머가 돌고 앞선 세트가
         있을 때만 담으므로 st[k][3] 은 '세트 k 앞의 휴식' 이고 st[0][3] 은
         구조적으로 안 생긴다. 그런데 여기서는 '세트 q 뒤' 로 읽어 첫 칸(빈 값)
         은 기본 휴식으로 떨어지고 마지막 실측은 버려졌다 — 개수만 맞고 값이
         밀린 것이다. 그래서 알림 간격을 바꾸면 지난 날의 '하루 소비' 가
         소급해 움직였다. q>0 으로 고치면 세트 사이 N-1 번이 그대로 맞는다. */
      var met=SMET[S.m[i].p]||4.5;
      for(q=0;q<st.length;q++){
        var sm=setWorkMin(st[q][1])+(q>0?setRestMin(st[q][3]):0);
        k+=met*3.5*BW/200*sm;
        mn+=sm;
      }
    }
  }
  /* 종목의 부위를 CARDIO 로 바꾸면 이미 있던 근력 세트가 [분,속도,경사] 로
     읽혀 무게 70 이 70분이 된다. 근본 고침은 자료 구조 쪽이라 여기서는
     터무니없는 값이 화면까지 오지 못하게 막는다 — 하루 여섯 시간, 분당
     25kcal(유산소 상한과 같은 값)을 넘는 소비는 기록 오류다. */
  mn=Math.min(mn,360);
  k=Math.min(k,CARDIO_LIM.perMinMax*mn);
  /* 뺄 값은 이 앱이 실제로 쓰는 기본 소비율이어야 한다(1 MET 가 아니라).
     MET 식이 내장한 1 MET 기준선은 이 체중에서 하루 1,993kcal 인데
     기초대사는 1,737 이다 — 기초대사만 빼면 이중계상이 남는다. */
  var b=bmr(BW,BF);
  if(b>0)k-=b*ACT/1440*mn;
  return Math.max(0,Math.round(k));
}
/* 소비 칼로리 — 기초대사 x 활동계수 는 매일 같고, 운동분만 날마다 다르다.
   막대를 둘로 나눠 쌓으면 '오늘 운동이 얼마나 보탰나'가 바로 보인다. */
function kcalISO(t){
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function kcalMonday(back){
  var t=new Date();
  t.setDate(t.getDate()-((t.getDay()+6)%7)-7*(back||0));
  return t;
}
/* 한 주(월~일)의 날짜별 소비. 아직 오지 않은 날은 null 로 남긴다. */
function kcalWeek(back){
  var b=bmr(BW,BF);
  if(!b)return null;
  var base=Math.round(b*ACT),mon=kcalMonday(back),td=today();
  var days=[],i,tot=0,ex=0,n=0;
  for(i=0;i<7;i++){
    var t=new Date(mon);t.setDate(mon.getDate()+i);
    var ds=kcalISO(t);
    if(ds>td){days.push({d:ds,future:true});continue;}
    var e=dayExKcal(ds);
    days.push({d:ds,base:base,ex:e,tot:base+e,today:ds===td});
    tot+=base+e;ex+=e;n++;
  }
  return {mon:kcalISO(mon),days:days,tot:tot,ex:ex,n:n,avg:n?Math.round(tot/n):0,base:base};
}
/* 감량 현황 — 설정 손잡이가 아니라 읽는 값이라 분석탭에서 그린다.
   바로 위 kcalHtml() 이 소비를 주간 막대로 보여 주므로 섭취가 그 옆에 온다. */
/* 오늘은 아직 채울 시간이 있어 '남은 483' 이 맞지만, 지난 날이라면
   그건 '목표보다 483 덜 먹음' 이다. 같은 숫자라도 말을 갈라 준다. */
function gapTxt(left,isToday){
  var n=Math.abs(left).toLocaleString();
  if(left<0)return TX1('초과 {0}',n);
  if(isToday)return TX1('남은 {0}',n);
  return left===0?TX('목표 달성'):TX1('덜 먹음 {0}',n);
}

function kcalHtml(){
  var w=kcalWeek(0);
  if(!w)return '';
  var DN=TX('월,화,수,목,금,토,일').split(','),i;
  /* 축은 운동분 범위에 맞춘다. 기초대사를 섞으면 전체의 94%를 차지해
     날마다의 차이가 뭉개진다. */
  var mx=0;
  for(i=0;i<w.days.length;i++)if(!w.days[i].future&&w.days[i].ex>mx)mx=w.days[i].ex;
  var flat=(mx<=0);
  mx=(mx||1)*1.12;
  var dn=0;
  for(i=0;i<w.days.length;i++)if(!w.days[i].future&&w.days[i].ex>0)dn++;

  /* 막대만 있으면 그날이 많은 건지 적은 건지 견줄 데가 없다.
     운동한 날의 평균을 가로선으로 깔면 각 날이 그 위인지 아래인지 바로 읽힌다.
     하루뿐이면 평균이 곧 그날이라 선을 긋는 의미가 없다. */
  var avg=dn?w.ex/dn:0,avp=(dn>1&&avg>0)?Math.min(96,avg/mx*100):0;
  var h='<div class="lmsec"><div class="lmcap">'+TX('EXERCISE · 이번 주')+'</div><div class="kwk">';
  for(i=0;i<w.days.length;i++){
    var d=w.days[i],pc=d.future?0:Math.max(d.ex>0?4:0,d.ex/mx*100);
    h+='<div class="kwd'+(d.future?' fut':'')+(d.today?' now':'')+(!d.future&&d.ex<=0?' rest':'')+'">'
      +'<span class="kbar">'+(d.future||d.ex<=0?'':'<i class="kex" style="height:'+pc.toFixed(1)+'%"></i>')
      +'</span>'
      +'<b>'+DN[i]+'</b>'
      +'<u>'+(d.future?'':(d.ex>0?d.ex:'—'))+'</u></div>';
  }
  h+='</div>';
  h+='<div class="ctrow"><b class="k">'+TX('주 합계')+'</b><span class="v"><b>'+w.ex.toLocaleString()+'</b> kcal'
    +(dn?' · '+TX1('운동 <b>{0}</b>일 · 하루 <b>{1}</b>',dn,Math.round(w.ex/dn).toLocaleString()):'')+'</span></div>';
  /* 최근 4주 표와 설명 문장은 뺐다 — 이번 주만 보면 되고,
     기초대사를 왜 뺐는지는 도움말이 설명한다 */
  return h+'</div>';
}

function dayTDEE(ds){
  var b=bmr(BW,BF);
  if(!b)return 0;
  return Math.round(b*ACT+dayExKcal(ds));
}
function bhLoad(){
  var a=[];
  if(canLS){try{var x=JSON.parse(localStorage.getItem(KEY+'.bh')||'[]');if(Array.isArray(x))a=x;}catch(e){}}
  if(!a.length&&DEMO)return demoBH();
  return a;
}
function bhSave(a){
  if(!canLS)return;
  try{localStorage.setItem(KEY+'.bh',JSON.stringify(a.slice(-24)));}catch(e){}
}
function bhAdd(dd,w2,f2,m2){
  var a=bhLoad(),e={d:dd,w:w2,f:f2},i;
  if(m2>0)e.m=m2;
  for(i=0;i<a.length;i++)if(a[i].d===dd){
    /* 통째로 갈아치우고 있었다. 골격근은 선택 입력이라(bhCommit 이 빈 칸을
       0 으로 넘긴다) 같은 날짜로 체중만 고치면 전에 잰 골격근이 조용히
       사라졌다. 조용히가 문제다 — 없어진 줄 모르고, 감량 구성의 근손실
       판정이 제지방으로 슬며시 물러난다. 이번에 안 넣은 칸은 남긴다. */
    if(!(m2>0)&&a[i].m>0)e.m=a[i].m;
    a[i]=e;bhSave(a);return;
  }
  a.push(e);
  a.sort(function(x,y){return x.d<y.d?-1:1;});
  bhSave(a);
}
function bhDel(dd){
  var a=bhLoad().filter(function(x){return x.d!==dd;});
  bhSave(a);
}
/* 지금 체중은 '마지막으로 잰 것' 이다. 예전에는 기록 날짜가 오늘일 때만
   갱신해서, 어제 잰 것을 넣거나 날짜를 뒤로 적으면 체중이 기본값 78 에
   머물렀다. 체중은 기초대사부터 단백질 목표까지 전부의 밑바탕이라
   하나 어긋나면 다 어긋난다. */
/* 체중이 어디서 왔는지. 체지방은 체중계가 못 재므로 늘 인바디를 따른다.
   체중은 더 최근에 잰 쪽을 쓴다 — 인바디는 한 달에 한 번이고 체중계는 매일이다. */
function bwSrc(){
  var a=bhLoad(),ib=a.length?a[a.length-1]:null;
  var sd=swLast(),sw=sd?swAvg(sd,7):0;
  if(sw>0&&(!ib||sd>=ib.d))return {w:sw,f:ib?ib.f:0,src:'scale',d:sd,n:ib?ib.w:0};
  if(ib&&ib.w>0)return {w:Math.round(ib.w*10)/10,f:ib.f,src:'inbody',d:ib.d,n:sw};
  if(sw>0)return {w:sw,f:0,src:'scale',d:sd,n:0};
  return null;
}
function bhSync(){
  /* 데모 중에는 굳히지 않는다. bhLoad 가 DEMO 일 때 가짜 인바디를 돌려주므로
     bwSrc 가 그 값을 물어 오고, 여기서 .bw/.bf 에 써 버리면 데모를 끈 뒤에도
     남는다 — 실제로 체지방 19.7 이 굳어 있었다. 그 값은 기초대사를 거쳐
     '먹어도 되는 양' 까지 흘러간다. 보여 주는 것과 굳히는 것은 다른 일이다. */
  if(DEMO)return;
  var r=bwSrc();
  /* 체중계가 780kg 을 보내도 그대로 받던 자리 — 손으로 넣는 길(bhCommit)은
     이미 30~200 으로 묶여 있는데 자동으로 들어오는 길만 뚫려 있었다 */
  if(!r||!(r.w>=30&&r.w<=300))return;
  BW=r.w;
  if(r.f>=3&&r.f<=60)BF=Math.round(r.f*10)/10;
  if(canLS){try{localStorage.setItem(KEY+'.bw',String(BW));localStorage.setItem(KEY+'.bf',String(BF));}catch(e){}}
}
/* 하루치 섭취를 손으로 넣는다. 아이폰에는 Health Connect 가 없어 이것이
   유일한 길이고, 안드로이드에서도 동기화가 안 온 날을 메울 수 있다.
   열량만 넣어도 받는다 — 매크로를 모른다고 하루를 통째로 못 적을 일은 아니다. */
function manCommit(dd,kc,p2,c2,f2){
  if(!(kc>0&&kc<=10000))return false;
  if(!dd||!/^\d{4}-\d{2}-\d{2}$/.test(dd)||dd>today())dd=today();
  function g(v){return (v>=0&&v<=2000)?Math.round(v):0;}
  HC.days=HC.days||{};
  HC.days[dd]={kcal:Math.round(kc),p:g(p2),c:g(c2),f:g(f2),n:1,man:true};
  hcSave();
  return dd;
}
function bhCommit(dd,w2,f2,m2){
  if(!(w2>=30&&w2<=200)||!(f2>=3&&f2<=60))return false;
  if(!dd||!/^\d{4}-\d{2}-\d{2}$/.test(dd)||dd>today())dd=today();
  bhAdd(dd,Math.round(w2*10)/10,Math.round(f2*10)/10,(m2>=10&&m2<=60)?Math.round(m2*10)/10:0);
  bhSync();
  return dd;
}
/* 체중 한 줄기. 체중계와 인바디를 같은 자로 세운다 — 같은 날 둘 다
   있으면 체중계를 쓴다. 아침 공복이라 조건이 일정하기 때문이다. */
function wSeries(days){
  var m={},a=[],i,k,sc=0;
  var lim=new Date();lim.setDate(lim.getDate()-days);
  var li=lim.getFullYear()+'-'+('0'+(lim.getMonth()+1)).slice(-2)+'-'+('0'+lim.getDate()).slice(-2);
  var bh=bhLoad();
  for(i=0;i<bh.length;i++)if(bh[i].d>=li&&bh[i].w>0)m[bh[i].d]=bh[i].w;
  var w=HC.w||{};
  for(k in w){if(k>=li){var v=swDay(k);if(v>0){m[k]=v;sc++;}}}
  for(k in m)a.push([k,m[k]]);
  a.sort(function(x,y){return x[0]<y[0]?-1:(x[0]>y[0]?1:0);});
  return {a:a,sc:sc};
}
/* 최소제곱 기울기 kg/일. 두 점 뺄셈은 그 두 점이 어느 날 찍혔느냐로
   값이 통째로 흔들린다 — 하루 ±0.5kg 은 예사다. 점이 많을수록 안정된다. */
function wSlope(a){
  var n=a.length,i,sx=0,sy=0,sxx=0,sxy=0;
  if(n<2)return null;
  var t0=new Date(a[0][0]).getTime();
  for(i=0;i<n;i++){
    var x=(new Date(a[i][0]).getTime()-t0)/86400000,y=a[i][1];
    sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;
  }
  var d=n*sxx-sx*sx;
  return d?(n*sxy-sx*sy)/d:null;
}
/* 창이 비면 기준을 되돌리지 말고 창을 넓힌다. 인바디만 쓰면 6주에 한 번
   재기도 한다 — 다만 얼마나 넓혔는지는 밝힌다. */
function wTrend(){
  var wins=[28,56,120],i;
  for(i=0;i<wins.length;i++){
    var r=wSeries(wins[i]),a=r.a;
    if(a.length<2)continue;
    var span=Math.round((new Date(a[a.length-1][0])-new Date(a[0][0]))/86400000);
    if(span<7)continue;
    var sl=wSlope(a);
    if(sl===null)continue;
    return {rate:Math.round(sl*7*100)/100,n:a.length,span:span,win:wins[i],
            sc:r.sc,first:a[0][0],last:a[a.length-1][0]};
  }
  return null;
}
function paceCalc(bw,bf,gf){
  var lbm=bw*(1-bf/100);
  var tw=gf<bf?Math.round(lbm/(1-gf/100)*10)/10:bw;
  var remain=Math.round(Math.max(0,bw-tw)*10)/10;
  var r={tw:tw,remain:remain,ok:false,done:remain<=0,rate:0,days:0,eta:'',weeks:0,tag:''};
  /* 옛 방식은 35일 창에 드는 기록이 없으면 기준을 '가장 오래된 기록' 으로
     되돌렸다 — 최근 것만 쓰겠다면서 정반대로 제일 낡은 것을 집었다.
     여름에 찐 1kg 이 9월의 추세로 둔갑하던 자리다. 창이 비면 되돌리는 대신
     넓히고, 두 점 뺄셈 대신 회귀로 낸다. */
  var t=wTrend();
  if(!t)return r;
  r.ok=true;
  r.rate=t.rate;
  r.n=t.n;r.span=t.span;r.win=t.win;r.sc=t.sc;r.first=t.first;r.last=t.last;
  /* 무엇을 얼마나 보고 낸 값인지 — 84일치 기울기를 '지금' 으로 읽으면 안 된다 */
  r.how=(t.sc>0?'체중계':'인바디')+' '+t.n+'점 · 최근 '+t.span+'일';
  r.stale=t.win>28;
  if(r.done)return r;
  /* 0 은 늘어난 것이 아니라 제자리다 — 둘을 같은 말로 부르면 오해한다 */
  if(r.rate>0)r.tag='증량 추세';
  else if(r.rate===0)r.tag='변화 없음';
  else if(-r.rate>bw*0.01)r.tag='과속 — 근손실 주의';
  else if(-r.rate<WR*0.5)r.tag='페이스 부족';
  else r.tag='페이스 양호';
  if(r.rate<0){
    r.days=Math.round(remain/(-r.rate)*7);
    r.weeks=Math.max(1,Math.round(r.days/7));
    var eta=new Date();eta.setDate(eta.getDate()+r.days);
    r.eta=String(eta.getMonth()+1).padStart(2,'0')+'-'+String(eta.getDate()).padStart(2,'0');
  }
  return r;
}
/* paceInfo() 는 정의만 있고 부르는 데가 없어 뺐다 — 같은 값은
   식단 카드의 .dfoot 과 몸 갈래가 각자 그린다 */
function bodyLine(bw,bf,gf,hrm,act){
  bw=+bw;bf=+bf;gf=+gf;hrm=+hrm;act=+act||ACT;
  var z1=Math.round(hrm*0.6),z2=Math.round(hrm*0.7);
  if(!(bw>0&&bf>0))return 'Zone2 '+z1+'–'+z2+' bpm';
  var fat=bw*bf/100,lbm=bw-fat;
  var out=TX1('제지방 <b>{0}</b>kg · 기초 <b>{1}</b> × {2} = <b>{3}</b> kcal',lbm.toFixed(1),(bmr(bw,bf)||0).toLocaleString(),act,Math.round((bmr(bw,bf)||0)*act).toLocaleString());
  /* 어디서 온 값인지 밝힌다 — 인바디가 없으면 체지방은 기본값 20% 이고,
     그걸 실측처럼 보여 주면 하루 소비가 남의 숫자로 나오는 것을 모른다 */
  var sc=bwSrc();
  if(sc&&sc.src==='scale')
    out+='<br>'+TX1('체중 <b>{0}</b>kg — 체중계 7일 평균 (최근 {1})',sc.w,md(sc.d))
      +(sc.f>0?TX(' · 체지방은 인바디'):TX(' · <b class="warn">체지방은 기본값</b> — 인바디를 넣으면 실측으로 바뀜'));
  else if(sc&&sc.src==='inbody')
    out+='<br>'+TX('체중·체지방은 인바디 기록에서 자동 반영됨')
      +(sc.n>0?TX1(' (체중계 {0}kg 은 더 오래됨)',sc.n):'');
  else
    out+='<br>'+TX1('<b class="warn">인바디도 체중계 기록도 없음</b> — 기본값 {0}kg / {1}% 로 계산 중',BW,BF);
  if(HC.wp===false&&hcOn())
    out+='<br>'+TX('체중 읽기 권한이 꺼져 있음 — 삼성헬스 체중을 쓰려면 허용 필요');
  return out;
}
/* 매크로 바닥을 만질 때 탄수가 얼마나 밀리는지 보여 준다.
   탄수는 목표가 아니라 '남는 몫' 이라 지방 눈금이 조용히 탄수를 정한다.
   그 물림이 화면에 없으면 왜 탄수 목표가 그 값인지 알 길이 없다. */
function macroLine(ppk,fpk){
  if(!(BW>0))return TX('체중이 없어 매크로 눈금을 못 냄');
  var goal=0;
  try{goal=Math.round(nutriFacts().todayTargetIntake||0);}catch(e){}
  var p=Math.round(BW*ppk),f=Math.round(BW*fpk);
  var out=TX1('단백질 <b>{0}</b>g · 지방 <b>{1}</b>g',p,f);
  if(!(goal>0))return out+TX(' — 목표 열량이 아직 없어 탄수 몫은 못 냄');
  var left=goal-p*4-f*9;
  if(left<=0)
    return out+'<br>'+TX1('<b class="warn">둘만으로 목표를 넘김</b> — {0}kcal 인데 목표가 {1}kcal 라 탄수 몫이 없음. 지방이나 단백질을 낮춰야 함',
      (p*4+f*9).toLocaleString(),goal.toLocaleString());
  out+=TX1(' · 탄수 <b>{0}</b>g',Math.round(left/4))
    +'<br>'+TX1('목표 {0}kcal 에서 {1} + {2} 를 못박고 남은 {3} 이 탄수',
      goal.toLocaleString(),(p*4).toLocaleString(),(f*9).toLocaleString(),left.toLocaleString())
    /* 이 한 줄이 요점이다 — 지방 칸을 만지면 탄수가 따라 움직인다 */
    +'<br>'+TX1('지방을 <b>0.1</b> 올리면 탄수가 <b>{0}g</b> 줄어듦',Math.round(BW*0.225));
  return out;
}
/* 유산소 칼로리 추정 — 러닝머신: ACSM 대사 공식(걷기<7km/h<달리기), 계단: MET 근사 */
/* 사람이 낼 수 있는 범위 — 오입력 한 건이 TDEE 전체를 무너뜨리지 않게 함 */
var CARDIO_LIM={minMax:300,vTread:20,vStair:30,incMax:0.2,perMinMax:25};
/* 회전 계단 한 칸 높이 (m) — Matrix ClimbMill 은 8인치 */
var STAIR_H=0.2032;
function cardioOut(st,name){
  var v=+st[1]||0,inc=+st[2]||0;
  var vm=isTreadName(name)?CARDIO_LIM.vTread:CARDIO_LIM.vStair;
  return (v>vm)||(inc>CARDIO_LIM.incMax*100)||((+st[0]||0)>CARDIO_LIM.minMax);
}
function kcalSet(st,name){
  var min=+st[0]||0,v=+st[1]||0,inc=(+st[2]||0)/100;
  if(!(min>0)||!(v>0))return 0;
  min=Math.min(min,CARDIO_LIM.minMax);
  inc=Math.max(0,Math.min(CARDIO_LIM.incMax,inc));
  var perMin;
  var fm=fixedMet(name);
  if(fm>0){
    /* 1 MET = 3.5 mL/kg/min, 5 kcal per L O2 */
    perMin=fm*3.5*BW/200;
    perMin=Math.max(0,Math.min(CARDIO_LIM.perMinMax,perMin));
    return perMin*min;
  }
  if(isTreadName(name)){
    v=Math.max(0.5,Math.min(CARDIO_LIM.vTread,v));
    var mmin=v*1000/60;                       /* km/h -> m/min */
    /* ACSM 대사 공식. 걷기는 3~6km/h, 달리기는 8km/h 이상에서만 유효하고
       그 사이는 빠른 걸음인지 느린 조깅인지 식으로 가릴 수 없다.
       경계를 하나 찍으면 그 지점에서 값이 튄다(6.9 -> 7.0 에서 79%).
       두 식을 그 구간에서 비율로 섞어 이어 붙인다. */
    var wk3=3.5+0.1*mmin+1.8*mmin*inc;        /* 걷기 */
    var rn3=3.5+0.2*mmin+0.9*mmin*inc;        /* 달리기 */
    var mix=v<=6?0:(v>=8?1:(v-6)/2);
    var vo2=wk3+(rn3-wk3)*mix;
    perMin=vo2*BW/1000*5;                     /* mL/kg/min -> L/min -> kcal (5kcal/L) */
  }else{
    /* 회전 계단(Matrix ClimbMill 기준) — 레벨 1~25 가 분당 24~162 걸음,
       계단 높이 8인치(0.2032m). 오르기만 하고 내려오는 일은 기계가 하므로
       벤치 스텝의 내려오는 몫(1.33배)과 앞으로 나아가는 몫(0.2x걸음수)이
       없다. 수직 성분만 센다. */
    v=Math.max(0.5,Math.min(CARDIO_LIM.vStair,v));
    var spm=Math.min(162,24+5.75*(v-1));
    var vo2s=3.5+1.8*STAIR_H*spm;
    perMin=vo2s*BW/1000*5;
  }
  perMin=Math.max(0,Math.min(CARDIO_LIM.perMinMax,perMin));
  return perMin*min;
}
function kcalSess(sets,name){
  var k=0,i;for(i=0;i<sets.length;i++)k+=kcalSet(sets[i],name);
  return Math.round(k);
}
/* 이름으로 종류를 알아내는 규칙. 헬스장에서 실제로 쓰는 말들을 담는다 —
   '천계' 하나 빠져 있어서 계단이 러닝머신으로 잡히고 레벨을 시속으로
   읽고 있었다. 새 기구를 넣을 때 여기 없는 이름을 쓰면 또 어긋난다. */
function hasAny(n,list){n=String(n||'').toLowerCase();
  for(var i=0;i<list.length;i++)if(n.indexOf(list[i])>=0)return true;
  return false;}
/* 유산소 기구 종류. 이름 추측은 어느 키워드에도 안 걸리면 전부 트레드밀로
   떨어뜨려 레벨을 km/h 로 읽는다 — '바이크' 45분 레벨12 가 441 대신 783kcal 이
   되던 이유다. 기구에 값으로 달아 두면 그것이 절대 기준이고, 없을 때만 추측한다. */
var CTYPES=[
  {k:'tread',n:'트레드밀',d:'걷기·달리기 · 속도 km/h'},
  {k:'walk', n:'걷기',    d:'산책 · km/h · 유산소 합계에서 빼고 NEAT 로 셈'},
  {k:'stair',n:'계단',    d:'스텝밀·천국의계단 · 레벨'},
  {k:'bike', n:'사이클',  d:'실내자전거 · 레벨'},
  {k:'row',  n:'로잉',    d:'로잉머신 · 레벨'},
  {k:'ellip',n:'일립티컬', d:'크로스트레이너 · 레벨'}
];
/* 이름·설명은 화면에 그대로 나가므로 옮긴 사본을 준다. CTYPES 원본은 한국어로
   둔다 — 그것이 사전 열쇠이고, 앱을 켠 뒤 언어를 바꿔도 따라와야 하기 때문이다. */
function ctOf(k){
  var c=CTYPES[0],i;
  for(i=0;i<CTYPES.length;i++)if(CTYPES[i].k===k){c=CTYPES[i];break;}
  return {k:c.k,n:TX(c.n),d:TX(c.d)};
}
function ctOk(k){for(var i=0;i<CTYPES.length;i++)if(CTYPES[i].k===k)return true;return false;}
/* 머신 객체와 이름 문자열을 둘 다 받는다 — 옛 호출부가 이름만 넘기기 때문 */
function cKind(x){
  if(x&&typeof x==='object'){
    if(x.ct&&ctOk(x.ct))return x.ct;
    x=x.n;
  }
  if(nmWalk(x))return 'walk';
  if(nmStair(x))return 'stair';
  if(nmBike(x))return 'bike';
  if(nmRow(x))return 'row';
  if(nmEllip(x))return 'ellip';
  return 'tread';
}
function nmStair(n){return hasAny(n,
  ['stair','climb','클라임','계단','천계','천국','스텝밀','스탭밀','step mill','stepmill',
   '스테퍼','스텝퍼','stepper','climbmill','클라임밀','c5x','c50','c-50']);}
/* 러닝 대사식은 '속도 = 지면을 달린 속도' 를 전제한다. 사이클·로잉·
   일립티컬의 속도계는 뜻이 달라 그 식에 넣으면 터무니없이 커진다.
   Cycle 40분 25km/h 가 하루 목표를 +938kcal 밀어 올리던 이유다. */
/* hasAny 는 부분문자열이라 긴 낱말만 넣으면 짧은 쪽이 안 걸린다 —
   '에어바이크'는 '바이크'를 포함하지만 그 반대는 아니고, '스핀'은 '스피닝'
   안에 없다(스·피·닝). 어근을 직접 넣는다. 안 걸리면 러닝 식으로 떨어져
   레벨을 km/h 로 읽는다 — 45분 레벨12 가 441 대신 783kcal 이 된다. */
function nmBike(n){return hasAny(n,
  ['cycle','bike','바이크','사이클','싸이클','자전거','spin','스핀','스피닝',
   '어썰트','assault','에어바이크','air bike','실내자전거']);}
function nmRow(n){return hasAny(n,['row','로잉','로워','노젓','concept2','컨셉2']);}
function nmEllip(n){return hasAny(n,
  ['ellip','일립','엘립','크로스트레이너','cross trainer','crosstrainer','아크트레이너','arc trainer']);}
/* 아래 넷은 종류 하나로 갈린다 — 예전 호출부가 그대로 쓰도록 이름을 남겨 둔다 */
function isStairName(x){return cKind(x)==='stair';}
function isBikeName(x){return cKind(x)==='bike';}
function isRowName(x){return cKind(x)==='row';}
function isEllipName(x){return cKind(x)==='ellip';}
/* 러닝 대사식을 쓰는 것 — 트레드밀과 걷기 */
function isTreadName(x){var k=cKind(x);return k==='tread'||k==='walk';}
/* 속도 단위가 러닝과 다른 기구는 고정 MET 로 센다 (ACSM 표 중간값) */
function fixedMet(x){
  var k=cKind(x);
  if(k==='bike'||k==='row')return 7.0;
  if(k==='ellip')return 5.0;
  return 0;
}
function hintHtml(name){   /* name 은 머신 객체도 받는다 */
  var parts=[];
  var ph=isTreadName(name)?paceOf(UI.r):'';
  if(ph)parts.push('pace ≈ <b>'+ph+'</b>');
  var kc=kcalSet([parseFloat(String(UI.w).replace(',','.'))||0,parseFloat(String(UI.r).replace(',','.'))||0,parseFloat(String(UI.ci).replace(',','.'))||0],name);
  if(kc>0)parts.push('≈ <b>'+Math.round(kc)+' kcal</b>');
  return parts.join(' · ');
}
function paceOf(v){
  v=parseFloat(String(v).replace(',','.'));
  if(!(v>=3&&v<=25))return '';
  var sec=Math.round(3600/v);
  return Math.floor(sec/60)+"'"+String(sec%60).padStart(2,'0')+'"/km';
}
function partCnt(){
  var now=new Date();var dow=(now.getDay()+6)%7;
  var mon=new Date(now);mon.setDate(now.getDate()-dow);
  function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},i,t;
  for(i=0;i<7;i++){t=new Date(mon);t.setDate(mon.getDate()+i);days[iso(t)]=1;}
  var out={'CHEST':0,'BACK':0,'SHOULDERS':0,'LEGS':0,'ARMS·ETC':0};
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];
    if(isCard(m.p)||typeof out[m.p]==='undefined')continue;
    var a=S.l[m.i]||[],j;
    for(j=0;j<a.length;j++)if(days[a[j].d]&&a[j].s.length)out[m.p]+=hardOf(a[j].s).n;
  }
  out.CARDIO=wkCardio().z2;
  return out;
}
/* 근육별로 '가벼워서 버린' 세트 수. subCnt 와 같은 창·같은 길로 센다 —
   두 수가 다른 창을 보면 '유효 6 + 가벼움 3 이 MEV 8 을 넘는다' 가 거짓이 된다.
   hardOf 의 반환형은 안 바꾼다(sc 를 쓰는 자리가 여럿이라 전부 깨진다). */
function subEasy(){
  var now=new Date();var dow=(now.getDay()+6)%7;
  var mon=new Date(now);mon.setDate(now.getDate()-dow);
  function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},i,t;
  for(i=0;i<7;i++){t=new Date(mon);t.setDate(mon.getDate()+i);days[iso(t)]=1;}
  var out={},bi;
  for(bi=0;bi<SUBS.length;bi++)out[SUBS[bi].k]=0;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];
    if(isCard(m.p))continue;
    var k=subOf(m);
    if(!k)continue;
    var a=S.l[m.i]||[],j;
    for(j=0;j<a.length;j++)if(days[a[j].d]&&a[j].s.length)out[k]+=hardOf(a[j].s).easy;
  }
  return out;
}
function subCnt(){
  var now=new Date();var dow=(now.getDay()+6)%7;
  var mon=new Date(now);mon.setDate(now.getDate()-dow);
  function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},i,t;
  for(i=0;i<7;i++){t=new Date(mon);t.setDate(mon.getDate()+i);days[iso(t)]=1;}
  var out={},bi2;
  for(bi2=0;bi2<SUBS.length;bi2++)out[SUBS[bi2].k]=0;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];
    if(isCard(m.p))continue;
    var k=subOf(m);
    if(!k)continue;
    var a=S.l[m.i]||[],j;
    for(j=0;j<a.length;j++)if(days[a[j].d]&&a[j].s.length)out[k]+=hardOf(a[j].s).n;
  }
  return out;
}
function wkCardio(){
  var now=new Date();var dow=(now.getDay()+6)%7;
  var mon=new Date(now);mon.setDate(now.getDate()-dow);
  function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},i,t;
  for(i=0;i<7;i++){t=new Date(mon);t.setDate(mon.getDate()+i);days[iso(t)]=1;}
  var z2=0,nt=0,kc=0,km=0,dset={},k,j;
  for(i=0;i<S.m.length;i++){
    if(!isCard(S.m[i].p))continue;
    var wk2=isWalkName(S.m[i]),tr2=isTreadName(S.m[i]);
    var a=S.l[S.m[i].i]||[];
    for(j=0;j<a.length;j++){
      if(!days[a[j].d]||!a[j].s.length)continue;
      for(k=0;k<a[j].s.length;k++){
        var mn2=+a[j].s[k][0]||0,sp2=+a[j].s[k][1]||0;
        if(wk2)nt+=mn2;else{z2+=mn2;dset[a[j].d]=1;}
        if(tr2&&!wk2&&sp2>0)km+=mn2/60*sp2;

      if(!wk2)kc+=kcalSess(a[j].s,S.m[i]);
    }
  }
  var d=0;for(k in dset)d++;
  return {z2:Math.round(z2),neat:Math.round(nt),days:d,kcal:Math.round(kc),km:Math.round(km*10)/10};
}
var AK='',AIOUT='',PR='',LM='gem',AIAT='',AIBY='',AIRUN=false;

function wkSets(){

  }
  q.reverse();                       /* a 는 최신이 앞, q 는 오래된 것이 앞 */
  return {a:a,q:q,skip:skip};
}
/* 세션 간 변화율의 SD 에서 한 점의 변동폭을 낸다 — 차의 SD 는 sigma 곱하기
   루트2 다. 진짜 추세가 섞여 과대추정되지만 그쪽이 헛경보를 줄이는 방향이다. */
function pgSigma(q){
  var d=[],i,t=0,v=0;
  for(i=1;i<q.length;i++)if(q[i-1]>0)d.push((q[i]-q[i-1])/q[i-1]*100);
  if(d.length<3)return PG_SIG;
  for(i=0;i<d.length;i++)t+=d[i];
  t/=d.length;
  for(i=0;i<d.length;i++)v+=(d[i]-t)*(d[i]-t);
  return Math.max(2,Math.min(8,Math.round(Math.sqrt(v/(d.length-1))/Math.SQRT2*10)/10));
}
/* 앞뒤 묶음 평균 — 6세션이면 3+3, 4~5세션이면 2+2, 그 아래는 판정 안 함.
   묶음으로 견주면 잡음이 루트k 배 줄어든다 */
function pgBlock(q){
  var n=q.length,k=n>=6?3:(n>=4?2:0),i,a=0,b=0;
  if(!k)return null;
  for(i=n-k;i<n;i++)a+=q[i];
  for(i=n-2*k;i<n-k;i++)b+=q[i];
  a/=k;b/=k;
  if(!(b>0))return null;
  return {k:k,now:Math.round(a*10)/10,prev:Math.round(b*10)/10,
          pct:Math.round((a-b)/b*1000)/10};
}
/* 평균은 드롭세트 하나에 통째로 끌려간다 — 중앙값을 쓴다 */
function pgMed(v){
  if(!v.length)return 0;
  v=v.slice().sort(function(x,y){return x-y;});
  var hf=v.length>>1;
  return v.length%2?v[hf]:Math.round((v[hf-1]+v[hf])/2*10)/10;
}
function pgReps(a,i0,i1){
  var r=[],i,j;
  for(i=i0;i<Math.min(i1,a.length);i++)
    for(j=0;j<a[i].s.length;j++){var x=+a[i].s[j][1]||0;if(x>0)r.push(x);}
  return pgMed(r);
}
function pgHard(a,i0,i1){
  var t=0,n=0,i;
  for(i=i0;i<Math.min(i1,a.length);i++){t+=hardOf(a[i].s).n;n++;}
  return n?Math.round(t/n*10)/10:0;
}
/* 정체 판정은 3~5주를 보는데 근거를 한 주로 대면 창이 안 맞는다. subCnt 은
   이번 주 누적뿐이라 화요일 아침이면 거의 모든 근육이 MEV 미만으로 나오고,
   무엇보다 다섯 주짜리 정체가 '이번 주 아직 안 했다' 로 설명된다.
   최근 4주의 주당 평균을 따로 센다 — 그러면 주 경과와 무관해진다.
   cx 에 붙여 두고 갈래 한 번 그리는 동안 종목마다 다시 안 세게 한다. */
function pgSubAvg(sk,cx){
  if(!sk)return 0;
  if(cx.sa[sk]!==undefined)return cx.sa[sk];
  var wk=4,lim=new Date();lim.setDate(lim.getDate()-wk*7);
  var li=lim.getFullYear()+'-'+('0'+(lim.getMonth()+1)).slice(-2)+'-'+('0'+lim.getDate()).slice(-2);
  var t=0,i,j;
  for(i=0;i<S.m.length;i++){
    var m2=S.m[i];
    if(isCard(m2.p)||subOf(m2)!==sk)continue;
    var a2=S.l[m2.i]||[];
    for(j=0;j<a2.length;j++)
      if(a2[j].d>=li&&a2[j].s&&a2[j].s.length)t+=hardOf(a2[j].s).n;
  }
  /* 늘 4로 나누면 한 주를 통째로 쉬었을 때 평균이 실제의 4분의 3으로
     희석돼 MEV 미만으로 오진된다. 훈련할 수 있었던 날이 하나도 없던 주는
     분모에서 뺀다. */
  var act=0,wi,di;
  for(wi=0;wi<wk;wi++){
    for(di=0;di<7;di++)if(!isOff(dsAgo(wi*7+di))){act++;break;}
  }
  cx.sa[sk]=Math.round(t/Math.max(1,act)*10)/10;
  return cx.sa[sk];
}
/* 같은 이름이 둘이면 어느 쪽인지 알 수 없다 — Standing Lateral Raise 가
   두 줄 나란히 뜨던 자리다. 목록 화면이 이미 쓰는 라인명으로 가른다. */
function pgName(m){
  var c=0,i;
  for(i=0;i<S.m.length;i++)if(S.m[i].n===m.n)c++;
  if(c<2)return m.n;
  var ln=cleanLine(m.ln)||String(m.b||'').toUpperCase();
  return ln?m.n+' '+ln:m.n;
}

/* 원인은 하나만 낸다 — 다섯을 동시에 던지면 무엇이 들었는지 알 수 없다.
   순서: 지표를 못 믿으면 진단하지 않는다 → 맥락이 목표를 바꾸면 결함이
   아니다 → 안 한 것이 과하게 한 것을 이긴다.
   회복 갈래(deloadSignal)는 RIR '하락' 을 보고 여기는 '상승' 을 본다. */
function pgWhy(m,a,cx,sc){
  var i,r0=pgReps(a,0,2),rb=pgReps(a,2,6);
  var v0=rirAvg(a[0].s),v1=a.length>1?rirAvg(a[1].s):null,v2=a.length>2?rirAvg(a[2].s):null;
  /* 지역 이름을 LM 으로 — L 로 두면 이 함수 안에서 번역 함수 TX() 이 가려진다 */
  var sk=subOf(m),LM=sk?LMK[sk]:null,sv=sk?(sc[sk]||0):0;
  var mrv=LM?Math.round(LM[3]*0.8):0;
  var av=pgSubAvg(sk,cx);   /* 최근 4주 주당 평균 — 판정 창과 같은 자로 잰다 */

  /* Epley 는 반복 수에 선형이라 5회 세션과 12회 세션의 e1RM 은 서로 다른
     자를 댄 값이다. 잣대가 바뀌었으면 진단하지 않는다. */
  if(r0>0&&rb>0&&Math.abs(r0-rb)>=3)
    return {c:'반복 바뀜',w:'반복 '+rb+'\u2192'+r0+'회 · 다른 반복대의 값',drop:true};

  /* 회피 목표 근육에 자극이 쌓였다 — 앱 어디서도 아직 안 잡던 신호다 */
  if(cx.wk>=40&&sk&&STG[sk]===0&&sv>0)
    return {c:'회피 근육',w:TX1('{0} 회피 목표 · 이번 주 {1}세트',TX(subName(sk)),sv),drop:false};

  /* 안 한 것이 과하게 한 것을 이긴다 */
  var ago=daysAgo(a[0].d);
  if(ago>=21)return {c:'자극 공백',w:TX1('마지막 기록 {0}일 전 · 디트레이닝 구간',ago),drop:false};
  if(a.length>1){
    var g01=pgGapD(a[0],a[1]);
    /* '자극 공백' 은 프로그래밍이 비었다는 주장이라 달력이 아니라 훈련할
       수 있었던 날로 세야 한다 — 그 사이 사흘을 쉬기로 했으면 건너뛴
       기회는 그만큼 적다. 바로 위 디트레이닝(ago>=21)은 반대로 달력
       그대로다: 근육은 왜 쉬었는지 모른다. */
    var gv=g01,gb=daysAgo(a[0].d),gi;
    for(gi=1;gi<g01;gi++)if(isOff(dsAgo(gb+gi)))gv--;
    if(gv>=10)return {c:'자극 공백',
      w:gv<g01?TX1('훈련 가능 {0}일 비어 있음 (달력 {1}일)',gv,g01)
              :TX1('훈련 가능 {0}일 비어 있음',gv),drop:false};
  }
  var w28=0;
  for(i=0;i<a.length;i++)if(daysAgo(a[i].d)<28)w28++;
  if(w28>0&&w28<=2&&a.length>w28)
    return {c:'빈도 부족',w:TX1('4주 {0}회 · 자극 간격 과다',w28),drop:false};

  /* 근육 총량보다 종목 단위 삭감이 인과가 직접적이다 */
  var h0=pgHard(a,0,1),hb=pgHard(a,1,4);
  if(hb>0&&h0<=hb*0.7)
    return {c:'세트 감소',w:'유효 세트 '+hb+'\u2192'+h0+' · 기준선 70% 밑',drop:false};

  /* 세부 갈래가 눈금으로 자리를 보여 주므로 여기서는 한 줄만 인용한다.
     이번 주가 아니라 4주 평균이다 — 판정이 보는 창과 같은 자여야 한다. */
  if(LM&&LM[0]>0&&av<LM[0])
    return {c:'볼륨 부족',w:TX1('{0} 주 {1}세트 · MEV {2} 미만',TX(subName(sk)),av,LM[0]),drop:false};

  /* 진전이 없는데 실패에 더 가까워졌다. 혼자가 아니면 전신 피로다 */
  var fw=[];
  if(v0!==null&&v2!==null&&v2-v0>=1)fw.push('RIR '+v2+'\u2192'+v0);
  if(cx.streak>=4)fw.push(TX1('연속 {0}일',cx.streak));
  if(cx.dn>=3)fw.push(TX1('퇴행 {0}종목 동반',cx.dn));
  if(fw.length>=2)return {c:'회복 부족',w:fw.slice(0,2).join(' · '),drop:false};

  /* 세트 수만으로 과다를 선언하지 않는다 — RIR 상승을 AND 로 건다 */
  /* 여기만 L 로 남아 있었다. 5303 에서 지역 이름을 LM 으로 바꾸면서 빠뜨렸고,
     전역 L(옛 번역 함수)은 TX 로 개명해 없앤 뒤라 아무것도 안 가리켰다 —
     이 줄에 닿는 순간 ReferenceError 로 pgWhy 가 통째로 터진다. */
  if(LM&&mrv>0&&av>mrv&&v0!==null&&v2!==null&&v2-v0>=1)
    return {c:'볼륨 과다',w:TX1('{0} 주 {1}세트 · 보정 MRV {2} 초과',TX(subName(sk)),av,mrv),drop:false};

  /* 실패까지 가면 비례하는 이득 없이 피로만 크게 는다 */
  if(v0!==null&&v1!==null&&v0<=0.5&&v1<=0.5)
    return {c:'실패 근처',w:'RIR '+v1+'\u2192'+v0+' · 2세션 연속 실패 근처',drop:false};

  /* Epley 상 무게 +2.5% 는 반복 1회(3.3%)보다 작다. 2회를 잃으면 산수로
     순손실이 확정된다. 어시스트는 숫자가 클수록 약하므로 effOf 를 거친다 */
  if(a.length>1){
    var w0=effOf(m,topOfM(m,a[0].s),a[0].d),w1=effOf(m,topOfM(m,a[1].s),a[1].d);
    var r1=pgReps(a,1,2);
    if(w1>0&&w0>=w1*1.02&&r1>0&&r0>0&&r1-r0>=2)
      return {c:'무게 과욕',w:TX1('무게 +{0}kg · 반복 -{1}회',fmtW(w0-w1),Math.round(r1-r0)),drop:false};
  }

  /* Epley 유효 범위 밖에서는 진단 자체가 신뢰를 잃는다 */
  if(r0>0&&(r0<6||r0>12))
    return {c:'반복 이탈',w:TX1('반복 {0}회 · 6~12 밖',r0),drop:false};

  /* 신기록 직후의 정체는 고칠 결함이 아니라 자극 갱신 시점이다.
     'best 의 98% 이상' 으로 잡으면 평평하기만 해도 걸려서 원인 판별이 거기서
     멈춘다 — 직전 세션이 실제로 기록을 갈아치웠을 때만 고원이라 부른다. */
  var pp=prOf(m,a[0].d);
  if(pp&&pp.isPR)
    return {c:'신기록 뒤',w:TX('직전 세션이 역대 최고 · 갱신 뒤 고원'),drop:false};

  /* 무게도 반복도 그대로면 자극이 같은 자리에 머문 것이다. 데이터가 말할 수
     있는 마지막 사실이고, 정체의 가장 흔한 까닭이기도 하다 — 아무 규칙도
     안 걸렸다며 '특정 불가' 로 넘기면 화면이 다시 아무 말도 안 하게 된다. */
  if(a.length>=3){
    var pw=topOfM(m,a[0].s),pk=1,pj;
    for(pj=1;pj<Math.min(a.length,3);pj++){if(topOfM(m,a[pj].s)!==pw)break;pk++;}
    if(pk>=3&&r0>0&&rb>0&&r0===rb)
      return {c:'변화 없음',w:TX1('{0}kg {1}회 · {2}세션 그대로',fmtW(effOf(m,pw,a[0].d)),r0,pk),drop:false};
  }

  /* 수면·스트레스는 데이터에 없다. 없는 것을 있는 척하지 않는다 */
  var hu=hardOf(a[0].s);
  if(hu.unk>0)
    return {c:'원인 불명',w:TX1('RIR 미입력 {0}세트 · 회복 판정 불가',hu.unk),drop:false};
  return {c:'원인 불명',w:TX('훈련 기록만으로는 특정 불가 · 기록 밖 요인'),drop:false};
}

/* heroProg 이 지목한 한 종목을 다시 본다.
   k: 'act' 손댈 것 / 'keep' 감량 중 유지 / 'obs' 판정 보류 */
function pgDiag(x,kind,cx,sc){
  var m=x.i?machById(x.i):null;
  var d={id:x.i||'',n:x.n,kind:kind,k:'obs',c:'기록 부족',w:'',sub:'',pct:x.p||0,wk:1,ns:0,p:''};
  if(!m)return d;
  d.p=m.p;
  var ss=pgSess(m),a=ss.a,q=ss.q;
  if(a.length<2)return d;
  var pskip=ss.skip?TX1(' · e1RM 미산출 {0}세션 제외',ss.skip):'';
  var sig=pgSigma(q),bl=pgBlock(q);
  var span=pgGapD(a[0],a[a.length-1]);
  d.n=pgName(m);
  d.ns=q.length;
  d.wk=Math.max(1,Math.round(span/7));
  d.sub=TX1('{0}세션 {1}주',q.length,d.wk);
  /* 세션 두 개 뺄셈은 표본이 2다. 반복 한 회가 Epley 로 2.4~2.9% 인데 그
     위의 ±0.5% 문턱은 잡음의 5분의 1이라 퇴행은 우연으로도 켜지고 정체는
     반대로 거의 안 켜진다. 그래서 묶음끼리 견주고 문턱을 그 종목이 실제로
     보인 변동폭의 배수로 잡아 한 번 더 거른다. */
  if(!bl){d.sub+=TX(' · 원인 판정은 4회부터')+pskip;return d;}
  var thr=Math.round(sig/Math.sqrt(bl.k)*Math.SQRT2*PG_Z*10)/10;
  d.pct=bl.pct;
  d.sub=TX1('{0}세션 · 변동폭 ±{1}%',q.length,thr)+pskip;
  /* 적자에서 e1RM 유지는 결함이 아니라 목표 달성이다 — 목록에서 빼낸다.
     감량 중에 볼륨을 올리라는 진단은 해롭다. 퇴행은 감량 중이어도 남긴다. */
  /* 원인 칩이 '표본' 인 채로 목록에 나오면 뜻이 어긋난다 — 표본이 모자란
     것이 아니라 감량 중이라 유지가 정상인 것이다 */
  if(cx.cut&&kind==='st'&&Math.abs(bl.pct)<=2){d.k='keep';d.c='유지 정상';return d;}
  /* 어시스트 유효부하는 '그날 체중 − 보조무게' 다. 체중이 내려가면 같은
     보조무게로도 유효부하가 내려간다 — 78→73kg 이면 보조 30kg 을 그대로
     써도 48→43kg, -10.4% 다. 아무것도 안 했는데 확정 퇴행이 되고 거기에
     그럴듯한 원인까지 붙는다. 하락분을 체중이 대부분 설명하면 근력이
     빠진 것이 아니므로 목록에서 빼낸다. */
  if(isAssist(m)&&bl.pct<0){
    var pb0=bwOn(a[0].d),pb1=bwOn(a[a.length-1].d);
    if(pb0>0&&pb1>0&&pb0<pb1&&bl.prev>0){
      var pbw=(pb0-pb1)/bl.prev*100;               /* 체중이 설명하는 몫, 음수 */
      if(pbw<=bl.pct*0.6){d.k='keep';d.c='체중 영향';return d;}
    }
  }
  if(bl.pct<=-thr){
    /* 확정 퇴행 */
  }else if(bl.pct>=thr){
    d.c='오르는 중';return d;
  }else if(kind==='st'&&q.length>=4&&span>=21){
    /* 확정 정체. 정체의 주장은 '이만큼 오래 안 움직였다' 이므로 세션 수보다
       기간을 문턱으로 삼는다 — 주 1회 도는 종목에 6세션을 요구하면 확정까지
       여섯 주가 걸려 구획이 몇 주간 통째로 빈다.
       신기록 가드는 두지 않는다. 완전히 평평한 수열은 자기가 곧 최고라
       언제나 신기록으로 잡혀 정체를 통째로 삼켰다 — 실측으로 넷이 전부
       사라졌다. 정말 신기록을 막 세웠다면 묶음 비교가 상승으로 나와 위의
       반등 가지에서 이미 빠져나간다. 여기 남는 것은 평평한 것뿐이다. */
  }else{
    d.c='차이 미미';return d;
  }
  var g=pgWhy(m,a,cx,sc);
  d.c=g.c;d.w=g.w;d.k=g.drop?'obs':'act';
  return d;
}

/* 타일을 누르면 나오는 목록. .zrow 는 한 줄이 50px 이라 열한 줄이면 550px 다 —
   여기는 이름과 값만 있으면 되므로 훨씬 좁은 줄을 쓴다.
   값 칸의 규칙은 손댈 것과 같다: 퇴행이면 변화율, 정체면 몇 주째, 근거가
   모자라 판정을 못 한 것이면 몇 세션인지. 무엇이 모자란지가 곧 그 줄이
   거기 있는 이유다. */
var PGP=['SHOULDERS','BACK','CHEST','LEGS','ARMS·ETC'];
function pgList(items,empty){
  if(!items.length)return '<div class="pgl"><div class="pgli mt">'+esc(empty)+'</div></div>';
  /* 열 줄이 넘어가면 이름만 죽 늘어서서 어디가 어디인지 안 보인다.
     부위가 곧 사람이 찾는 축이므로 부위로 묶는다 — 묶음 머리가 긴 목록의
     눈금 노릇을 하고, 줄 사이 선은 묶음 안에서만 긋는다. */
  var by={},h='',i,j,x,k;
  for(i=0;i<items.length;i++){x=items[i];k=x.p||'기타';(by[k]||(by[k]=[])).push(x);}
  var ord=PGP.concat(['기타']).filter(function(p){return by[p];});
  /* 부위가 하나뿐이면 머리를 안 단다 — 한 덩어리에 이름표는 군더더기다 */
  var one=(ord.length<2);
  for(i=0;i<ord.length;i++){
    k=ord[i];
    if(!one)h+='<div class="pgh"><span>'+esc(TX(PN_KO[k]||k))+'</span><i>'+by[k].length+'</i></div>';
    h+='<div class="pgg">';
    for(j=0;j<by[k].length;j++){
      x=by[k][j];
      h+='<div class="pgli"><b>'+esc(x.n)+'</b>'
        +(x.c?'<i>'+esc(TX(x.c))+'</i>':'')
        +'<u>'+esc(x.v)+'</u></div>';
    }
    h+='</div>';
  }
  /* 칩만 보고는 왜 그 목록에 있는지 알 수 없다. 타일은 직전 세션 비교로
     세고 칩은 묶음 비교로 다시 본 결과라, 둘이 어긋난 까닭을 여기서 푼다.
     세부 갈래의 lmlg 범례가 이미 같은 일을 한다. */
  var seen={},li;
  for(li=0;li<items.length;li++)if(items[li].c)seen[items[li].c]=1;
  /* 칩이 스스로 말하게 됐으므로 범례는 낱말만으로 알 수 없는 둘만 남긴다 —
     무엇에 견준 미미인지, 몇 개가 있어야 하는지는 칩에 안 담긴다. */
  var lg=[];
  if(seen['차이 미미'])lg.push(TX('<b>차이 미미</b> 그 종목이 실제로 보인 흔들림 폭 안이라 움직였다고 못 함'));
  if(seen['기록 부족'])lg.push(TX('<b>기록 부족</b> 앞뒤 묶음을 견주려면 4세션이 필요함'));
  return '<div class="pgl">'+h+'</div>'
    +(lg.length?'<div class="pglg">'+lg.join('<i>·</i>')+'</div>':'');
}
/* heroProg 의 판정은 직전 두 세션 비교(±0.5%)이고 pgDiag 는 묶음 비교다.
   타일을 앞엣것으로 세고 목록을 뒤엣것으로 그리면 '정체' 칸에 +40% 가 앉는다.
   센 것과 보여 준 것이 다르면 어느 수도 못 믿는다 — 묶음 비교로 통일한다.
   heroProg 자체는 안 건드린다: 그 up/stall/down 을 computedFacts 가 쓰고
   있어 여기서 바꾸면 그 값이 무엇을 세는지가 또 갈린다. 대신 이 갈래와
   AI 페이로드가 같은 이 함수를 본다. */
function progBuckets(){
  var pr=heroProg(),sc=subCnt(),i,d;
  var t=wTrend(),pl=paceLeft();
  var cx={cut:!!(t&&t.rate<0&&-t.rate>=BW*0.003),dn:pr.dnL.length,
          streak:heroStreak(),wk:(pl<0?100:pl),sa:{}};
  var up=[],st=[],dn=[],hold=[];
  function put(x,kind){
    d=pgDiag(x,kind,cx,sc);
    /* 묶음 비교가 오름이면 정체·퇴행이 아니라 진전이다 */
    if(d.c==='오르는 중'){up.push(d);return;}
    /* 판정이 안 선 것(변동 안·표본·잣대)은 정체가 아니라 보류다 —
       '정체 9' 안에 못 가른 넷이 섞여 있으면 그 9 가 거짓이 된다 */
    if(d.k==='obs'){hold.push(d);return;}
    (kind==='dn'?dn:st).push(d);
  }
  for(i=0;i<pr.dnL.length;i++)put(pr.dnL[i],'dn');
  for(i=0;i<pr.stL.length;i++)put(pr.stL[i],'st');
  return {pr:pr,cx:cx,sc:sc,up:up,st:st,dn:dn,hold:hold,
          nUp:pr.upL.length+up.length,nSt:st.length,nDn:dn.length,
          nHold:hold.length+pr.holdL.length};
}
/* .zrow 의 네 슬롯(이름·칩·숫자·근거)을 그대로 쓰고 '왜' 한 줄만 더한다.
   칩 자리에는 판정이 아니라 원인을 넣는다 — 판정은 바로 위 타일과 줄 색과
   숫자 부호로 이미 세 번 나오므로 네 번째로 적을 이유가 없고, 비운 그 자리를
   원인이 차지하면 밀도는 그대로인데 정보량만 는다.
   숫자 칸은 퇴행이면 변화율, 정체면 묶인 기간이다 — 정체에 0.0% 를 적으면
   63→63kg 과 똑같은 병이 된다. 판정이 정체면 그 값은 정의상 0이라 모든
   정체 줄이 같은 숫자를 달고, 정작 다른 것은 얼마나 오래 묶였는가다.
   접힌 줄은 근거를 안 그린다 — 똑같은 모양의 흐린 글씨가 여섯 줄 늘어서면
   눈이 그냥 미끄러진다. 하나만 펴야 그 하나를 읽는다. */
function pgRow(d,open,tap){
  return '<div class="zrow pgr '+(d.kind==='dn'?'neg':'warn')+(open?'':' pgt')+'"'
    +(tap?' data-act="pgo" data-v="'+esc(tap)+'"':'')+'>'
    +'<span class="nm">'+esc(d.n)+'</span>'
    +'<span class="st">'+esc(TX(d.c))+'</span>'
    +'<span class="num">'+(d.kind==='dn'?((d.pct>0?'+':'')+d.pct+'%'):TX1('{0}주째',d.wk))+'</span>'
    +(open?'<span class="sub">'+esc(d.sub)+'</span>'
          +(d.w?'<span class="why">'+esc(d.w)+'</span>':''):'')
    +'</div>';
}
/* 디로드 감지 — 진전이 멈췄는데 RIR까지 내려가면 회복 부족으로 봄 */
function deloadSignal(){
  var hits=[],names=[],i;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];if(isCard(m.p))continue;
    var a=(S.l[m.i]||[]).filter(function(x){return x.s&&x.s.length;});
    if(a.length<3)continue;
    if(Math.round((new Date(a[0].d)-new Date(a[2].d))/86400000)>21)continue;
    var g=e1rmGain(effSets(m,a[0].s,a[0].d),effSets(m,a[2].s,a[2].d));
    if(!g||g.pct>0.5)continue;              /* 진전이 있으면 대상 아님 */
    var r0=rirAvg(a[0].s),r2=rirAvg(a[2].s);  /* RIR은 무게 무관 */
    if(r0===null||r2===null)continue;        /* RIR 미입력이면 판정 보류 */
    if(r2-r0>=1){hits.push({n:m.n,d:Math.round((r2-r0)*10)/10,p:g.pct});names.push(m.n);}
  }
  if(hits.length<2)return null;
  hits.sort(function(x,y){return y.d-x.d;});
  return {n:hits.length,top:hits[0],names:names.slice(0,3)};
}
/* 실제 오늘 수행한 내용 요약 */
function todaySum(){
  var td=today(),pid={},i,k,parts={},sets=0,ex=0;
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    var a=S.l[k];
    for(i=0;i<a.length;i++){
      if(a[i].d!==td||!a[i].s.length)continue;
      var hs=hardOf(a[i].s);
      ex++;sets+=hs.n;
      parts[m.p]=(parts[m.p]||0)+hs.n;
    }
  }
  return {ex:ex,sets:sets,parts:parts};
}

/* hideVd — 묶음 머리가 이미 그 판정을 말하고 있으면 줄마다 또 적지 않는다.

/* 셋째 인자 이름이 L 이라 이 함수 안에서 번역 함수 TX() 이 가려져 있었다 — LM 으로 바꾼다 */
function lmRow(nm,cur,LM,hideVd,easy){
  var mrv=Math.round(LM[3]*0.8);
  /* 감량 보정을 MRV 에만 걸고 존에는 안 걸면, 가슴 19~20세트가 'MAV 존 안'
     이면서 동시에 '보정 MRV 초과' 가 된다. 존을 보정 MRV 에서 끊는다 —
     감량 중에 넘지 말아야 할 선 너머까지 권장 구간으로 칠할 이유가 없다. */
  var z1=Math.min(LM[1],mrv),z2=Math.min(LM[2],mrv);
  var mx=Math.max(mrv,LM[2])*1.15||1;
  function px(v){return Math.min(100,Math.round(v*100/mx));}
  /* 표식이 막대 끝에 걸치면 절반이 밖으로 나가 테두리와 겹쳐 사라진 것처럼 보인다.
     중심을 안쪽으로 물려 항상 온전히 보이게 한다. */
  var cp=Math.max(2.5,Math.min(97.5,cur*100/mx));
  /* 축을 벗어난 값은 자리로 구분되지 않으므로(23 이든 40 이든 끝) 화살표로 바꾼다 */
  var out=cur>mx;

     범례에만 있으니 한눈에 읽힐 리가 없다. 다만 열여덟 줄에 다 달면 글자로
     덮이므로 손댈 것에만 단다: 아무 말이 없으면 괜찮다는 뜻이다. */
  var vz=vzZone(cur,LM,easy);

    +((vz.ok||hideVd)?'':'<em class="lmvd">'+TX(vz.t)+'</em>')
    +'<span class="lmg">'
    +'<i class="zn" style="left:'+px(LM[0])+'%;width:'+Math.max(0,px(z1)-px(LM[0]))+'%"></i>'
    +'<i class="zn hi" style="left:'+px(z1)+'%;width:'+Math.max(0,px(z2)-px(z1))+'%"></i>'
    +'<i class="mrv" style="left:'+px(mrv)+'%"></i>'
    +'<i class="cd'+(cur>mrv?' over':'')+(out?' out':'')+'" style="left:'+cp.toFixed(1)+'%"></i>'
    +'</span><span class="bv'+(cur>mrv?' over':'')+'">'+cur+'</span></div>';

function vzGauge(rows){

/* 세부 근육별 주간 수행 일수 — 세트 총량과 별개로 분산 정도를 봄 */
function wkDaysBySub(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is3(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is3(t)]=1;}
  var out={},i;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];
    if(isCard(m.p))continue;
    var sk=subOf(m);if(!sk)continue;
    var a=S.l[m.i]||[],j;
    for(j=0;j<a.length;j++)if(days[a[j].d]&&a[j].s.length)(out[sk]=out[sk]||{})[a[j].d]=1;
  }
  var cnt={},k;for(k in out)cnt[k]=Object.keys(out[k]).length;
  return cnt;
}
function wkDaysByPart(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is2(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is2(t)]=1;}
  var pid={},i,k,out={};
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    for(i=0;i<S.l[k].length;i++){
      var e=S.l[k][i];
      if(!days[e.d]||!e.s.length)continue;
      (out[m.p]=out[m.p]||{})[e.d]=1;

/* 날짜 집합. 개수만 돌려주면 '이틀 연속 재자극' 을 셀 수가 없다.
   반환 객체에 얹으면 freqThisWeek 로 AI 페이로드에 통째로 새어 나가므로
   따로 뽑는다. */
function wkPartDays(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is5(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is5(t)]=1;}
  var pid={},i,k,out={};
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    for(i=0;i<S.l[k].length;i++){
      var e=S.l[k][i];
      if(!days[e.d]||!e.s.length)continue;
      (out[m.p]=out[m.p]||{})[e.d]=1;
    }
  }
  return out;
}
/* 이번 주 실제로 훈련한 날 수. computed.elapsedTrainDays 는 계획(휴식 요일을
   뺀 경과일)이라 뜻이 다르다 — 따로 센다. */
function wkTrainDays(){
  var d=wkPartDays(),seen={},p,k;
  for(p in d)for(k in d[p])seen[k]=1;
  return Object.keys(seen).length;
}
/* 같은 부위를 이틀 연속 건드렸는가. 로그에 시각이 없어 48시간이 아니라
   '이틀 연속' 의 근사다 — 화면에도 그렇게 적는다. */
function partGap48(){
  var d=wkPartDays(),out=[],p;
  for(p in d){
    var ks=Object.keys(d[p]).sort(),i;
    for(i=1;i<ks.length;i++){
      if(Math.round((new Date(ks[i])-new Date(ks[i-1]))/86400000)===1){
        out.push({p:p,a:ks[i-1],b:ks[i]});break;
      }
    }
  }
  return out;
}
/* 세션 안에서 반복이 급락한 곳. 다만 그 세트 휴식이 60초 미만이었다면
   피로가 아니라 휴식 부족이다 — 라벨을 갈라 준다. */
function fatigueDrop(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is3(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is3(t)]=1;}
  var out=[],i,j;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];if(isCard(m.p))continue;
    var a=S.l[m.i]||[];
    for(j=0;j<a.length;j++){
      if(!days[a[j].d]||a[j].s.length<2)continue;
      var ss=a[j].s,mx=0,q2;
      for(q2=0;q2<ss.length;q2++)mx=Math.max(mx,+ss[q2][1]||0);
      var last=+ss[ss.length-1][1]||0;
      if(!(mx>0))continue;
      var dropAbs=mx-last,dropPct=dropAbs/mx*100;
      if(dropAbs<3&&dropPct<25)continue;
      var rest=+ss[ss.length-1][3]||0;
      /* why 는 AI 페이로드로 그대로 나가므로 한국어로 둔다 — 화면은 rs 를 보고
         제 언어로 다시 적는다 */
      out.push({n:m.n,d:a[j].d,from:mx,to:last,rs:(rest>0&&rest<60)?rest:0,
                why:(rest>0&&rest<60)?'휴식 '+rest+'초':'피로'});

/* 반복이 6~12 구간에 든 비율. 그 숫자는 지금 프롬프트 문자열에만 있고

function repZone(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is4(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is4(t)]=1;}
  var inZ=0,tot=0,off={},i,j,k;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];if(isCard(m.p))continue;

      for(k=0;k<a[j].s.length;k++){

      }

  var names=Object.keys(off).sort(function(x,y){return off[y]-off[x];}).slice(0,3);
  return {inZ:inZ,tot:tot,pct:tot?Math.round(inZ*100/tot):0,off:names};
}

    /* 마지막 점이 오늘이면 날짜 대신 '오늘' 이라 적는다. 범례를 안 읽어도
       어디가 오늘인지 알 수 있다 — 표식보다 이게 세다. */
    var xl=(i===span&&a[a.length-1].part)?TX('오늘'):((dd.getMonth()+1)+'/'+dd.getDate());
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="'
      +(i===0?'start':(i===span?'end':'middle'))+'">'+xl+'</text>';
  }
  /* 구간마다 칠하고 긋는다 */
  for(var q=0;q<runs.length;q++){
    var rn=runs[q];
    if(rn.length<2)continue;
    /* 오늘은 하루가 안 끝났다. 마지막 도막을 떼어 흐리게 긋고 칠도 안 한다 —
       끝나지도 않은 하루를 끝난 날과 같은 굵기로 칠하면, 아침에 조금 먹은
       것이 굉장한 적자 날로 읽힌다. 점선은 못 쓴다. 소비 선이 이미 점선이라
       같은 표식이 두 뜻을 갖게 된다. */
    var tail=(rn[rn.length-1].part&&rn.length>=2)?rn[rn.length-1]:null;
    if(tail)rn=rn.slice(0,rn.length-1);
    var pIn=[],pOut=[],k;
    for(k=0;k<rn.length;k++){
      pIn.push(X(rn[k].d).toFixed(1)+','+Y(rn[k].ate).toFixed(1));
      pOut.push(X(rn[k].d).toFixed(1)+','+Y(rn[k].base+rn[k].ex).toFixed(1));
    }
    if(tail&&rn.length){
      var pv=rn[rn.length-1];
      g+='<g class="tdy">'
        +'<polyline class="lOut" points="'+X(pv.d).toFixed(1)+','+Y(pv.base+pv.ex).toFixed(1)
        +' '+X(tail.d).toFixed(1)+','+Y(tail.base+tail.ex).toFixed(1)+'"/>'
        +'<polyline class="lIn" points="'+X(pv.d).toFixed(1)+','+Y(pv.ate).toFixed(1)
        +' '+X(tail.d).toFixed(1)+','+Y(tail.ate).toFixed(1)+'"/></g>';
    }
    if(rn.length<2)continue;
    /* 하루하루 사다리꼴로 칠해야 부호가 바뀌는 날도 제 색이 난다 */
    for(k=1;k<rn.length;k++){
      var p0=rn[k-1],p1=rn[k];
      var d0=(p0.base+p0.ex)-p0.ate,d1=(p1.base+p1.ex)-p1.ate;
      var cls=((d0+d1)>=0?'bOK':'bNG');
      g+='<polygon class="'+cls+'" points="'
        +X(p0.d).toFixed(1)+','+Y(p0.ate).toFixed(1)+' '
        +X(p1.d).toFixed(1)+','+Y(p1.ate).toFixed(1)+' '
        +X(p1.d).toFixed(1)+','+Y(p1.base+p1.ex).toFixed(1)+' '
        +X(p0.d).toFixed(1)+','+Y(p0.base+p0.ex).toFixed(1)+'"/>';
    }
    g+='<polyline class="lOut" points="'+pOut.join(' ')+'"/>'
      +'<polyline class="lIn" points="'+pIn.join(' ')+'"/>';
  }
  /* 선만 겹쳐 두면 '얼마나 벌어졌나' 를 눈대중해야 한다. 그 값이 이
     그림의 요점이므로 안에 적는다. 점이 여덟 이하면 날마다, 그보다 많으면
     마지막 날만 — 서른 개에 다 적으면 숫자가 겹쳐 못 읽는다. */
  var everyDay=(a.length<=8);
  for(i=0;i<a.length;i++){
    /* 오늘은 반쪽 값이다. 사이값을 적으면 진행 중인 것을 하루치 적자로
       읽게 되므로 안 적는다. */
    if(a[i].part)continue;
    if(!everyDay&&i!==fin.length-1)continue;
    var rr=a[i],yI=Y(rr.ate),yO=Y(rr.base+rr.ex),df=(rr.base+rr.ex)-rr.ate;
    var thin=Math.abs(yI-yO)<11;
    var yy=thin?Math.min(yI,yO)-4:(yI+yO)/2+3;
    var xx=X(rr.d),an='middle';
    /* 양끝에서는 글자가 그림 밖으로 나간다 */
    if(xx>W-R-14){an='end';xx=W-R;}
    else if(xx<L+14){an='start';xx=L;}
    g+='<text class="gv '+(df>=0?'gvOK':'gvNG')+'" x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)
      +'" text-anchor="'+an+'">'+(df>=0?'-':'+')+Math.abs(Math.round(df)).toLocaleString()+'</text>';
  }
  /* 채운 점은 마지막으로 끝난 날에, 빈 원은 오늘에. 속이 비어 있는 것이
     '아직 진행 중' 이라는 표식이다 — 채운 점과 한눈에 갈린다. */
  var lastD=fin[fin.length-1];
  g+='<circle class="dOut" cx="'+X(lastD.d).toFixed(1)+'" cy="'+Y(lastD.base+lastD.ex).toFixed(1)+'" r="2.6"/>'
    +'<circle class="dIn" cx="'+X(lastD.d).toFixed(1)+'" cy="'+Y(lastD.ate).toFixed(1)+'" r="3"/>';
  var tdD=a[a.length-1];
  if(tdD.part)
    g+='<circle class="dOutO" cx="'+X(tdD.d).toFixed(1)+'" cy="'+Y(tdD.base+tdD.ex).toFixed(1)+'" r="2.8"/>'
      +'<circle class="dInO" cx="'+X(tdD.d).toFixed(1)+'" cy="'+Y(tdD.ate).toFixed(1)+'" r="3.2"/>';
  return '<svg class="trg" viewBox="0 0 '+W+' '+H+'" role="img" '
    +'aria-label="'+TX('날마다 먹은 열량과 태운 열량')+'">'+g+'</svg>';
}
/* 체중·체지방률·골격근량을 한 그림에. 셋은 단위가 달라(kg·%·kg) 절대값을
   같은 축에 올리면 서로 아득히 떨어져 있고 각자의 변화는 눈금보다 작아
   전부 납작한 직선이 된다 — 그려도 아무것도 안 보인다.
   시작 대비 변화량으로 그린다. 셋 다 0 에서 출발하니 한 축에 들어오고
   변화 폭도 서로 비슷해 겹쳐도 읽힌다. 지금 값은 범례에 적는다.
   감량기에 진짜 물어야 할 것은 '빠진 게 지방이었나 근육이었나' 이고,
   세 선이 갈라지는 모양이 그 답이다.
   인바디 기록만 쓴다 — 체중계를 섞으면 체중만 촘촘해져 날짜가 어긋난다. */
function chartBody(){
  var a=bhLoad().filter(function(x){return x.w>0&&x.f>0;});
  if(a.length<2)return '';
  var W=320,H=126,L=34,R=7,T=14,B=19,i;
  var w0=a[0].w,f0=a[0].f;
  var mFirst=null;
  for(i=0;i<a.length;i++)if(a[i].m>0){mFirst=a[i].m;break;}
  var lo=0,hi=0;
  function see(v){if(v<lo)lo=v;if(v>hi)hi=v;}
  for(i=0;i<a.length;i++){
    see(a[i].w-w0);see(a[i].f-f0);
    if(mFirst!==null&&a[i].m>0)see(a[i].m-mFirst);
  }
  var pd=Math.max(0.3,(hi-lo)*0.18);lo-=pd;hi+=pd;
  var t0=new Date(a[0].d).getTime(),t1=new Date(a[a.length-1].d).getTime();
  if(!(t1>t0))t1=t0+86400000;
  var span=Math.max(1,Math.round((t1-t0)/86400000));
  function X(d){return L+(W-L-R)*(new Date(d).getTime()-t0)/(t1-t0);}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B);}
  var g='',st=niceStep(hi-lo,3),v=Math.ceil(lo/st)*st,gi=0;
  while(v<=hi+1e-9&&gi<12){
    g+='<line class="gr" x1="'+L+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(v).toFixed(1)+'"/>'
      +'<text x="'+(L-4)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'
      +(v>0?'+':'')+(Math.round(v*10)/10).toFixed(1)+'</text>';
    v+=st;gi++;
  }
  /* 0 선은 시작점이다 — 위면 늘었고 아래면 줄었다 */
  g+='<line class="zr" x1="'+L+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(0).toFixed(1)+'"/>';
  var lab=(span<=10?1:(span<=24?3:(span<=45?7:14)));
  for(i=0;i<=span;i++){
    var x=L+(W-L-R)*i/span;
    if(i%lab!==0&&i!==span)continue;
    if(i===span&&span%lab!==0&&span%lab<lab*0.5)continue;
    g+='<line class="tk" x1="'+x.toFixed(1)+'" y1="'+(H-B)+'" x2="'+x.toFixed(1)+'" y2="'+(H-B+3)+'"/>';
    var dd=new Date(t0+i*86400000);
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="'
      +(i===0?'start':(i===span?'end':'middle'))+'">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>';
  }
  /* 점 모양도 셋을 가른다 — 꽉 찬 동그라미·네모·빈 동그라미.
     모든 측정점에 찍는다: 인바디는 띄엄띄엄 재므로 점이 곧 언제 쟀나 다. */
  function mark(sh,cls,x,y){
    if(sh==='s')return '<rect class="'+cls+'" x="'+(x-2.3).toFixed(1)+'" y="'+(y-2.3).toFixed(1)
      +'" width="4.6" height="4.6" rx="0.6"/>';
    return '<circle class="'+cls+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)
      +'" r="'+(sh==='o'?2.5:2.6)+'"/>';
  }
  function line(cls,dcl,sh,pick){
    var p=[],dots='',k;
    for(k=0;k<a.length;k++){
      var val=pick(a[k]);
      if(val===null)continue;
      var x=X(a[k].d),y=Y(val);
      p.push(x.toFixed(1)+','+y.toFixed(1));
      dots+=mark(sh,dcl,x,y);
    }
    return (p.length>1?'<polyline class="'+cls+'" points="'+p.join(' ')+'"/>':'')+dots;
  }
  g+=line('lF','dF','s',function(r){return r.f-f0;})
    +line('lM','dM','o',function(r){return (mFirst!==null&&r.m>0)?r.m-mFirst:null;})
    +line('lW','dW','c',function(r){return r.w-w0;});
  return '<svg class="trg" viewBox="0 0 '+W+' '+H+'" role="img" '
    +'aria-label="'+TX('체중 체지방률 골격근량의 시작 대비 변화')+'">'+g+'</svg>';
}
/* 몸 — 체중이 어디로 가고 있나, 그리고 그것을 무엇이 밀고 있나 */
function vzBody(tab){
  tab=tab||'chg';
  var h='';
  if(tab==='chg'){
    /* 요청은 '매일 먹는 음식, 매일 하는 운동의 추이' 였다. 그것부터 그린다 —
       체중을 언제 쟀는지와 무관하게 날마다 있는 자료다. */
    var et=chartEat(35);
    if(et){
      /* 평균은 끝난 날들의 값이라야 한다. 진행 중인 오늘을 섞으면 반쪽
         값이 평균 적자를 부풀린다 — 그림에는 넣되 평균에서는 뺀다. */
      var er=trendRows(35).filter(function(r){return r.ate!=null&&!r.part;});
      var sI=0,sO=0,sX=0,ng=0;
      er.forEach(function(r){var out=r.base+r.ex;sI+=r.ate;sO+=out;sX+=r.ex;if(out<r.ate)ng++;});
      var n2=er.length;
      h+=vzCap(TX('날마다 · 섭취와 소비'))+et
        /* '섭취 2,292 · 소비 2,758' 을 적어 뒀었다. 창 전체의 평균인데 그렇게
           안 적혀 있어 오늘 값처럼 읽히고, 뜻을 알려면 둘을 빼야 한다.
           그런데 그 답이 바로 옆에 이미 있다 — 같은 말을 두 번 하면서 한 번은
           계산까지 시킨 셈이다.
           범례가 할 일은 '어느 선이 무엇인가' 뿐이다. 수는 결론 하나만 둔다. */
        /* 요약을 범례 칸에 넣었더니 표식(점선)이 자동으로 붙어, 그림에 없는
           세 번째 선처럼 보였다. 범례가 거짓말을 한 셈이다.
           범례는 '어느 선이 무엇인가' 만, 요약은 딴 줄에 말로 적는다. */
        +'<div class="trgl"><i class="k1">'+TX('섭취')+'</i><i>'+TX('소비 <u>운동 포함</u>')+'</i></div>'
        /* '하루 466kcal 더 씀' 만 적으면 며칠을 평균 낸 값인지 알 수 없다.
           주간도 월간도 아니고 '기록이 있는 날들' 이므로 그렇게 적는다 —
           창은 35일이지만 그중 먹은 것이 적힌 날만 센다.
           꼬리말은 섞였을 때만 붙인다. 전부 넘겼거나 하나도 안 넘겼으면
           앞의 '더 먹음/더 씀' 이 이미 그 말을 하고 있다. */
        /* '더 씀' 은 쉽게 쓰려다 오히려 어색해진 말이다. 적자·초과가 이 바닥에서
           쓰는 말이고 앱도 원래 그 말을 썼다. 억지로 풀어 쓸 자리가 아니다. */
        +'<div class="trgs">'
        +TX1(sO>=sI?'기록 {0}일 · 하루 평균 <b>{1}</b>kcal 적자'
                  :'기록 {0}일 · 하루 평균 <b>{1}</b>kcal 초과',
            n2,Math.abs(Math.round((sO-sI)/n2)).toLocaleString())
        /* 꼬리말은 평균과 반대로 간 날을 센다. 같은 쪽을 또 세면
           '267kcal 초과 · 3일은 초과' 처럼 같은 말이 두 번 된다. */
        +(function(){
            var cut=(sO>=sI)?ng:(n2-ng);      /* 적자면 초과한 날, 초과면 적자인 날 */
            if(cut<=0||cut>=n2)return '';
            return ' · '+TX1(sO>=sI?'{0}일은 초과':'{0}일은 적자',cut);
          })()+'</div>';
    }else h+=vzLine(TX('섭취와 소비'),TX('기록 부족'),
      TX('식사 기록이 이틀 이상 쌓이면 그려짐 · 삼성헬스에서 넘어옴'),{t:'',c:''});
    var bd2=chartBody();
    if(bd2){
      var ba=bhLoad().filter(function(x){return x.w>0&&x.f>0;});
      var b0=ba[0],b1=ba[ba.length-1];
      function dlt(x,y,u2){return (x>y?'+':'')+(Math.round((x-y)*10)/10)+u2;}
      h+=vzCap(TX1('몸 — {0} 대비 변화 · {1}회 측정',md(b0.d),ba.length))+bd2
        +'<div class="trgl">'
        +'<i class="kW">'+TX1('체중 <b>{0}</b>kg {1}',fmtW(b1.w),dlt(b1.w,b0.w,''))+'</i>'
        +'<i class="kF">'+TX1('체지방 <b>{0}</b>% {1}',Math.round(b1.f*10)/10,dlt(b1.f,b0.f,''))+'</i>'
        +(b1.m>0&&b0.m>0?'<i class="kM">'+TX1('골격근 <b>{0}</b>kg {1}',fmtW(b1.m),dlt(b1.m,b0.m,''))+'</i>':'')
        +'</div>';
    }else h+=vzLine(TX('몸 변화'),TX('기록 부족'),
      TX('인바디를 두 번 이상 재면 체중·체지방률·골격근량이 한 그림에 나옴'),
      {t:'',c:''});
  }
  if(tab==='burn'){
    var kh=kcalHtml();
    h+=kh||vzLine(TX('운동 소비'),TX('기록 없음'),TX('근력이나 유산소를 기록하면 여기에 나옴'),{t:TX('기록 없음'),c:''});
    var bs=bmr(BW,BF);
    /* 기초대사는 제지방에서 바로 나온다(370+21.6×LBM) — 변화 갈래의 골격근이
       여기 소비로 이어진다. 그 고리가 이 카테고리가 하나인 이유다. */
    if(bs>0){
      var ex0=dayExKcal(todayISO());
      h+=vzLine(TX('기초 대사'),bs.toLocaleString()+' kcal',
          TX1('제지방 {0}kg · Katch-McArdle',fmtW(BW*(1-BF/100))),{t:'',c:''})
        +vzLine(TX('오늘 소비'),Math.round(bs*ACT+ex0).toLocaleString()+' kcal',
          TX1('기초 {0} × 활동 {1} + 운동 {2}',bs.toLocaleString(),ACT,Math.round(ex0).toLocaleString()),
          {t:ex0>0?TX('운동일'):'',c:ex0>0?'pos':''});
    }
  }
  return '<div class="anlviz">'+h+'</div>';
}
function vzTrain(tab){
  tab=tab||'set';
  var h='',ws=wkSets(),sc=subCnt(),i,k;
  if(tab==='set'){
  /* 세부에는 눈금이 있는데 부위에는 없을 이유가 없다 — LMKP 가 이미
     다섯 부위의 랜드마크를 갖고 있다. 목표 대비는 숫자로, 구간은 눈금으로. */
  h+=vzCap(TX('부위 · MEV~MRV'));
  var tot=0,tgt=0,ph2='';
  for(k in PN_KO){
    var c=ws[k]||0,g=WTGT[k]||0;
    tot+=c;tgt+=g;
    /* 다섯 줄에 'MEV 미만' 이 다섯 번 붙는다 — 주 초반이면 늘 그렇다.
       같은 글자가 다섯 번이면 정보가 아니라 무늬다. 눈금이 자리로 말하고
       캡션이 '부위 · MEV~MRV' 라 적어 두므로 줄에는 안 붙인다.
       근육 갈래는 다르다: 거기는 초과·적당·미만으로 묶여 판정이 묶음 머리에
       있고 줄에 붙는 것은 한 묶음에 판정이 섞였을 때뿐이다. */
    ph2+=LMKP[k]?lmRow(TX(PN_KO[k]),c,LMKP[k],true):'';
  }
  if(ph2)h+='<div class="lmsec">'+ph2
    +'<div class="lmlg" data-act="hgo" data-v="goal">'
    +TX('<i class="s1"></i>MEV~MAV <i class="s2"></i>MAV존 <i class="s3"></i>보정 MRV')+'</div></div>';
  /* 눈금과 숫자 줄을 둘 다 그리면 같은 것을 두 번 본다 — 눈금이 자리로
     보여 주므로 목표 대비는 총계 한 줄이면 된다 */
  var wc=wkCardio(),ctg=WTGT['CARDIO']||90;
  h+=vzBar(TX('유산소'),wc.z2,ctg,
           wc.neat>0?TX1('{0}회 · 걷기 {1}분 별도',wc.days,wc.neat):TX1('{0}회',wc.days),
           vzVerdict(wc.z2,ctg),false);
  /* '수행 3일' 만 적으면 계획이 5일인데 셋만 한 것인지, 이틀을 쉬기로 해서

  /* 이 갈래는 '오늘' 이다. 카드 머리(catCtx)도 보는 날짜와 무관하게 늘 오늘을
     적고, '남은 끼니' 는 오늘에만 뜻이 있다 — 어제 저녁은 남은 끼니가 아니다.
     그런데 t 는 오늘인데 탄단지·운동·진단은 UI.wd(보는 날짜)를 보고 있었다.
     어제로 넘긴 채 열면 '600kcal 먹음 · 단백질 200g' 처럼 한 화면이 자기모순이
     된다. 메인 화면의 날짜 넘김은 운동 기록용이고 이 시트와 상관이 없다. */
  var DTD=todayISO();
  /* 오늘 식사가 아직 안 들어오면 t 가 없어 이 갈래가 통째로 비었다. 화면에
     '하루 적자 목표' 한 줄만 남는다 — 열어 봐야 아무것도 없다.
     먹은 것을 몰라도 아는 것은 있다: 오늘 얼마까지 먹어도 되는지, 단백질
     목표가 몇인지, 운동으로 얼마를 벌었는지. 그것부터 보여 준다. */
  if(tab==='today'&&!t){

    if(BW>0)h+=vzLine(TX('단백질 목표'),Math.round(BW*PRO_PER_KG)+' g',
      /* 2.0 이 '2' 로 찍혀 정수 배율처럼 보였다 */

    h+=dgHead(nf);

     이라, 한 카드 안에 목표가 둘이고 77kcal 어긋났다. 그 차이는 곧

  var useAvg=(tab==='avg'&&nf.completedDaysCount>0&&nf.completedDaysAvgTarget>0);
  h+=vzCap(useAvg?TX('기준 · 끝난 날 평균'):TX('기준'))
    +vzLine(TX('하루 적자 목표'),Math.round(nf.dailyDeficitTarget)+' kcal',
    TX1('주당 -{0}kg 에서 나옴',WR),'')
    /* 550 이라는 수 하나로는 어디서 나온 것인지 알 수가 없다.
       적자는 소비와 섭취의 차이이므로 그 차이를 그린다. */
    +deficitBars(useAvg?nf.completedDaysAvgTdee:nf.todayTdee,
                 useAvg?nf.completedDaysAvgTarget:nf.todayTargetIntake);

/* 톤수를 세던 것을 유효 세트로. 세트를 세므로 어시스트 유효무게 환산이
   아예 필요 없어졌다 — effSets 에 날짜를 안 넘기던 문제도 같이 사라진다. */
function anlWkSets(off){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw-off*7);
  function is2(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is2(t)]=1;}
  var pid={},i,k,cnt={};
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    for(i=0;i<S.l[k].length;i++){
      var e=S.l[k][i];
      if(!days[e.d])continue;
      cnt[m.p]=(cnt[m.p]||0)+hardOf(e.s).n;
    }
  }
  return cnt;
}
function weekVolCardio(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is2(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is2(t)]=1;}
  var pid={},i,k,min=0;
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||!isCard(m.p)||isWalkName(m))continue;
    for(i=0;i<S.l[k].length;i++){
      var e=S.l[k][i];
      if(!days[e.d])continue;
      for(var j=0;j<e.s.length;j++)min+=(+e.s[j][0]||0);
    }
  }
  return Math.round(min);
}

/* 그날의 대표 체중. 하루에 여러 번 잰 값이 [분, kg] 로 들어오는데

function swDay(ds){

function shrinkThenOcr(f){
  var rd=new FileReader();
  rd.onload=function(){
    var res=String(rd.result||'');
    var rawB64=res.substring(res.indexOf(',')+1);
    var rawMime=f.type||'image/jpeg';
    try{
      var settled=false;
      var img=new Image();
      setTimeout(function(){
        if(!settled){settled=true;ocrInbody(rawB64,rawMime);}
      },6000);
      img.onload=function(){
        if(settled)return;settled=true;
        try{
          var MAX=1600,w2=img.width,h2=img.height;
          if(w2>MAX||h2>MAX){var sc=MAX/Math.max(w2,h2);w2=Math.round(w2*sc);h2=Math.round(h2*sc);}
          var cv=document.createElement('canvas');
          cv.width=w2;cv.height=h2;
          var cx=cv.getContext('2d');
          if(!cx)throw new Error('no ctx');
          cx.fillStyle='#fff';cx.fillRect(0,0,w2,h2);
          cx.drawImage(img,0,0,w2,h2);
          var du=cv.toDataURL('image/jpeg',0.85);
          if(du&&du.indexOf(',')>0)ocrInbody(du.substring(du.indexOf(',')+1),'image/jpeg');
          else ocrInbody(rawB64,rawMime);
        }catch(e2){ocrInbody(rawB64,rawMime);}
      };
      img.onerror=function(){if(settled)return;settled=true;ocrInbody(rawB64,rawMime);};
      img.src=res;
    }catch(e1){ocrInbody(rawB64,rawMime);}
  };
  rd.readAsDataURL(f);
}

    function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
    var days=[],dset=[],i;
    for(i=0;i<7;i++){var t=new Date(mon);t.setDate(mon.getDate()+i);days.push(iso(t));dset.push({});}
    var cnt={'CHEST':0,'BACK':0,'SHOULDERS':0,'LEGS':0,'ARMS·ETC':0,'CARDIO':0};
    var pid={},pnm={},pmm={},k;
    for(i=0;i<S.m.length;i++){pid[S.m[i].i]=S.m[i].p;pnm[S.m[i].i]=S.m[i].n;pmm[S.m[i].i]=S.m[i];}
    for(k in S.l){
      var p=pid[k];if(!p)continue;
      var a=S.l[k],j;
      for(j=0;j<a.length;j++){
        var di=days.indexOf(a[j].d);
        if(di<0)continue;
        dset[di][p]=1;
        if(cnt[p]!=null){
          if(isCard(p)){
            if(!isWalkName(pmm[k]||pnm[k]))for(var q9=0;q9<a[j].s.length;q9++)cnt[p]+=(+a[j].s[q9][0]||0);
          }
          else cnt[p]+=a[j].s.length;
        }
      }
    }
    var order=['CHEST','BACK','SHOULDERS','LEGS','ARMS·ETC','CARDIO'];
    var w=[],v=[];
    for(i=0;i<7;i++){
      var cs=[];
      for(var q2=0;q2<order.length;q2++)if(dset[i][order[q2]])cs.push(WCODE[order[q2]]);
      w.push(cs.join('·'));
    }
    var c=[];
    var KOR=WCODE;
    for(i=0;i<order.length;i++){
      v.push([KOR[order[i]],cnt[order[i]],WTGT[order[i]]]);
      var fq=0,dd;
      for(dd=0;dd<7;dd++)if(dset[dd][order[i]])fq++;
      c.push([KOR[order[i]],fq]);
    }
    /* 오늘 세션(td) — 오늘 기록한 종목과 세트 요약 */
    var tdISO=iso(now),td=[];
    for(k in S.l){
      var mm=null,z;
      for(z=0;z<S.m.length;z++)if(S.m[z].i===k){mm=S.m[z];break;}
      if(!mm)continue;
      var arr=S.l[k],y;
      for(y=0;y<arr.length;y++){
        if(arr[y].d!==tdISO||!arr[y].s.length)continue;
        var st=arr[y].s,top=st[0],q3;
        for(q3=1;q3<st.length;q3++){
          if(st[q3][0]>top[0]||(st[q3][0]===top[0]&&st[q3][1]>top[1]))top=st[q3];
        }
        td.push([mm.n,isCard(mm.p)?(top[0]+"' "+cUnit(top)):(top[0]+'x'+top[1]),st.length]);
      }
    }
    /* 즐겨찾기 직전 톱세트(lw) — 마지막 수행일 기준 */
    var lw=[];
    for(i=0;i<S.m.length;i++){
      var m2=S.m[i];
      if(!m2.f)continue;
      var a2=(S.l[m2.i]||[]).slice().sort(function(x,y2){return x.d<y2.d?1:-1;});
      if(!a2.length||!a2[0].s.length)continue;
      var s2=a2[0].s,tp=s2[0],q4;
      for(q4=1;q4<s2.length;q4++){
        if(s2[q4][0]>tp[0]||(s2[q4][0]===tp[0]&&s2[q4][1]>tp[1]))tp=s2[q4];
      }
      var dd2=Math.round((new Date(tdISO)-new Date(a2[0].d))/86400000);
      lw.push([m2.n,isCard(m2.p)?(tp[0]+"' "+cUnit(tp)):(tp[0]+'x'+tp[1]),dd2,a2[0].d]);
    }
    lw.sort(function(x,y2){return x[2]-y2[2];});
    lw=lw.slice(0,6);
    /* 감량 위젯 — 계산은 컷 트래커와 같은 paceCalc를 씀 */
    var cut=null;
    try{
      if(bmr(BW,BF)){
        var pc=paceCalc(BW,BF,GF),bh=bhLoad(),cpct=0;
        if(bh.length>=1&&(pc.tw<BW||pc.done)){
          var sw=bh[0].w,span=sw-pc.tw;
          cpct=pc.done?100:(span>0?Math.max(0,Math.min(100,Math.round((sw-BW)/span*100))):0);
        }
        cut={d:pc.done?-2:((pc.ok&&pc.rate<0)?pc.days:-1),
             w:fmtW(BW),tw:fmtW(pc.tw),rem:fmtW(pc.remain),pct:cpct,
             rate:pc.ok?((pc.rate>0?'+':'')+pc.rate):'',wr:'-'+WR,
             /* 위젯은 폭이 좁아 태그를 두 글자로 줄임 */
             tag:(function(t){t=pc.tag||'';
               if(t.indexOf('과속')>=0)return '과속';
               if(t.indexOf('증량')>=0)return '증량';
               if(t.indexOf('부족')>=0)return '부족';
               if(t.indexOf('양호')>=0)return '양호';
               return t;})()};
      }
    }catch(e2){}
    /* sd=스냅샷 기준일, mon=그 주의 월요일.
       위젯이 '오늘'과 '이번 주'를 다시 판정하는 근거가 됨 */
    /* 다음에 할 부위 — 오래 쉰 순, 같으면 주간 목표 미달분이 큰 순 */
    var next=[];
    try{
      var norder=['CHEST','BACK','SHOULDERS','LEGS','ARMS·ETC'],cand=[];
      for(i=0;i<norder.length;i++){
        var np=norder[i],nset=partDays(np);
        if(nset[0])continue;                       /* 오늘 이미 한 부위는 뺌 */
        var nd=99,q5;
        for(q5=1;q5<=30;q5++)if(nset[q5]){nd=q5;break;}
        cand.push({p:np,d:nd,s:cnt[np]||0,t:WTGT[np]||10});
      }
      cand.sort(function(x,y4){
        if(y4.d!==x.d)return y4.d-x.d;
        return (y4.t-y4.s)-(x.t-x.s);
      });
      for(i=0;i<cand.length&&next.length<3;i++){
        var cc=cand[i];
        next.push([WCODE[cc.p]||cc.p,
          (cc.d>=99?'한 적 없음':cc.d+'일 안 함')+' \u00b7 '+cc.s+'/'+cc.t+'세트']);
      }
    }catch(e4){}

    /* 최근 3주 안에 개인 최고를 넘긴 종목 */
    var prs=[];
    try{
      for(i=0;i<S.m.length;i++){
        var pm=S.m[i];
        if(isCard(pm.p))continue;
        var pa=(S.l[pm.i]||[]).filter(function(x){return x.s&&x.s.length;});
        if(!pa.length)continue;
        var plast=pa.slice().sort(function(x,y5){return x.d<y5.d?1:-1;})[0];
        if(Math.round((new Date(tdISO)-new Date(plast.d))/86400000)>21)continue;
        var pv=prOf(pm,plast.d);
        if(!pv||!pv.isPR)continue;
        var ps=effSets(pm,plast.s,plast.d),ptp=ps[0],q6;
        for(q6=1;q6<ps.length;q6++)
          if(ps[q6][0]>ptp[0]||(ps[q6][0]===ptp[0]&&ps[q6][1]>ptp[1]))ptp=ps[q6];
        prs.push([pm.n,fmtW(ptp[0])+'x'+ptp[1],(pv.gain>0?'+':'')+pv.gain,plast.d]);
      }
      prs.sort(function(x,y6){return x[3]<y6[3]?1:-1;});
      prs=prs.slice(0,4);
    }catch(e5){}

    /* 볼륨 랜드마크 — 분석탭 lmRow 와 같은 축·보정을 씀 */
    var lm=[];
    try{
      var LPN={'SHOULDERS':'어깨','BACK':'등','CHEST':'가슴','LEGS':'하체','ARMS·ETC':'팔·기타'};
      var LPO=['SHOULDERS','BACK','CHEST','LEGS','ARMS·ETC'];
      var lws=wkSets();
      for(i=0;i<LPO.length;i++){
        var lk=LPO[i],LL=LMKP[lk];
        if(!LL)continue;
        var lmrv=Math.round(LL[3]*0.8);
        var lmx=Math.max(lmrv,LL[2])*1.15;
        var lcur=lws[lk]||0;
        lm.push([LPN[lk],lcur,Math.round(lmx*100)/100,lcur>lmrv?1:0]);
      }
    }catch(e6){}

    AndroidWidget.sync(JSON.stringify({t:dow,w:w,v:v,c:c,td:td,lw:lw,
      sd:tdISO,mon:days[0],cut:cut,next:next,prs:prs,lm:lm}));
  }catch(e){}
}

/* 감량·영양 모드는 훈련 데이터를 안 본다. 종목·로그·톱세트를 주면
   리포트에 '등 운동' 이야기가 섞인다 — 주지 않으면 말할 수 없다. */


/* 종목별 이번 주 세트. 부위 합(wkSets)과 세부 합(subCnt)은 있는데 종목
   단위가 없어서 '어느 종목에서 몇 세트' 를 시킬 수가 없었다 — '등 볼륨
   추가 중단 요망' 같은 줄이 나오던 까닭이 이것이다. 재료가 없으면 그런
   말밖에 못 한다. */
function exWeek(){
  var now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);
  mon.setDate(now.getDate()-dow);
  var days={},i,j,t;
  for(i=0;i<7;i++){t=new Date(mon);t.setDate(mon.getDate()+i);
    days[t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2)]=1;}
  var out=[];
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];
    if(isCard(m.p))continue;
    var a=S.l[m.i]||[],n=0,d=0,rs=0,rn=0;
    for(j=0;j<a.length;j++){
      if(!days[a[j].d]||!a[j].s||!a[j].s.length)continue;
      n+=hardOf(a[j].s).n;d++;
      var rv=rirAvg(a[j].s);
      if(rv!==null){rs+=rv;rn++;}
    }
    if(!n)continue;
    var sk=subOf(m);
    out.push({종목:pgName(m),부위:PN_KO[m.p]||m.p,세부:sk?subName(sk):'',
      세트:n,수행일:d,RIR:rn?Math.round(rs/rn*10)/10:null});
  }
  out.sort(function(x,y){return y.세트-x.세트;});
  return out;
}
/* 세부 근육별로 지금 가진 종목. 없는 기구를 권하면 쓸 수가 없는데 AI 는
   무엇이 있는지 모른다 — 'Incline Fly' 가 이 사람 헬스장에 있는지 알 길이
   없었다. 이 목록 안에서만 고르게 하면 그럴 방법이 없어진다.
   회피 목표 근육(STG 0)은 뺀다: 거기로 옮기라고 할 일이 아니다. */
function swapPool(){
  var by={},i;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];
    if(isCard(m.p))continue;
    var sk=subOf(m);
    if(!sk||STG[sk]===0)continue;
    var nm2=subName(sk);
    (by[nm2]||(by[nm2]=[])).push(pgName(m));
  }
  return by;
}
/* 판정값만. 세트 원본·tops·로그는 넘기지 않는다 — 넘기면 AI 가 그것을
   자기 말로 다시 요약해 화면과 겹치는 문단이 생긴다. */
function planPayload(){
  var ws=wkSets(),sc=subCnt(),cf=computedFacts()||{},i,k;
  var parts=[];
  for(k in PN_KO){
    var c=ws[k]||0,g=WTGT[k]||0;
    parts.push({부위:PN_KO[k],실적:c,목표:g,vd:vzVerdict(c,g).t});
  }
  var wc=wkCardio();
  parts.push({부위:'유산소(분)',실적:wc.z2,목표:WTGT['CARDIO']||90,vd:vzVerdict(wc.z2,WTGT['CARDIO']||90).t});
  /* 적절한 것은 결정거리가 아니다 — 손댈 곳만 보낸다 */
  var subs=[],seP=subEasy();
  for(i=0;i<SUBS.length;i++){
    var sb=SUBS[i],L=LMK[sb.k];
    if(!L)continue;
    /* 화면과 같은 자를 댄다. 여기만 easy 를 안 넘기면 화면은 '강도 부족'
       인데 리포트는 'MEV 미만' 이라, 한 카드가 두 말을 한다. */
    var cur=sc[sb.k]||0,ez=seP[sb.k]||0,v=vzZone(cur,L,ez);
    if(v.ok)continue;   /* 표시용 글자로 견주면 이름을 바꿀 때 조용히 깨진다 */
    subs.push({세부:subLabel(sb),실적:cur,보정MRV:Math.round(L[3]*0.8),
      여지:Math.max(0,Math.min(L[2],Math.round(L[3]*0.8))-cur),
      가벼운세트:ez,vd:v.t});
  }
  var B=progBuckets(),pr=B.pr;
  function nm(a){return a.map(function(x){return {종목:x.n,수치:x.t||'',변화:(x.p!==undefined?x.p+'%':''),RIR:x.r,사유:x.why||''};});}
  /* 화면과 같은 통을 본다. 예전에는 여기가 heroProg 원 판정을 보내서,
     화면이 '정체 3' 이라 적는 동안 AI 는 9 를 받았다. */
  function bk(a){return a.map(function(x){
    return {종목:x.n,원인:x.c,변화:(x.pct>0?'+':'')+x.pct+'%',주:x.wk,세션:x.ns};});}
  var dl=deloadSignal(),lt=lbmTrend(),pc=paceCalc(BW,BF,GF),rz=repZone();
  /* 간접 자극 — 팔의 부족을 등·가슴 볼륨으로 깎을지는 판단이라 AI 몫이다.
     감산 비율은 안 넘기고 기여 세트 수만 준다. */
  var indirect=[{대상:'팔',기여:'등+가슴',기여세트:(ws['BACK']||0)+(ws['CHEST']||0)},
                {대상:'어깨후면',기여:'등',기여세트:ws['BACK']||0}];
  var prev='';
  try{if(AIH.length&&AIH[0].o){
    var mm=String(AIH[0].o).split('\n').filter(function(x){return /^-\s/.test(x);});
    prev=mm.slice(-4).join(' / ');
  }}catch(e){}
  return {
    주단계:cf.weekPhase,경과훈련일:cf.elapsedTrainDays,잔여훈련일:cf.remainTrainDays,
    /* 날짜 목록은 안 보낸다 — 세는 값이면 판단에 충분하고, 날짜 맵을
       통째로 흘리면 페이로드가 부풀기만 한다 */
    휴식요일:RD.map(function(x){return '일월화수목금토'.charAt(x);}),
    실제훈련일:wkTrainDays(),이번주쉰날:wkOffCount(),오늘쉬는날:isOff(todayISO()),
    부위:parts,손댈세부:subs,
    /* 종목 단위 재료. 이것이 없으면 '등 볼륨' 까지만 말할 수 있다 */
    종목:exWeek(),
    진전:nm(pr.upL).concat(bk(B.up)),정체:bk(B.st),퇴행:bk(B.dn),
    보류:bk(B.hold).concat(nm(pr.holdL)),
    빈도:wkDaysByPart(),
    회복:{연속일:heroStreak(),이틀연속:partGap48().map(function(x){return PN_KO[x.p]||x.p;}),
          디로드후보:dl?dl.n:0,디로드종목:dl?dl.names:[],
          세션내급락:fatigueDrop().map(function(x){return {종목:x.n,사유:x.why};}),
          변동:vzDelta().rows,RIR미입력세트:unkWeek()},
    균형:{당기기:(sc.lt||0)+(sc.tm||0)+(sc.ut||0)+(sc.bi||0),
          밀기:(sc.uc||0)+(sc.mc||0)+(sc.ad||0)+(sc.tri||0),
          사두:sc.qd||0,햄:sc.hm||0,측면:sc.sd||0,전면후면:(sc.ad||0)+(sc.pd||0),
          상체:(ws['CHEST']||0)+(ws['BACK']||0)+(ws['SHOULDERS']||0)+(ws['ARMS·ETC']||0),하체:ws['LEGS']||0},
    반복구간:{'6~12비율':rz.pct,벗어난종목:rz.off},
    간접기여:indirect,
    몸:pc.ok?{주당변화:pc.rate,목표:-WR,판정:pc.tag,근거:pc.how}:null,
    체성분:lt?{지표:lt.k,변화:lt.d,간격일:lt.gap}:null,
    회피세부:(function(){var a=[],q;for(q=0;q<SUBS.length;q++)if(STG[SUBS[q].k]===0&&(sc[SUBS[q].k]||0)>0)a.push(subLabel(SUBS[q]));return a;})(),
    직전처방:prev,
    오늘:todayISO()
  };
}
/* 몸 — 체중이 어디로 가고 있고 그것을 무엇이 밀고 있나. 훈련 종목이나
   세트는 안 보낸다: 이 모드는 섭취만 조정하고 볼륨은 건드리지 않는다. */
/* 카테고리가 무엇을 보낼지 정한다 — 모드마다 if 를 늘리면 새 모드를 더할
   때마다 두 군데(전경·배경 호출)를 같이 고쳐야 한다 */
function anlPayload(){
  var c=catOf(ANL);
  if(c==='diet')return mealPayload();
  if(c==='body')return bodyPayload();
  var p=planPayload();
  /* 교체 모드에만 보유 목록을 붙인다 — 다른 모드에서는 쓸 데가 없고
     자수만 는다 */
  if(ANL==='swap')p.보유종목=swapPool();
  return p;
}
function bodyPayload(){
  var pc=paceCalc(BW,BF,GF),lt=lbmTrend(),bh=bhLoad(),nf=nutriFacts();
  var kw=kcalWeek(0),bs=bmr(BW,BF);

    남은감량:pc.remain,목표체중:pc.tw,도달예상:pc.eta||'',남은주:pc.weeks||0,
    체성분:lt?{지표:lt.k,이전:lt.from,지금:lt.to,변화:lt.d,간격일:lt.gap}:null,
    인바디건수:bh.length,
    기초대사:bs,활동계수:ACT,하루소비:Math.round(bs*ACT),
    이번주운동소비:kw?Math.round(kw.ex):null,
    섭취:(nf&&nf.completedDaysCount>0)?{일수:nf.completedDaysCount,
      평균섭취:Math.round(nf.completedDaysAvgIntake),
      평균목표:Math.round(nf.completedDaysAvgTarget)}:null,

  };

function mealPayload(){

/* 이름이 L 이었는데 차트 여백(var L=36)과 볼륨 랜드마크(var L=LMK[k])가
   같은 이름을 지역 변수로 쓰고 있었다. var 는 함수 전체로 끌어올려지므로
   그 함수 안에서는 번역이 통째로 죽는다 — 훈련 갈래 넷이 실제로 그랬다.
   짧은 이름을 전역 함수에 쓴 것이 잘못이라 이름을 바꾼다. */
function TX(k){
  if(LANG!=='en')return k;
  var v=EN[k];
  return (typeof v==='string')?v:k;
}
/* 숫자가 낀 문장. 조각으로 자르면 어순이 다른 언어에서 못 맞춘다 —
   한국어 '목표 1,805 를' 과 영어 'Target of 1,805' 는 토막 순서가 뒤집힌다.
   틀 하나를 통째로 옮기고 자리만 채운다. */
function TX1(k){
  var t=TX(k),i;

var MEAL_END={breakfast:11,lunch:16,dinner:24};
/* 목표를 '지켰다' 고 볼 폭. 100 고정이던 것을 목표에 비례시킨다 —
   목표 2,208 인 사람에게 100 은 4.5% 라 식사 기록 자체의 오차보다 좁다.
   삼성헬스가 집밥 한 끼를 100~200kcal 틀리는 것은 예사고, 같은 음식도 담는
   양에 따라 그만큼 움직인다. 재는 자가 눈금보다 굵으면 판정이 안 된다.
   10% 인 까닭: 그만큼 넘겨도 그날 적자가 550 에서 329 로 줄 뿐 부호가 안
   뒤집힌다. 방향이 살아 있는 데까지가 '지킴' 이라 부를 수 있는 자리다.
   바닥 150 은 목표가 낮은 사람 몫이다 — 1,200 의 10% 는 120 이라 도로 좁다.
   세 군데(날짜 세기·평균 판정·칸 표식)가 이 하나를 본다. 흩어 두면 세는
   수와 그리는 칸이 갈라진다. */
function okBand(target){return Math.max(150,Math.round((+target||0)*0.10));}
var PRO_PER_KG=2.0;   /* 체중당 단백질 g — 설정 · DIET 에서 바꾼다 */
/* 체중당 지방 g. 감량기에 지방을 너무 낮추면 호르몬 쪽이 먼저 무너져
   바닥으로 흔히 쓰는 값이다. 탄수는 목표가 아니라 '남는 것' 이므로
   상수가 없다 — 단백질·지방을 빼고 남는 열량이 곧 탄수 몫이다. */
var FAT_PER_KG=0.8;
(function(){if(!canLS)return;try{var v=parseFloat(localStorage.getItem(KEY+'.ppk'));
  if(v>=1&&v<=3)PRO_PER_KG=Math.round(v*10)/10;}catch(e){}})();
(function(){if(!canLS)return;try{var v=parseFloat(localStorage.getItem(KEY+'.fpk'));
  if(v>=0.3&&v<=1.5)FAT_PER_KG=Math.round(v*10)/10;}catch(e){}})();

function nutriFacts(){
  var ks=[],k,td0=today();
  for(k in (HC.days||{}))if(HC.days[k]&&HC.days[k].n>0)ks.push(k);
  if(!ks.length)return null;
  ks.sort();
  /* 최근 21건이 아니라 최근 21일이다. 띄엄띄엄 적으면 석 달 전 기록이
     오늘 판정의 근거가 된다. */
  var lim=new Date();lim.setDate(lim.getDate()-20);
  var limIso=lim.getFullYear()+'-'+String(lim.getMonth()+1).padStart(2,'0')+'-'+String(lim.getDate()).padStart(2,'0');
  ks=ks.filter(function(x){return x>=limIso;});
  if(!ks.length)return null;
  var td=dayTDEE(td0),dfc=Math.round(WR*7700/7);
  /* 오늘은 아직 하루가 안 끝났다. 낮 12시에 아침만 먹은 값을 하루치로
     세면 평균이 실제보다 낮게 나오고, 그 평균으로 '섭취 부족' 이라고
     진단하게 된다. 평균은 끝난 날만으로 낸다. */
  var rows={},sum=0,pk=0,i,d,done=0;
  var sumTgt=0,sumTdee=0,over=0,under=0,onT=0;
  for(i=0;i<ks.length;i++){
    d=HC.days[ks[i]];
    /* 그날의 소비로 그날의 목표를 낸다. 운동한 날은 더 먹어도 되고
       쉰 날은 덜 먹어야 같은 적자가 난다. */
    var dTd=dayTDEE(ks[i]),dTgt=Math.max(0,dTd-dfc),dif=d.kcal-dTgt;
    rows[ks[i]]={kcal:d.kcal,protein:d.p,carb:d.c,fat:d.f,n:d.n,
      tdee:dTd,target:dTgt,diff:dif,exerciseKcal:dayExKcal(ks[i]),
      partial:(ks[i]===td0)};
    if(ks[i]===td0)continue;
    sum+=d.kcal;pk+=d.p;sumTgt+=dTgt;sumTdee+=dTd;done++;
    var bnd=okBand(dTgt);
    if(dif>bnd)over++;else if(dif<-bnd)under++;else onT++;
  }
  /* 오늘 아직 안 먹은 끼니를 짚어 주려면 끼니별로 갈라야 한다.
     합계만 있으면 '저녁을 안 먹었다'를 알 수 없다. */
  var tday=HC.days[today()],goal=Math.max(0,td-dfc),tot;
  var todayBlock=null;
  if(tday&&tday.n>0){
    /* 끼니 구분은 새 APK 부터 들어온다. 옛 APK 는 합계만 보내는데,
       그때 '전부 안 먹었다'로 적으면 AI 가 굶은 줄 알고 엉뚱한 제안을 한다.
       모르는 것은 모른다고 넘긴다. */
    var ms=tday.meals,eaten=null,missing=null,skipped=null,
        ORD=['breakfast','lunch','dinner'],q;
    if(ms&&Object.keys(ms).length){
      eaten=[];missing=[];skipped=[];
      /* 끼니에는 때가 있다. 오후 5시에 안 먹은 아침은 남은 끼니가 아니라
         거른 끼니다 — 남은 몫을 거기에 배정하면 저녁 몫이 절반으로 줄어
         정작 먹을 수 있는 양을 잘못 알려 준다. 늦은 점심을 경계 뒤에
         먹으면 그때는 기록이 들어오므로 '먹음' 으로 잡힌다. */
      var nowH=new Date().getHours();
      for(q=0;q<ORD.length;q++){
        var mk=ORD[q];
        if(ms[mk]&&ms[mk].n>0){eaten.push(mk);continue;}
        (nowH>=MEAL_END[mk]?skipped:missing).push(mk);
      }
      if(ms.snack&&ms.snack.n>0)eaten.push('snack');
    }
    /* 단백질은 하루 목표를 체중당 1.8g 로 잡고 남은 몫을 낸다 */
    var pGoal=BW>0?Math.round(BW*PRO_PER_KG):null;
    todayBlock={
      eatenMeals:eaten, missingMeals:missing, skippedMeals:skipped,
      byMeal:ms||null,
      intakeSoFar:tday.kcal,
      goalIntake:goal,
      kcalLeft:goal-tday.kcal,
      proteinSoFar:tday.p,
      proteinGoal:pGoal,
      proteinLeft:pGoal!==null?Math.max(0,pGoal-tday.p):null
    };
  }
  /* 오늘 기록이 없으면 todayBlock 을 통째로 안 보낸다. 예전엔 '0kcal 먹고
     세 끼 다 남았다'로 채워 보냈는데, 삼성헬스가 아직 동기화되지 않았을 뿐인
     사람에게 하루치 식단을 더 처방하게 된다. 모르는 것과 안 먹은 것은 다르다. */
  return {
    source:'Samsung Health',
    windowDays:21,
    /* 이름으로 쓰임을 갈라 둔다. 나란히 두면 AI 가 평균을 오늘 값으로 쓴다. */
    _읽는법:'초과·부족은 날마다 다른 목표(그날 TDEE − dailyDeficitTarget)와 견준 것이며 completedDaysAvgDiff 에 이미 들어 있음. 양수면 초과, 음수면 목표보다 덜 먹음. byDay 각 날의 target·diff 도 앱이 계산해 둔 값이니 그대로 씀. completedDays* 는 끝난 날들이라 진단용, today* 는 오늘 진행 중이라 다음 끼니 제안용. 둘을 섞지 말 것.',
    completedDaysCount:done,
    completedDaysAvgIntake:done?Math.round(sum/done):null,
    /* 날마다 다른 목표의 평균 — 이것이 초과·부족의 기준이다 */
    completedDaysAvgTarget:done?Math.round(sumTgt/done):null,
    completedDaysAvgTdee:done?Math.round(sumTdee/done):null,
    completedDaysAvgDiff:done?Math.round((sum-sumTgt)/done):null,
    completedDaysAvgDeficit:done?Math.round((sumTdee-sum)/done):null,
    daysOverTarget:over,daysUnderTarget:under,daysOnTarget:onT,
    completedDaysAvgProtein:done?Math.round(pk/done):null,
    completedDaysProteinPerKg:(done&&BW>0)?Math.round(pk/done/BW*10)/10:null,
    proteinPerKgGoal:PRO_PER_KG,
    dailyDeficitTarget:dfc,
    todayTargetIntake:goal,
    todayTdee:td,
    today:todayBlock,
    byDay:rows
  };
}

/* 앱이 확정한 파생 지표 — AI가 다시 계산하다 틀리는 것을 막기 위해 그대로 전달함 */
function computedFacts(){
  var now=new Date(),dow=(now.getDay()+6)%7;
  var TR={},n=0,d,WD=wkDates();
  /* 쉬기로 표시한 날은 애초에 훈련일이 아니다 — 분모에서 빼지 않으면
     쉰 만큼 잔여가 부풀고 페이스가 미달로 잡힌다 */
  for(d=0;d<7;d++){var gd=(d+1)%7;if(RD.indexOf(gd)<0&&!isOff(WD[d])){TR[d]=1;n++;}}
  /* 걷기 30분을 훈련일로 세면 남은 훈련일이 하나 사라진다.
     근력 기준은 이미 hasTodayStrength() 가 갖고 있다 */
  var hasToday=hasTodayStrength();
  var E=0;
  for(d=0;d<=dow;d++){if(!TR[d])continue;if(d===dow&&!hasToday)continue;E++;}
  /* tops 의 e값과 여기 판정이 다른 식을 쓰면 같은 종목이 한 리포트에서
     퇴행과 진전으로 동시에 실린다 */
  var pr=heroProg(),dl=deloadSignal();
  return {
    /* dow 는 월=0 인데 배열은 일요일부터 적혀 있었다 */
    /* '마감' 과 '결산' 은 토요일·일요일이라는 뜻인데 둘이 같은 말로 읽힌다.
       기능도 똑같다 — 둘 다 vzVerdict 의 late 를 켠다. 갈라 적는다. */
    weekPhase:['초반','초반','중반','중반','중반','막바지','마지막날'][dow],
    trainDaysPerWeek:n,
    elapsedTrainDays:E,
    remainTrainDays:Math.max(0,n-E),
    streakDays:heroStreak(),
    progressedCount:pr.up,
    stalledCount:pr.stall,
    regressedCount:pr.down,
    stalledNames:pr.stN,
    regressedNames:pr.dnN,
    deloadCandidates:dl?dl.n:0
  };
}
function paceLeft(){
  try{
    var now=new Date();
    var dow=(now.getDay()+6)%7; /* 월=0 */
    var TR={},td3,WD=wkDates();
    for(td3=0;td3<7;td3++){
      var gd=(td3+1)%7; /* 월0→getDay1 */
      /* 쉬기로 표시한 날은 분모에서 뺀다. 이 값을 vzVerdict 의 페이스 판정과
         pgWhy 의 회피 규칙이 같이 쓰므로, 여기 하나를 안 고치면 함께 틀린다. */
      if(RD.indexOf(gd)<0&&!isOff(WD[td3]))TR[td3]=1;
    }
    var hasToday=hasTodayStrength();
    var TN=0,d3;
    for(d3=0;d3<7;d3++)if(TR[d3])TN++;
    if(!TN)return -1;
    var E=0,d2;
    for(d2=0;d2<=dow;d2++){
      if(!TR[d2])continue;
      if(d2===dow&&!hasToday)continue;
      E++;
    }
    return Math.round(E*100/TN);
  }catch(e){return -1;}
}
var AINEG=['과다','부족','미달','위험','우려','초과','부채','이탈','정체로','저조'];

/* 판정어 → 칩 라벨·톤. 구체적인 것부터 검사함 */
var AISTAT=[
  ['없음','정상','pos'],
  ['위반','위반','neg'],['퇴행','퇴행','neg'],['재빌드','재빌드','neg'],['시급','시급','neg'],
  ['미달','미달','neg'],['부족','부족','neg'],['빈약','부족','neg'],['과중','과중','neg'],
