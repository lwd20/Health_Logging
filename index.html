:root{--grid-img:none;--grid-size:38px 38px}

.kwk{display:flex;gap:5px;margin-top:10px;align-items:flex-end}
.kwd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.kbar{position:relative;width:100%;height:58px;display:flex;flex-direction:column-reverse;
  border-radius:var(--rad-s);background:rgba(var(--tx-rgb),.05);overflow:hidden}
.kbar i{display:block;width:100%}
.kex{background:var(--acc-sf)}
/* 평균선 — 막대 위로 지나가되 막대를 가리지 않게 얇고 흐리게 */
.kwd b{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.kwd u{font-family:var(--mono);font-size:9px;color:var(--dim);text-decoration:none;font-variant-numeric:tabular-nums}
.kwd.now b{color:var(--acc-br)}
.kwd.now .kbar{box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.55)}
.kwd.fut .kbar{background:rgba(var(--tx-rgb),.025)}
.kwd.rest .kbar{background:rgba(var(--tx-rgb),.03)}
.kwd.rest u{opacity:.5}
/* 네 칸을 고정 폭으로 세워야 주끼리 세로로 비교된다.
   flex 로 두면 자릿수에 따라 열이 흔들려 눈이 매번 자리를 다시 찾는다. */
/* 행 길이 자체가 그 주의 크기 — 숫자를 읽기 전에 흐름이 먼저 보인다 */
.patsub{font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--dim);margin:12px 2px 0}
/* 2열 40개는 1,251px 이었다. 미리보기가 결과를 바로 보여 주므로 견본은
   무엇인지 알아볼 정도면 된다 — 4열로 줄인다 */
.patgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}
.psw{position:relative;display:flex;flex-direction:column;gap:4px;padding:0;border:0;background:none;text-align:left}
.psw i{display:block;height:30px;border-radius:var(--rad-s);overflow:hidden;position:relative;
  border:var(--bw) solid rgba(var(--tx-rgb),.10);
  background:linear-gradient(rgba(var(--tx-rgb),.055),rgba(var(--tx-rgb),.055)),var(--bg)}
/* 무늬는 ::after 로 덧씌우고 실제 화면과 같은 필터를 건다 */
.psw i::after{content:'';position:absolute;inset:0;filter:var(--grid-f)}
.psw b{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psw.on i{border-color:var(--acc-br);box-shadow:0 0 0 1px var(--acc-br)}
.psw.on b{color:var(--acc-br)}
.psw:active{opacity:.6}

.top::before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;border-radius:inherit;overflow:hidden;background-image:var(--grid-img);background-size:var(--grid-size);-webkit-mask-image:linear-gradient(#000 62%,rgba(0,0,0,.35));mask-image:linear-gradient(#000 62%,rgba(0,0,0,.35));filter:var(--grid-f);pointer-events:none;z-index:-1}
/* 앱이 창을 상태바 밑까지 늘리면 그 높이만큼 머리글을 내려야 시계에 안 가린다.
   env() 가 0 을 돌려주는 기기가 있어 네이티브가 알려 준 --sbh 를 먼저 쓴다. */
.top{position:sticky;top:0;z-index:10;background:linear-gradient(rgba(var(--tx-rgb),.055),rgba(var(--tx-rgb),.055)),var(--bg);padding-top:var(--sbh,env(safe-area-inset-top));border-bottom:1px solid rgba(var(--tx-rgb),.18);border-radius:0 0 var(--rad-l) var(--rad-l);transition:box-shadow .18s ease}
/* 목록이 밑으로 지나가기 시작하면 상단이 떠 보이게 함 */
.top.lift{box-shadow:0 10px 20px -14px rgba(0,0,0,.55),0 1px 0 rgba(var(--tx-rgb),.05)}
header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 0}
header>div:first-child{flex:1 1 auto;min-width:0}
h1{font-size:22px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1}
h1 em{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.005em;color:var(--acc-br)}
/* 꼬리 선 — 워드마크 쪽에서 금색으로 시작해 오른쪽으로 사라진다.
   로고에 바닥을 깔아 주면서 헤더와 아래를 가르는 일도 함께 한다. */
header::after{content:'';position:absolute;left:18px;right:18px;bottom:0;height:1px;
  background:linear-gradient(90deg,var(--acc-br),var(--line) 42%,transparent)}
/* 여섯 줄이 같은 간격으로 놓이면 무엇이 한 덩어리인지 알 수 없다.
   묶음 안은 좁게, 묶음 사이는 넓게 — 정체 / 오늘 / 조작 세 덩어리로 읽히게. */
.hdate{font-family:var(--mono);font-size:13px;color:var(--tx);margin:10px 0 0;padding:0 18px;display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;max-width:100%}
.dgrp{display:flex;align-items:center;gap:2px;min-width:0}
/* '운동 없음' 은 누르면 '쉬는 날' 이 된다. 글자만 두면 눌리는 줄 모르므로
   테두리를 준다 — 켜지면 강조색으로 채워 한눈에 갈린다(틴트로는 팔레트에
   따라 켜진 티가 안 난다). 세로 여백은 음수 마진으로 되돌려 줄 높이를
   안 늘리면서 누를 자리만 넓힌다. */
.doff{border:1px solid rgba(var(--tx-rgb),.22);border-radius:var(--rad-s);
  padding:11px 9px;margin:-8px 0;font-size:11px;font-weight:700;color:var(--mut);
  letter-spacing:.04em}
.doff:active{opacity:.6}
.doff.on{border-color:var(--acc-sf);background:var(--acc-sf);color:var(--on-acc)}
/* 강조색이 한 화면에 넷이면 어느 것도 강조가 아니다.
   이 줄은 아래 큰 숫자에 자리를 내주고 물러난다. */
.hdate em{font-size:11px;color:var(--dim);font-weight:700;margin-left:3px}
/* 손가락이 닿는 넓이만 넓히는 덧판. 보이지 않으므로 화면은 그대로다.
   안드로이드 권장 최소 48dp 를 채우지 못하는 작은 조작에 쓴다. */
.hit{position:relative}
.hit::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,44px);height:max(100%,44px)}
.xlink{color:var(--chrome);cursor:pointer;font-size:10px;letter-spacing:.04em}
.xlink:active{opacity:.6}
.stale{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--acc-sf);border:1px solid rgba(var(--acc-rgb),.45);border-radius:3px;padding:2px 6px;margin-left:6px;vertical-align:1px;background:rgba(var(--acc-rgb),.08)}
.favnote{display:flex;align-items:center;gap:6px;width:100%;margin:8px 0 2px;padding:9px 12px;border:1px solid rgba(var(--acc-rgb),.4);border-radius:3px;background:linear-gradient(180deg,rgba(var(--acc-rgb),.14),rgba(var(--acc-rgb),.08));color:var(--chrome);font-size:11px;font-weight:800;letter-spacing:.1em;text-align:left}
.favnote b{font-family:var(--mono);color:var(--acc-br)}
.favnote:active{opacity:.7}
/* 두 값을 좌우가 아니라 위아래로 세운다. 라벨 칸과 숫자 칸을 나눠 두면
   글자 수가 달라도 숫자의 오른쪽 끝이 어긋나지 않는다. */
/* 테두리 2px 질감(sharp·neo)에서 320px 화면 밖으로 2px 밀려났다 —
   min-width 기본값 auto 라 플렉스 안에서 줄어들 수 없었다 */
#henrg{min-width:0}
.hstat{min-width:0;display:grid;grid-template-columns:auto auto;justify-content:end;
  align-items:baseline;gap:6px 12px;cursor:pointer}
.hsc{display:contents}
.hstat:active{opacity:.6}
.hsc b{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1;color:var(--mut);text-align:right}
.hsc.eat b{font-size:24px;color:var(--acc-br)}
/* 곁들이는 줄이라 위 두 줄보다 작게 — 눈이 먼저 가면 안 된다 */
/* 두 칸을 가로질러 통째로 오른쪽에 붙는다 — 라벨이 숫자에서 떨어지지 않게 */
.pro{grid-column:1/-1;text-align:right;font-family:var(--mono);font-size:12px;
  color:var(--dim);font-variant-numeric:tabular-nums;margin-top:-2px}
.pro i{font-style:normal;font-family:var(--sans);font-size:8.5px;font-weight:800;
  letter-spacing:.08em;margin-right:2px}
/* --dim 은 이미 대비 하한(4.6)이라 더 흐리게 하면 밝은 팔레트에서 4.0 으로 떨어진다.
   작게만 하고 색은 건드리지 않는다 */
.pro u{text-decoration:none;font-size:9px;margin-left:1px}
/* 두 조각 사이의 가운뎃점. 조각이 하나뿐이면 아예 안 생긴다 */
.pro s{text-decoration:none;margin:0 4px;color:var(--dim);opacity:.6}
.pro s::before{content:'·'}
/* 조각은 통째로만 접힌다 — 안 걸면 '단백질 95/' 에서 잘린다 */
.pro b{font-weight:inherit;white-space:nowrap}
/* 한 줄에 넣으려면 168px 이 필요한데 그만한 자리가 나는 것은 360px 부터다
   (tclock+tmain 167px + gap 22px 를 뺀 나머지: 320→131 · 360→171 · 375→186).
   좁은 화면에서는 조각 사이에서 접혀 각 조각이 온전히 남는다. */
@media (min-width:360px){.pro{white-space:nowrap}}
/* 단위는 숫자에 붙되 눈에 안 걸리게 — 값을 읽는 데 방해가 되면 안 된다 */
.hsc b u{text-decoration:none;font-size:9px;font-weight:700;color:var(--dim);margin-left:2px}
/* 목표를 넘겼으면 남은 값이 아니라 넘긴 값이라 색을 바꾼다 */
/* 오버레이 .ov 와 이름이 겹치면 position:fixed 와 검은 배경까지 딸려온다.
   세션 초반에 같은 충돌로 MRV 표식이 사라졌던 적이 있다 — 이름을 갈라 둔다 */
.hsc.eat b.exc{color:var(--sig)}
.hsc i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--dim);text-align:right;white-space:nowrap}
.hsc i u{text-decoration:none;font-weight:700;color:var(--mut)}
.hnrg{flex:0 0 100%;display:grid;grid-template-columns:auto auto auto auto;justify-content:start;column-gap:8px;row-gap:3px;align-items:baseline;margin-top:6px;cursor:pointer}
.hnrg:active{opacity:.65}
.hnrg .k{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.hnrg .v{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--acc-br);letter-spacing:.01em;text-align:right;font-variant-numeric:tabular-nums}
.hnrg i{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--dim)}
.hnrg .tag{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.02em;white-space:nowrap}
.hnrg .tag.dfc{color:var(--sig)}
.dtag{font-style:normal;font-size:10px;font-weight:500;color:var(--dim);margin-left:2px;white-space:nowrap}
.dtag.now{color:var(--chrome);font-weight:700}
.rr i.up,.rr i.dn,.rr i.eq{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim)}
.rr i.eq{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.04em}
.rr i.up{color:var(--pos)}
.rr i.dn{color:var(--neg)}
.setr .sv{margin-left:auto;display:flex;align-items:baseline;gap:7px;font-size:10px;color:var(--dim);letter-spacing:.02em}
.setr .sv u{text-decoration:none;font-size:10px;color:var(--dim)}
.lmunk{margin:8px 2px 0;font-size:10px;color:var(--dim);line-height:1.45}
/* 도달일이 안 나오는 상태 — 날짜 배지 자리에 이유가 들어가므로 색을 달리한다 */
/* 배경을 깔면 --sig 가 밀려 올라가 5개 팔레트에서 4.5 아래로 떨어졌다(최저 3.87).
   평소 배지와 같은 모양에 색만 바꾼다 — 이미 검증된 조합이다. */
.dfoot em.warn{color:var(--sig);letter-spacing:0}
/* 값이 실측이 아닐 때 — 숫자를 그냥 보여 주면 실측인 줄 안다 */
.note b.warn{color:var(--sig)}
.dnav{padding:13px 15px;margin:-8px 0;color:var(--dim);font-size:13px}
.dnav:active{color:var(--tx)}
.dnav:disabled{opacity:.25}
.dtxt{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dtxt.past{color:var(--sig);font-weight:700}
.dtoday{border:1px solid var(--sig);color:var(--sig);border-radius:var(--rad-s);padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px;letter-spacing:.06em}
.hbtns{display:flex;align-items:center;gap:2px;flex:0 0 auto;white-space:nowrap;margin-top:2px}
.hjrn{padding:15px 10px;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.hjrn:active{color:var(--tx)}
.scnt{padding:2px 18px 0;font-family:var(--mono);font-size:11px;color:var(--chrome);letter-spacing:.08em}
/* 휴식 타이머 — 가로로 눕던 줄을 없애고 칼로리 왼쪽 빈자리로 옮겼다.
   진행은 숫자 뒤에 깔린 큰 링이 맡으므로 자리를 따로 쓰지 않는다. */
/* 배경에 크게 깔면 패널 모서리에 잘려 얼룩이 된다 — 제 크기의 시계로 세운다 */
.trow{position:relative;padding:0 18px;margin-top:9px;
  display:flex;align-items:center;gap:11px}
#henrg{margin-left:auto}
/* 시간은 링 안에 있으므로 여기는 라벨과 조작만 맡는다 */
.tmain{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.tlab{font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
.tmain b{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1;color:var(--mut)}
.tmain u{text-decoration:none;font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;color:var(--dim);margin-top:-3px}
.tacts{display:flex;align-items:center;gap:5px;margin-top:1px}
/* 링을 누르는 것으로는 리셋과 정지를 가릴 수 없어 글자 버튼을 그대로 둔다 */
/* 세트마다 누르는 버튼인데 22px 높이였다. 알약은 그대로 두고 덧판으로 넓힌다 */
.tbtn{position:relative;flex:0 0 auto;padding:6px 11px;border:var(--bw) solid rgba(var(--tx-rgb),.14);
  border-radius:999px;background:none;color:var(--dim);
  font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.tbtn::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,52px);height:44px}
.tbtn:active{opacity:.55}
.trow.run .tbtn.go{color:var(--acc-br);border-color:rgba(var(--acc-rgb),.45)}
#trBtn{color:var(--sig);border-color:rgba(var(--sig-rgb),.35)}
/* 정지 상태에서는 STOP이 할 일이 없으므로 숨김 */
.trow:not(.run) #trBtn{display:none}
/* 시간을 품은 링. 마스크는 자식까지 먹으므로 숫자는 링의 형제로 둔다 */
.tclock{position:relative;flex:0 0 auto;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center}
.tring{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  transform:rotate(-90deg);
  background:conic-gradient(var(--acc-sf) 0 0deg, rgba(var(--tx-rgb),.13) 0deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 0 21px,#000 21.5px);
  mask:radial-gradient(circle,transparent 0 21px,#000 21.5px)}
.tclock b{position:relative;font-family:var(--mono);font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--mut)}
.trow.run .tclock b{color:var(--chrome)}
/* 목표 도달 — 이제 다음 세트로 갈 때 */
.trow.done .tclock b{color:var(--pos)}
.trow.done .tmain u{color:var(--pos)}
.trow.mark .tclock b{color:var(--sig)}
.mbtn{position:relative;width:44px;height:44px;color:var(--mut);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.mbtn.qbtn{width:44px;font-size:0}
.mbtn.qbtn{margin-left:6px}
@media (max-width:360px){
  header{padding-left:14px;padding-right:14px}
  header::after{left:14px;right:14px}
  h1{font-size:19px}
  h1 em{font-size:19px}
  /* 좁다고 세로까지 줄이면 다시 44 밑으로 내려간다 — 가로만 줄인다 */
  .hjrn{padding:15px 6px;letter-spacing:.05em}
  .mbtn{width:40px}
  .mbtn.qbtn{width:40px;margin-left:2px}
  /* 상단 패널의 모든 줄이 같은 세로선에서 시작해야 한다 */
  .hdate,nav,.trow{padding-left:14px;padding-right:14px}
  /* 320px 에서 칼로리 블록이 화면 밖으로 8px 나갔다.
     링을 한 치수 줄이고(구멍 반경도 같이) 숫자를 한 단계 낮춘다 */
  .trow{gap:8px}
  .tclock{width:46px;height:46px}
  .tring{-webkit-mask:radial-gradient(circle,transparent 0 18px,#000 18.5px);
    mask:radial-gradient(circle,transparent 0 18px,#000 18.5px)}
  .tclock b{font-size:11px}
  .tmain b,.hsc b{font-size:19px}
  .hsc.eat b{font-size:22px}
  .hstat{gap:5px 9px}
  /* 오른쪽 고정 칸이 그대로면 이름이 69px 까지 눌린다 */
  .rr{flex:0 0 92px}
  .rr .rp{flex:0 0 36px}
  .grp{padding:0 10px}
}
.mbtn.qbtn::before{content:'?';display:flex;align-items:center;justify-content:center;width:21px;height:21px;border:1px solid rgba(var(--tx-rgb),.22);border-radius:50%;font-size:11px;font-weight:800;line-height:1}
.mbtn.qbtn:active::before{border-color:var(--chrome);color:var(--chrome)}
.mbtn:active{color:var(--tx)}
.mbtn.warn::after{content:'';position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--sig)}
/* 앱의 다른 라벨(CHEST 13, GYM80 4, RECOVERY)과 같은 대문자 자간 체계.
   칠해진 버튼 대신 글자만 두고 선택된 것만 강조색+밑줄로 표시함.
   6개가 한 줄에 들어가도록 자간과 크기를 맞췄고, 남는 폭은 간격으로 분배함. */
/* 여기서부터는 '보는 것'이 아니라 '누르는 것' — 선 하나로 갈라 둔다 */
nav{display:flex;align-items:center;justify-content:space-between;gap:4px;
  margin-top:14px;padding:3px 18px 0;border-top:1px solid rgba(var(--tx-rgb),.07)}
#chips .chip{position:relative;flex:0 0 auto;margin:0;min-width:0;
  padding:16px 0 14px;background:none;border:0;border-radius:0;
  font-size:11px;line-height:17px;font-weight:700;letter-spacing:.05em;color:var(--dim);
  overflow:visible;white-space:nowrap}
#chips .chip.on{color:var(--acc-br)}
#chips .chip.on::before{content:'';position:absolute;left:0;right:0;bottom:9px;height:2px;background:var(--acc-sf);border-radius:1px}
#chips .chip:active{opacity:.55}
/* 근육 거르개. 위(부위)는 밑줄, 이건 알약 — 같은 모양으로 두 줄을 쌓으면
   어느 쪽이 상위인지 흐려진다. */
/* nav 에 justify-content:space-between 이 걸려 있다(584줄). 안 덮으면
   알약이 폭 전체로 벌어져 '전체' 와 '기타' 사이가 화면만큼 떨어진다.
   왼쪽부터 붙여 늘어놓고 넘치면 옆으로 민다. */
#subchips{display:flex;justify-content:flex-start;align-items:center;
  gap:6px;overflow-x:auto;padding:0 13px 9px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
#subchips::-webkit-scrollbar{display:none}
#subchips:empty{display:none}
/* 부위 칩도 넘치면 옆으로 밀리게. #subchips 에는 있는데 여기만 없어서
   큰 글꼴 설정에서 마지막 부위(CARDIO)가 잘린 채 손에 안 닿았다. */
#chips{overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none}
#chips::-webkit-scrollbar{display:none}
.schip{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:4px;
  padding:6px 11px;border-radius:100px;background:var(--inset);
  border:var(--bw) solid rgba(var(--tx-rgb),.07);color:var(--mut);
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  line-height:1.25}
.schip i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.55}
.schip.on{background:var(--acc-sf);border-color:transparent;color:var(--on-acc)}
.schip.on i{opacity:.85}
.schip:active{opacity:.6}
/* 상태 점은 글자 위에 얹음 — 한 줄이라 옆에 둘 자리가 없음 */
#chips .chip.stale::after,#chips .chip.hot::after{top:7px;left:50%;right:auto;margin-left:-2px;width:4px;height:4px}
/* ★는 부위 선택이 아니라 보기 전환이라 맨 앞에 따로 둠 */
/* 17px 폭이라 전체에서 가장 누르기 어려웠다. 덧판은 밑줄용 ::before 와
   부딪혀 지워졌으므로, 왼쪽 여백을 실제로 먹이고 그만큼 당겨 놓는다.
   line-height 를 못 박아 다른 칩과 높이를 맞춘다 */
#chips .chip.favtg{width:auto;height:auto;margin-left:-13px;padding:16px 5px 14px 13px;
  font-size:13px;line-height:17px;letter-spacing:0;color:var(--chrome)}
#chips .chip.favtg.on{color:var(--acc-br)}
/* 여섯 개가 한 줄이라 폭이 줄면 간격부터 사라진다.
   글자를 줄이기 전에 좌우 여백과 자간을 먼저 내준다 */
@media (max-width:376px){
  nav{padding-left:12px;padding-right:12px}
  #chips .chip{letter-spacing:.02em}
}
@media (max-width:344px){
  nav{gap:2px}
  #chips .chip{font-size:10px;letter-spacing:.01em}
}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:var(--rad-s);background:var(--btn-bg);border:var(--bw) solid rgba(var(--tx-rgb),.09);color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.06em}
.chip.on{background:var(--acc-sf);border-color:transparent;color:var(--on-acc)}
.chip i{font-size:9px;opacity:.55;margin-left:3px}
.chip{position:relative}
.chip.stale::after{content:'';position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--chrome);box-shadow:0 0 5px rgba(var(--acc-rgb),.5)}
.chip.on.stale::after{background:rgba(var(--acc-rgb),.4);box-shadow:none}
.chip.hot::after{content:'';position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--sig);box-shadow:0 0 5px rgba(var(--sig-rgb),.55)}
.chip.on.hot::after{background:rgba(var(--sig-rgb),.45);box-shadow:none}

/* ── 목록: 머신 랙 ── */
main{padding:14px 14px calc(122px + env(safe-area-inset-bottom));max-width:100%;overflow-x:hidden;overflow-x:clip}
html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-y:none}
.panel,.inrow{max-width:100%}
.mc{max-width:100%}
.mc.did{max-width:none}
.shd{display:flex;align-items:center;gap:9px;margin:18px 2px 8px;font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--mut);text-transform:uppercase}
.shd::after{content:'';flex:1;height:1px;background:var(--line)}
.shd i{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:0}
.grp{background:var(--surf);border:var(--bw) solid rgba(var(--tx-rgb),.07);border-radius:var(--rad-card);padding:0 13px;box-shadow:var(--elev);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.mc{border-bottom:1px solid rgba(var(--tx-rgb),.055);position:relative}
.mc.did::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:var(--acc-sf)}
.mc.did{background:rgba(var(--acc-rgb),.05);margin:0 -13px;padding:0 13px}
.mc.did .nm{color:var(--tx)}
.mc.on .nm{color:var(--tx)}
.rr.thin{flex:0 0 auto}
.prm{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--on-acc);background:var(--acc-sf);border-radius:999px;padding:1px 6px;font-family:var(--sans)}
.dtag.done{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--acc-br);background:transparent;border:1px solid rgba(var(--acc-rgb),.45);border-radius:999px;padding:1px 7px;margin-left:2px;vertical-align:1px}
.grp .mc:last-child{border-bottom:0}
/* 기록이 있는 줄은 큰 숫자 때문에 51px, 없는 줄은 45px 이라
   목록 왼쪽이 들쭉날쭉했다 — 낮은 쪽을 끌어올린다 */
.row{display:flex;width:100%;min-height:51px;align-items:center;justify-content:space-between;gap:9px;padding:11px 2px;text-align:left}
.rl{flex:1 1 auto;min-width:0}
.nm{display:flex;align-items:baseline;gap:7px;font-size:15px;font-weight:600;color:var(--mut);letter-spacing:-.005em;min-width:0}
.nm b{font-weight:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 자리가 모자라면 이 라벨이 먼저 줄어야 한다 — 종목 이름이 아니라.
   같은 클래스에 규칙을 두 번 쓰면 뒤엣것이 flex 를 덮어써서 반대로 동작한다. */
.ln{flex:0 100 auto;min-width:0;max-width:40%;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{flex:0 0 auto;font-size:9px;font-weight:800;color:var(--chrome);opacity:.85;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(var(--acc-rgb),.35);border-radius:var(--rad-s);padding:2px 6px;background:rgba(var(--acc-rgb),.1);box-shadow:none}
.sub{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.02em}
.sub em{color:var(--chrome);font-weight:700}
.rr{flex:0 0 106px;display:flex;align-items:baseline;justify-content:flex-end;font-family:var(--mono);white-space:nowrap}
.rr .rw{flex:0 0 62px;min-width:0;text-align:right;white-space:nowrap}
.rr .rp{flex:0 0 44px;min-width:0;text-align:right;white-space:nowrap}
.rr .rp .ago{font-style:normal;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.03em}
.rr .none{flex:1;text-align:right}
.fav{flex:0 0 auto;width:44px;height:46px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--dim);margin-left:-13px;margin-right:3px;opacity:.75}
.fav.on{color:var(--chrome);opacity:1;text-shadow:0 0 8px rgba(var(--acc-rgb),.35)}
.w{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.u{font-size:9px;color:var(--dim);margin-left:3px;letter-spacing:.06em}
.none{font-size:10px;color:var(--dim);letter-spacing:.1em}

/* ── 확장 패널: 가공 포켓 ── */
.panel{background:transparent;border:0;border-radius:0;padding:0;margin:0;box-shadow:none}
.empty{font-size:12px;color:var(--dim);text-align:center;padding:13px 0;letter-spacing:.06em}
.pdate{font-family:var(--mono);font-size:11px;color:var(--sig);font-weight:700;margin-bottom:9px;letter-spacing:.06em}


.segchips{gap:6px;margin:0 0 2px}
.segchips .chip{padding:11px 4px;font-size:11px;letter-spacing:.03em}
.fgrp{margin-top:20px}
.ft{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--chrome);opacity:.75;margin:0 2px 2px}
.frow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 2px;border-bottom:1px solid rgba(var(--tx-rgb),.07);text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.frow:last-of-type{border-bottom:0}
.fk{flex:0 0 62px;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:-.01em}
.fv{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:7px}
.fin{flex:1;min-width:0;text-align:right;font-size:15px;font-weight:600;color:var(--tx);background:none;border:0;padding:0}
.fin::placeholder{color:var(--dim);font-weight:400}
.frow.chiprow .fv{gap:5px}
.frow.chiprow .wrapchips{gap:5px;justify-content:flex-end}
.frow.chiprow .chip{padding:7px 11px;font-size:11px;font-weight:700}
/* 설정 시트는 좌측 레일 때문에 본문이 233px로 좁음 — 라벨과 칩을 줄여 한 줄에 맞춤 */
.dbody .frow{gap:8px;min-height:44px}
.dbody .fk{flex:0 0 48px;font-size:11px}
.dbody .frow.chiprow .chip{padding:7px 8px;font-size:10px}
.frow.pk .fv b{font-size:13px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow.pk .fv u{flex:0 0 auto;text-decoration:none;font-size:10px;color:var(--dim);letter-spacing:.02em}
.frow.pk .fv i{flex:0 0 auto;font-style:normal;font-size:13px;color:var(--chrome);width:14px;text-align:center}
.frow.pk:active{opacity:.6}
.frow.pk.on{border-bottom-color:transparent}
.frow.pk.on .fv i{color:var(--sig)}
.pickbody{margin:2px 0 4px;padding:2px 11px 11px;border-radius:var(--rad-m);background:rgba(var(--tx-rgb),.04)}
.gridchips{display:grid;grid-auto-rows:minmax(42px,1fr);gap:5px;margin-top:9px}
.gridchips.c2{grid-template-columns:1fr 1fr}
.gridchips.c3{grid-template-columns:1fr 1fr 1fr}
.gridchips .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;padding:8px 6px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0;background:rgba(var(--tx-rgb),.05);border-color:rgba(var(--tx-rgb),.08)}
.gridchips .chip.on{background:var(--acc-sf);border-color:transparent;color:var(--on-acc);font-weight:800}
.gridchips.c2>.chip:last-child:nth-child(odd){grid-column:1/-1}
.gridchips.c3>.chip:last-child:nth-child(3n+1){grid-column:1/-1}
.gridchips.c3>.chip:last-child:nth-child(3n+2){grid-column:span 2}
.gridchips .chip i{font-size:9px;opacity:.6;margin:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickbody .namerow{margin-top:9px}
.pickbody .namein{padding:9px 11px;border-radius:var(--rad-s);background:var(--sunk);border-color:rgba(var(--tx-rgb),.08)}
/* 16px 미만이면 iOS 사파리가 입력할 때 화면을 확대해 버린다 */
.pickbody .namein input{font-size:17px}
.pickbody .note{margin-top:9px;font-size:11px}
/* ── 붙박이 미리보기 ── */
/* 고르는 동안 결과가 안 보이면 13,600 가지를 눈감고 고르는 셈이다.
   시트 스크롤 꼭대기에 붙여 두면 무늬 목록 끝까지 내려가도 계속 보인다. */
/* 탭줄(.drail)이 위에 붙어 있으므로 그 높이만큼 내려서 붙는다 */
.thprev{position:sticky;top:42px;z-index:6;margin:-2px 0 12px;padding:4px 0 10px;
  background:var(--sheet-bg)}
.tpv{border-radius:var(--rad-l);overflow:hidden;box-shadow:var(--elev)}
.tpv-top{position:relative;z-index:0;display:flex;align-items:center;gap:8px;
  padding:9px 12px;background:linear-gradient(rgba(var(--tx-rgb),.055),rgba(var(--tx-rgb),.055)),var(--bg);
  border-bottom:1px solid rgba(var(--tx-rgb),.18)}
/* 상단 판의 무늬를 실제와 같은 방식으로 — 밝은 팔레트는 --grid-f 로 뒤집힌다 */
.tpv-top::before{content:'';position:absolute;inset:0;background-image:var(--grid-img);
  background-size:var(--grid-size);filter:var(--grid-f);pointer-events:none;z-index:-1}
.tpv-top b{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--tx)}
.tpv-top b i{font-style:normal;color:var(--acc-br);margin-left:1px}
.tpv-tag{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.12em;
  color:var(--dim);border:var(--bw) solid rgba(var(--tx-rgb),.16);
  border-radius:var(--rad-s);padding:3px 7px}
.tpv-body{display:flex;gap:8px;padding:8px;background:var(--bg)}
.tpv-card{flex:1 1 auto;min-width:0;background:var(--surf);border:var(--bw) solid rgba(var(--tx-rgb),.07);
  border-radius:var(--rad-card);padding:9px 11px;box-shadow:var(--elev)}
.tpv-card i{display:block;font-style:normal;font-size:8.5px;font-weight:800;
  letter-spacing:.14em;color:var(--dim)}
.tpv-card b{display:block;margin-top:1px;font-family:var(--mono);font-size:18px;
  font-weight:700;color:var(--acc-br);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tpv-card b u{text-decoration:none;font-family:var(--sans);font-size:9px;
  font-weight:700;color:var(--dim);margin-left:3px}
.tpv-bar{display:block;height:5px;margin-top:7px;border-radius:99px;
  background:rgba(var(--tx-rgb),.1);overflow:hidden}
.tpv-bar s{display:block;height:100%;background:var(--acc-sf);text-decoration:none}
.tpv-side{flex:0 0 84px;display:flex;flex-direction:column;justify-content:space-between;gap:7px}
.tpv-btn{display:flex;align-items:center;justify-content:center;height:27px;
  border-radius:var(--rad-m);background:var(--acc-sf);color:var(--on-acc);
  box-shadow:var(--elev2);font-size:8.5px;font-weight:800;letter-spacing:.1em}
.tpv-tx{display:flex;flex-direction:column;gap:1px;text-align:right;line-height:1.25}
.tpv-tx em{font-style:normal;color:var(--mut)}
.tpv-tx ins{text-decoration:none;color:var(--dim)}
.tpv-tx{font-size:9px;font-weight:700;color:var(--tx)}

/* ── 시안 ── */
.psets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.pset{display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:9px 10px;border:var(--bw) solid rgba(var(--tx-rgb),.09);
  border-radius:var(--rad-m);background:none;text-align:left;min-width:0}
.pset .pss{display:flex}
.pset .sw{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pset .sw+.sw{margin-left:-5px}
.pset b{font-size:11.5px;font-weight:700;color:var(--mut);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pset i{font-style:normal;font-size:9px;color:var(--dim);line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pset.on{border-color:rgba(var(--acc-rgb),.55);background:rgba(var(--acc-rgb),.1)}
.pset.on b{color:var(--tx)}
.pset:active{opacity:.6}
/* 붙박이가 화면의 3분의 1을 넘으면 정작 고를 자리가 없다 — 미리보기를 조금 낮춘다 */
.dsubs{display:flex;gap:3px;margin-top:9px}
.dsb{flex:1 1 0;min-width:0;height:34px;display:flex;align-items:center;justify-content:center;
  gap:4px;border:var(--bw) solid rgba(var(--tx-rgb),.09);border-radius:var(--rad-m);
  background:none;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden}
.dsb u{text-decoration:none;font-family:var(--mono);font-size:9px;font-weight:700;opacity:.7}
.dsb.on{border-color:rgba(var(--acc-rgb),.55);background:rgba(var(--acc-rgb),.1);color:var(--tx)}
.dsb:active{opacity:.6}
.fg1{margin-top:14px}

/* ── 색 격자 ── */
/* 스와치와 이름만 있으면 되는데 한 줄을 통째로 쓰고 있었다 */
.palgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.pchip{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 4px 8px;border:var(--bw) solid rgba(var(--tx-rgb),.09);
  border-radius:var(--rad-m);background:none;min-width:0}
.pchip .sws{display:flex}
.pchip .sw{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pchip .sw+.sw{margin-left:-5px}
.pchip b{font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pchip.on{border-color:rgba(var(--acc-rgb),.55);background:rgba(var(--acc-rgb),.1)}
.pchip.on b{color:var(--tx)}
.pchip:active{opacity:.6}
/* 미리보기가 질감을 실제로 보여 주므로 설명은 거들기만 하면 된다 — 3열 */
.techgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}

.dnow{display:flex;align-items:center;gap:6px;margin:8px 2px 0;font-size:11.5px}
.dnow b{font-weight:700;color:var(--acc-br)}
.dnow i{font-style:normal;color:var(--dim)}
.ftn{font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim);margin-left:5px}
.thcols{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
.thcol>.ft{margin:0 2px 7px}
.thcol{min-width:0}
.thcol>button{width:100%;margin-bottom:6px}
.thtech{display:block;padding:8px 8px 7px;border:var(--bw) solid rgba(var(--tx-rgb),.09);border-radius:var(--rad-m);background:none;text-align:left;min-width:0}
.thtech b{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thtech i{display:block;font-style:normal;font-size:8.5px;color:var(--dim);margin-top:2px;
  line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.thtech.on{border-color:rgba(var(--acc-rgb),.55);background:rgba(var(--acc-rgb),.1)}
.thtech.on b{color:var(--tx)}
.thtech:active{opacity:.6}
.throw{display:flex;align-items:center;gap:8px;padding:10px 11px;border:var(--bw) solid rgba(var(--tx-rgb),.08);border-radius:var(--rad-m);background:rgba(var(--tx-rgb),.035);text-align:left;min-width:0}
.throw.on{border-color:rgba(var(--acc-rgb),.55);background:rgba(var(--acc-rgb),.1)}
.throw .sws{flex:0 0 auto;display:flex}
.throw .sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.throw .sw+.sw{margin-left:-6px}
.throw .tn{font-size:12px;font-weight:700;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.throw.on .tn{color:var(--tx)}
.throw:active{opacity:.6}
/* 시트가 이미 스크롤된다. 여기서 또 자르면 손가락을 어디에 대느냐로
   다른 게 움직이고, 안쪽에 더 있다는 표시도 없었다 */
.setwrap{margin-top:2px}
/* .inrow 는 .inzone 안에 있어 .setwrap 의 형제가 아니다.
   목록과 입력칸을 가르는 선은 실제 형제인 .inzone 에 건다 */
.setwrap+.inzone{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.setr{display:flex;align-items:center;padding:1px 0;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:0;max-width:100%}
.sete{display:flex;align-items:baseline;gap:13px;flex:1;min-width:0;text-align:left;padding:8px 2px}
.sete:active{opacity:.5}
.setr i{width:16px;font-size:10px;font-weight:700;color:var(--dim)}
.setr b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.setr u{font-size:10px;color:var(--dim)}
.setr span{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.setr.editing{background:rgba(var(--acc-rgb),.09);border-radius:var(--rad-m);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.3)}
.plusbtn.upd{background:rgba(var(--acc-rgb),.14);border-color:rgba(var(--acc-rgb),.45);color:var(--acc-br)}
.cancelbtn{width:100%;height:36px;margin-top:8px;border-radius:var(--rad-m);background:transparent;border:0;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.cancelbtn:active{color:var(--tx)}
.badv{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--sig);border:1px solid rgba(var(--sig-rgb),.5);border-radius:999px;padding:1px 6px;margin-left:5px}
/* 원이던 것을 알약으로. 'RIR' 세 글자가 28px 안쪽에 안 들어갔다 */
.setr .rir{position:relative;flex:0 0 auto;width:46px;height:28px;margin-right:9px;border:1px solid transparent;border-radius:999px;font-family:var(--mono);letter-spacing:.02em;background:transparent;display:flex;align-items:center;justify-content:center}
.setr .rir::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.setr .rir b{font-size:13px;font-weight:700;line-height:1}
/* 점만 찍어 두면 눌러서 값을 넣는 자리인 줄 모른다.
   글자를 보이고 점선 테두리로 아직 비었음을 알린다. */
.setr .rir.off{font-size:9px;font-weight:800;letter-spacing:.02em;color:var(--dim);border:1px dashed var(--line)}
.setr .rir.on{color:var(--acc-br);border-color:rgba(var(--acc-rgb),.4);background:rgba(var(--acc-rgb),.09)}
.setr .rir.hard{color:var(--neg);border-color:rgba(var(--sig-rgb),.45);background:rgba(var(--sig-rgb),.12)}
/* 볼륨에 안 들어가는 세트 — 켜져 있지만 강조색을 안 준다 */
.setr .rir.easy{color:var(--dim);border-color:var(--line);background:rgba(var(--tx-rgb),.04)}
.setr .rir:active{opacity:.5}
.setr .del{margin-left:auto;width:44px;height:44px;color:var(--dim);font-size:17px;flex:0 0 auto}
.setr .del:active{color:var(--sig)}
.setr .del.armed{color:var(--on-acc);font-size:15px;font-weight:700;background:radial-gradient(circle at 50% 50%,var(--sig) 0 14px,rgba(var(--sig-rgb),.2) 14px 18px,transparent 18px)}

.inrow{display:flex;gap:8px;margin-top:11px}
/* 배경을 조금이라도 깔면 파인 상자로 읽힌다. 선으로만 자리를 잡는다. */
.ctr{flex:1;display:flex;align-items:center;background:none;border:var(--bw) solid rgba(var(--tx-rgb),.16);border-radius:var(--rad-s);padding:3px}
.ctr button{width:42px;height:46px;font-size:19px;color:var(--mut);flex:0 0 auto;border-radius:var(--rad-m)}
.ctr button:active{color:var(--tx);background:rgba(var(--tx-rgb),.06)}
.ctr input{flex:1 1 auto;text-align:center;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;min-width:0}
.cwrap{flex:1;min-width:0}
.clab{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin:0 0 6px 3px;font-variant-numeric:tabular-nums}

.inzone{margin-top:14px;padding:0;border:0;background:none}
.izl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 2px 8px}
.inzone .inrow{margin-top:0}
.inzone .inrow+.inrow{margin-top:8px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.plusbtn{flex:1.5 1 0;min-width:0;height:48px;border-radius:var(--rad-m);background:var(--btn-bg);border:var(--bw) solid rgba(var(--tx-rgb),.09);color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.plusbtn:active{color:var(--tx);background:rgba(var(--tx-rgb),.1)}
.plusbtn.dis{opacity:.35}
.savebtn{flex:1 1 0;min-width:0;height:48px;border-radius:var(--rad-m);box-shadow:var(--elev2);background:var(--acc-sf);color:var(--on-acc);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.savebtn:active{background:var(--acc-dk);box-shadow:none}
.savebtn.dis{background:rgba(var(--tx-rgb),.05);color:var(--dim);border:var(--bw) solid rgba(var(--tx-rgb),.08);box-shadow:none}

.prow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:2px;margin-top:7px;max-width:100%}
.pract{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.ord{width:42px;height:42px;border:var(--bw) solid rgba(var(--tx-rgb),.09);border-radius:var(--rad-s);background:var(--btn-bg);color:var(--mut);font-size:12px;line-height:1;margin-right:3px}
.ord:active{color:var(--chrome)}
.ord:disabled{opacity:.28}
.ghost{padding:12px 10px;font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.ghost:active{color:var(--tx)}
.ghost.danger{color:var(--dim)}
.ghost.armed{color:var(--sig)}
.hist{border-top:1px solid var(--line);margin-top:5px;padding-top:11px}
.spk{width:100%;height:38px;display:block;margin:0 0 9px}
/* 먹은 것과 태운 것 — 날마다 있는 자료다 */
.trg{width:100%;display:block;margin:1px 0 0}
.trg .gr{stroke:var(--line);stroke-width:1}
.trg .vg{stroke:var(--line);stroke-width:1;opacity:.5}
.trg .tk{stroke:var(--dim);stroke-width:1;opacity:.5}
.trg text{fill:var(--dim);font-family:var(--mono);font-size:8.5px}
/* 적자는 accent 로 옅게 깔고 넘긴 날만 --sig. --pos 초록은 면적이 커서
   강조가 아니라 배경이 되고, 팔레트를 바꾸면 더 어긋난다.
   눈이 가야 할 곳은 넘긴 날이지 잘한 날이 아니다. */
.trg .bOK{fill:var(--acc-br);opacity:.13}
.trg .bNG{fill:var(--sig);opacity:.20}
/* 색만으로 가르면 밝은 팔레트에서 둘 다 진한 회색으로 앉는다. 몸 그림처럼
   모양으로도 가른다 — 소비는 파선, 섭취는 실선. */
.trg .lOut{fill:none;stroke:var(--mut);stroke-width:1.7;stroke-dasharray:5 3;
  stroke-linejoin:round;stroke-linecap:butt}
.trg .lIn{fill:none;stroke:var(--acc-br);stroke-width:2.2;
  stroke-linejoin:round;stroke-linecap:round}
.trg .dOut{fill:var(--mut)}
.trg .gv{font-family:var(--mono);font-size:8.5px;font-weight:600}
/* 적자 날까지 색을 주면 여섯 개가 다 소리친다. 적자는 조용히 */
.trg .gvOK{fill:var(--mut)}
.trg .gvNG{fill:var(--sig)}
.trg .dIn{fill:var(--acc-br)}
/* 오늘은 아직 안 끝났다 — 속을 비워 끝난 날의 채운 점과 가른다 */
.trg .dInO{fill:none;stroke:var(--acc-br);stroke-width:2}
.trg .dOutO{fill:none;stroke:var(--mut);stroke-width:1.6}
.trg .tdy{opacity:.42}
.trgl{display:flex;flex-wrap:wrap;gap:3px 12px;margin:5px 2px 12px;
  font-size:11px;color:var(--mut);font-family:var(--mono);
  font-variant-numeric:tabular-nums;align-items:center}
.trgl i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
.trgl i::before{content:'';width:12px;height:0;border-top:2px dashed var(--mut)}
.trgl i.k1::before{border-top:2.2px solid var(--acc-br)}
.trgl b{color:var(--tx);font-weight:600}
.trgl u{text-decoration:none;opacity:.7;font-size:10px}
/* 요약. 표식이 붙으면 안 되므로 범례와 다른 칸이다 */
.trgs{margin:-7px 2px 12px;font-size:11.5px;color:var(--mut);
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.trgs b{color:var(--tx);font-weight:700;font-size:13px}
/* 열량 한 줄. 막대를 뺀 자리 — 원에서 복원이 안 되는 수만 남긴다 */
.kcline{display:flex;align-items:baseline;gap:8px;margin:2px 0 9px;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.kcline>span{font-size:11px;font-weight:700;color:var(--mut);font-family:inherit}
.kcline>b{font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.02em}
.kcline>b em{font-style:normal;font-size:10px;font-weight:600;color:var(--dim)}
.kcline>i{margin-left:auto;font-style:normal;font-size:11px;color:var(--mut)}
.kcline>i.ov{color:var(--sig);font-weight:700}
/* 그림 밑 설명 한 줄 */
.sbf{margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
/* 끼니 칸. 너비가 열량에 비례해 '저녁에 얼마 남았나' 가 길이로 온다.
   먹은 끼니는 채우고 남은 끼니는 테두리만 — 지난 일과 할 일이 눈에서 갈린다 */
.mplan{display:flex;gap:3px;margin:5px 0 5px;height:34px}
/* 눈은 앞으로 먹을 쪽으로 가야 한다 — 남은 끼니가 채운 강조색이고
   먹은 끼니가 물러선 회색이다. 처음에 이걸 거꾸로 줬었다. */
.mslot{flex:1 1 0;min-width:46px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;border-radius:4px;overflow:hidden;
  background:var(--acc-br);color:var(--on-acc)}
.mslot.on{background:var(--inset);color:var(--dim)}
.mslot b{font-size:9.5px;font-weight:800;line-height:1.25;white-space:nowrap}
/* 색만 쓰면 어느 쪽이 어느 쪽인지 약속을 알아야 읽힌다. 글자는 약속이 없다 */
.mslot em{font-style:normal;font-family:var(--mono);font-size:9.5px;
  font-weight:700;line-height:1.25;white-space:nowrap}
/* 적자는 두 막대의 '차이' 가 아니라 막대 하나를 가른 조각이다.
   차이로 그리면 두 값을 보고 빼서 그 결과가 빗금임을 알아채야 한다 —
   세 걸음이다. 조각으로 그리면 볼 것이 하나뿐이다. */
.dfb{margin:7px 0 2px}
.dfh{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:5px;
  font-variant-numeric:tabular-nums}
.dfh b{color:var(--mut);font-weight:700}
/* 식의 낱말과 막대 조각에 같은 색을 준다 — 어느 게 어느 것인지 짚을 게 없어진다 */
.dfh em{font-style:normal;font-weight:700}
.dfh em.e{color:var(--acc-br)}
.dfh em.c{color:var(--mut)}
.dfbar{display:flex;height:17px;border-radius:4px;overflow:hidden;
  background:var(--inset)}
.dfbar>i{display:block;height:100%;min-width:0}
.dfbar>i.eat{background:var(--acc-br)}
/* 경고색을 안 쓴다 — 적자는 잘못이 아니라 노리는 것이다 */
.dfbar>i.cut{background:rgba(var(--acc-rgb),.26)}
.sbf b{color:var(--mut);font-weight:700}
/* 탄단지 원 셋. 나란히 놓아야 서로 견줘진다 */
/* 아래 여백은 각주가 지고 있었다. 각주를 걷어냈으니 여기로 옮긴다 */
.rings{display:flex;gap:6px;margin:2px 0 13px}
.ring{flex:1 1 0;min-width:0;text-align:center}
.rgn{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.02em}
/* 성격표. 셋이 같은 꼴이라 안 적으면 셋 다 같은 뜻으로 읽힌다 */
.rgn i{display:block;font-style:normal;font-size:8.5px;font-weight:800;
  letter-spacing:.09em;color:var(--dim);margin-top:1px}
.rgs{width:100%;max-width:74px;height:auto;display:block;margin:3px auto 1px;
  transform:rotate(-90deg)}
.rgs .tr{fill:none;stroke:var(--inset);stroke-width:7}
.rgs .fl{fill:none;stroke:var(--acc-br);stroke-width:7;stroke-linecap:round}
/* 넘긴 것은 잘못이 아니라 채운 것이다 — 경고색이 아니라 충족색을 쓴다 */
.rgs .fl.met{stroke:var(--pos)}
/* 원을 -90도 돌렸으니 글자는 되돌려 세운다 */
.rgs .rgp{fill:var(--tx);font-family:var(--mono);font-size:14px;font-weight:700;
  text-anchor:middle;transform:rotate(90deg);transform-origin:32px 32px}
.rgv{font-family:var(--mono);font-size:10.5px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.rgv em{font-style:normal;opacity:.75}
/* 퍼센트는 상태고 이 줄은 할 일이다 — 다음에 뭘 먹어야 하는지 */
.rgd{font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--acc-br);margin-top:2px;font-variant-numeric:tabular-nums}
.rgd.met{color:var(--pos)}
/* 몸 세 선. 색 하나로만 가르면 팔레트 조합에 따라 서로 가까워지고,
   색각이상이면 조합과 무관하게 못 가른다. 굵기·선모양·점모양을 겹쳐
   준다 — 셋 중 하나만 보여도 어느 선인지 알게. */
.trg .lW{fill:none;stroke:var(--acc-br);stroke-width:2.4;
  stroke-linejoin:round;stroke-linecap:round}
.trg .lF{fill:none;stroke:var(--sig);stroke-width:1.8;stroke-dasharray:6 3.5;
  stroke-linejoin:round;stroke-linecap:butt}
/* --pos 는 mint·patina 팔레트에서 --acc-br 과 완전히 같은 색이다(dE 0).
   28개 팔레트를 다 재 보니 어떤 토큰도 세 선을 항상 갈라 주지 못한다 —
   최선이 --dim(15) 과 --mut(12) 이고 --pos·--neg 는 0 이다. 그래서 색은
   거들 뿐이고 굵기·선모양·점모양이 실제로 가른다. 그중 제일 나은 --mut. */
.trg .lM{fill:none;stroke:var(--mut);stroke-width:1.8;stroke-dasharray:1.5 2.8;
  stroke-linejoin:round;stroke-linecap:round}
/* 점도 모양을 달리한다. 인바디는 띄엄띄엄 재므로 점이 곧 '언제 쟀나' 다 */
.trg .dW{fill:var(--acc-br)}
.trg .dF{fill:var(--sig)}
.trg .dM{fill:var(--plate);stroke:var(--mut);stroke-width:1.6}
.trg .zr{stroke:var(--mut);stroke-width:1;opacity:.55}
/* 범례 표식을 그림과 같은 모양으로. 범례가 실선인데 그림이 파선이면
   범례가 거짓말이 된다 */
.trgl i.kW::before{border-top:2.4px solid var(--acc-br);width:13px}
.trgl i.kF::before{border-top:2px dashed var(--sig);width:13px}
.trgl i.kM::before{border-top:2px dotted var(--mut);width:13px}
.spk polyline{fill:none;stroke:var(--chrome);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.spk circle{fill:var(--chrome)}
.hr2{display:flex;align-items:center;gap:11px;padding:1px 2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hr2 i{flex:0 0 42px;font-size:11px;color:var(--dim)}
.hr2 b{flex:0 0 62px;font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.hr2 u{font-size:10px;color:var(--dim)}
.hr2 span{flex:1;font-size:12px;color:var(--mut);word-break:keep-all}
.hr2 .hdel{flex:0 0 auto;width:40px;height:40px;color:var(--dim);font-size:15px;margin-right:-8px}
.hr2 .hdel:active{color:var(--sig)}
.hr2 .hdel.armed{color:var(--sig);font-weight:900;font-size:11px;letter-spacing:.04em}

/* ── 하단 ── */
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 58%);z-index:9}
.addm{width:100%;height:50px;border-radius:var(--rad-m);background:var(--btn-bg);border:var(--bw) solid rgba(var(--tx-rgb),.09);box-shadow:var(--elev);font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.addm:active{color:var(--tx)}

/* ── 시트 ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet-bg);border-top:1px solid rgba(var(--tx-rgb),.08);border-radius:var(--rad-l) var(--rad-l) 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-height:82dvh;overflow-y:auto}
.sheet.tall{height:88dvh;max-height:88dvh}
.sheet.on{transform:none}
.grab{display:block;width:100%;padding:12px 0 14px;border:0;background:none;touch-action:none;cursor:grab}
.sheet.drag{transition:none}
.exitbox{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.72)}
.exitbox.on{display:flex}
.exitcard{width:100%;max-width:320px;background:var(--sheet-bg);border:1px solid var(--edge);border-radius:var(--rad-m);padding:20px 18px 16px;box-shadow:0 18px 46px rgba(0,0,0,.6)}
.exitcard p{font-size:13px;color:var(--tx);line-height:1.5;margin-bottom:16px;text-align:center}
.exitcard .row2{display:flex;gap:9px}
.exitcard .row2 button{flex:1;padding:11px 0;border-radius:var(--rad-s);font-size:11px;font-weight:900;letter-spacing:.14em;border:1px solid var(--line);background:var(--inset);color:var(--tx)}
.exitcard .row2 button.pri{background:var(--acc-sf);color:var(--on-acc);border-color:var(--acc-dk)}
.grab::before{content:'';display:block;width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-t{font-size:12px;font-weight:800;margin-bottom:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx)}
.exhead{margin:2px 0 16px}
.exname{display:flex;align-items:baseline;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--tx);line-height:1.15}
.exname i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome);opacity:.75;white-space:nowrap}
.exsub{margin-top:7px;font-family:var(--mono);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.exsub em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--dim);font-variant-numeric:tabular-nums}
.exsub u{text-decoration:none;color:var(--dim)}
/* 한 줄 — 라벨 왼쪽, 값 오른쪽. 이 앱이 다른 곳에서 쓰는 짝이다 */
.e1r{display:flex;align-items:baseline;gap:7px;margin-top:11px;padding-top:12px;
  border-top:1px solid rgba(var(--tx-rgb),.08)}
.e1r i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--dim)}
.e1r b{margin-left:auto;font-family:var(--mono);font-size:19px;font-weight:700;color:var(--tx);
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.e1r b u{text-decoration:none;font-family:var(--sans);font-size:9px;font-weight:700;
  color:var(--dim);margin-left:3px}
/* 증감은 폭을 고정해 종목을 옮겨 다녀도 숫자 오른쪽 끝이 안 흔들린다 */
.e1r s{text-decoration:none;flex:0 0 auto;min-width:56px;text-align:right;font-family:var(--mono);
  font-size:11px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.e1r s.up{color:var(--pos)}
.e1r s.dn{color:var(--sig)}
.sh-l{font-size:10px;font-weight:800;color:var(--dim);margin:16px 0 8px;letter-spacing:.2em;text-transform:uppercase}
.wrapchips{display:flex;flex-wrap:wrap;gap:5px}
/* 배경이 시트와 같은 색이라 테두리와 그림자만 남아 있었고, 안의 셋이 이미
   각자 상자라 겹겹이 두를 이유가 없다. 같은 높이·테두리·모서리로 맞추면
   그 자체가 한 덩어리로 읽힌다. */
.console{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.gmwrap{position:relative}
/* 분석칸·엔진칩·실행버튼을 같은 높이·테두리·모서리로 맞춘다.
   면은 깔지 않는다 — --btn-bg 는 5% 밝기 덧칠이라 어두운 팔레트에서 바탕을
   들어 올려 글자 대비를 4.57 에서 4.06 으로 떨어뜨렸다(AA 미달). 정작 면이
   주는 구분은 1.1:1 뿐이라 상자로 읽히게 하는 일은 테두리가 다 한다.
   테두리 .16 은 조작 컨테이너(.ctr)와 같은 값이다. 보조 버튼 기본값 .09 로
   두면 비활성 버튼(.anlbtn.dis 5%면 + .08)과 거의 같아 꺼진 것처럼 보인다. */
.gmbtn{width:100%;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border:var(--bw) solid rgba(var(--tx-rgb),.16);border-radius:var(--rad-m);background:none}
.gmbtn:active{background:rgba(var(--tx-rgb),.11)}
/* 자간 .26em 은 9px 라벨을 값만큼 넓게 벌려 둘이 같은 무게로 읽혔다.
   봐야 할 것은 고른 값이므로 라벨을 뒤로 물리고 그만큼 값에 준다. */
/* .clab 밑값의 margin:0 0 6px 3px 가 남아 라벨이 왼쪽으로 3px 밀리고
   세로로 3px 떠서 옆의 값과 가운데가 안 맞았다 */
.gmbtn .clab{flex:0 0 auto;margin:0;font-size:9px;letter-spacing:.13em;color:var(--dim);font-weight:800}
/* '볼륨 랜드마크 MEV·MRV' 가 두 줄로 감겨 그 줄만 68px 로 부풀었다 */
.gmbtn .cval{flex:1 1 auto;min-width:0;margin-left:auto;text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--acc-sf);font-family:var(--mono);
  font-size:12.5px;font-weight:700;letter-spacing:.01em}
/* 채운 삼각형은 이 화면에서 유일하게 굵은 도형이었다 */
.gmbtn::after{content:'';flex:0 0 auto;width:5.5px;height:5.5px;margin:0 2px 3px 2px;
  border-right:1.6px solid var(--mut);border-bottom:1.6px solid var(--mut);
  transform:rotate(45deg);transition:transform .18s}
.gmbtn.open::after{transform:rotate(-135deg);margin-bottom:-2px}
/* 엔진칸과 실행버튼이 한 줄을 나눠 쓴다. 목록은 이 줄 전체 폭으로 편다. */
.runrow{position:relative;display:flex;align-items:stretch;gap:8px}
/* 래퍼가 내용 크기인데 안의 버튼이 width:100% 라 서로를 참조해 폭이 0 으로
   무너졌다. 래퍼는 상자를 만들지 않게 하고 버튼을 직접 항목으로 놓는다. */
.runrow .gmwrap{display:contents}
/* 칩은 내용만큼만 차지하고 남는 폭은 실행 버튼이 가져간다 */
.runrow .gmbtn{flex:0 1 auto;width:auto;max-width:55%;padding:0 10px;justify-content:center;gap:5px}
.runrow .cval{flex:0 1 auto;min-width:0;margin-left:0;font-size:10.5px;
  color:var(--mut);letter-spacing:0}
.runrow .gmbtn::after{width:5px;height:5px;border-width:1.5px;margin:0 0 2px 0}
/* 화면 맨 아래 줄이라 아래로 펴면 접힌 부분이 안 보인다 */
.runrow .gmpop{top:auto;bottom:calc(100% + 7px)}
/* 예전에는 오른쪽 끝에 띄워 뒀는데, 좁은 화면에서 'Gemini Latest' 를 고르고
   19회를 쓰면 가운데 글자와 겹쳤다. 흐름 안에 두면 겹칠 수가 없다. */
.anlbtn u{flex:0 0 auto;text-decoration:none;font-family:var(--mono);font-size:9.5px;
  font-weight:700;letter-spacing:.02em;opacity:.72}
.anlbtn span{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anlbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;
  flex:1 1 auto;min-width:0;height:44px;border-radius:var(--rad-m);box-shadow:var(--elev2);background:var(--acc-sf);border:var(--bw) solid transparent;color:var(--on-acc);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,244,214,.35),0 1px 3px rgba(0,0,0,.4)}
.aihero{display:flex;gap:13px;align-items:center;padding:2px 1px 12px;border-bottom:1px solid var(--line)}
.aircol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
/* 링 아래에 분자·분모를 적어 둔다 — 퍼센트만 있으면 무엇의 82% 인지 모른다 */
.rcap{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.airing{width:64px;height:64px;flex:0 0 auto;position:relative}
.airing svg{transform:rotate(-90deg);display:block}
.airing .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono)}
.airing .pc b{font-size:15px;color:var(--acc-br);font-weight:700}
.airing .pc.done b{color:var(--pos)}
.airing .pc i{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.14em}

.namerow{display:flex;gap:8px;margin-top:2px}

.okbtn.rdy{background:var(--acc-sf);border-color:transparent;color:var(--on-acc)}

.ai-h{margin:18px 0 9px;padding-top:13px;border-top:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.26em;color:var(--acc-sf)}

   괜찮은 줄에는 아무것도 안 붙어 눈이 걸릴 곳이 줄어든다. */

.ai-tr{margin:8px 0;padding:10px 12px;border:var(--bw) solid rgba(var(--tx-rgb),.07);border-left:2px solid var(--chrome);border-radius:var(--rad-s);background:rgba(var(--tx-rgb),.04);box-shadow:var(--elev-p)}
.ai-tr.neg{border-left-color:var(--sig)}
.ai-tr.pos{border-left-color:var(--pos)}
.ai-tr .kr{display:flex;align-items:center;gap:8px}
.ai-tr .k{font-weight:800;font-size:13px;color:var(--tx);letter-spacing:.02em}
.ai-tr .st{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.12em;padding:2px 7px;border-radius:2px;border:1px solid rgba(var(--acc-rgb),.4);color:var(--acc-br);background:rgba(var(--acc-rgb),.1);white-space:nowrap}
.ai-tr.neg .st{color:var(--neg);border-color:rgba(var(--sig-rgb),.5);background:rgba(var(--sig-rgb),.12)}
.ai-tr.pos .st{color:var(--pos);border-color:rgba(var(--pos-rgb),.45);background:rgba(var(--pos-rgb),.1)}
.ai-tr .v{display:block;margin-top:5px;font-size:11px;line-height:1.5;color:var(--mut)}
.ai-tr .mini{margin-top:7px;height:3px;border-radius:2px;background:rgba(var(--tx-rgb),.1)}
.ai-tr .mini b{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--acc-dk),var(--acc-br))}
.ai-tr.neg .mini b{background:linear-gradient(90deg,rgba(var(--sig-rgb),.65),var(--sig))}
.ai-tr.pos .mini b{background:var(--pos)}
.ckrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:var(--bw) solid rgba(var(--tx-rgb),.07);border-radius:var(--rad-s);margin-bottom:5px;background:rgba(var(--tx-rgb),.045);font-size:11px}
.ckrow.bad{border-color:rgba(var(--sig-rgb),.5);background:rgba(var(--sig-rgb),.09)}
.ckrow .nm2{flex:1 1 auto;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);font-weight:700}
.ckrow .pt{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.ckrow .ar{flex:0 0 auto;color:var(--dim);font-size:9px}
.ckrow .sb{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--acc-br);white-space:nowrap}
.ckrow.bad .sb{color:var(--neg)}
.ckrow .ct{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mut);min-width:22px;text-align:right}
.ckrow:active{opacity:.7}
/* 이 부위의 근육이 아닌 것 — 틀렸다기보다 알려 줄 값이라 빨강은 안 쓴다 */
.ckrow.oth{border-color:rgba(var(--tx-rgb),.16)}
.ckrow.oth .sb{color:var(--mut)}
.ckrow .au{flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:.05em;
  color:var(--dim);opacity:.8}
/* 눌렀을 때 그 자리에서 고르는 칩줄 */
.skrow{display:flex;flex-wrap:wrap;gap:5px;margin:-1px 0 7px;padding:8px 9px;
  border:var(--bw) solid rgba(var(--acc-rgb),.28);border-radius:var(--rad-s);
  background:rgba(var(--acc-rgb),.05)}
.skrow b{flex:0 0 auto;padding:5px 10px;border-radius:100px;
  background:var(--inset);border:var(--bw) solid rgba(var(--tx-rgb),.08);
  color:var(--mut);font-size:10.5px;font-weight:700;white-space:nowrap}
.skrow b.on{background:var(--acc-sf);border-color:transparent;color:var(--on-acc)}
.skrow b:active{opacity:.6}
.skcap{width:100%;font-size:9.5px;color:var(--dim);margin:0 0 1px;
  letter-spacing:.04em}
/* 근육 항목 고치기 */
.sxrow{display:flex;align-items:center;gap:7px;padding:5px 9px;margin-bottom:5px;
  border:var(--bw) solid rgba(var(--tx-rgb),.07);border-radius:var(--rad-s);
  background:rgba(var(--tx-rgb),.045)}
.sxrow.off{opacity:.45}
.sxnm{flex:1 1 auto;min-width:0;background:none;border:0;outline:0;
  color:var(--tx);font-size:12px;font-weight:700;font-family:inherit;padding:4px 0}
.sxnm:focus{border-bottom:1px solid var(--acc-br)}
.sxrow .tagu{flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:.05em;
  color:var(--acc-br);opacity:.85}
.sxb{flex:0 0 auto;padding:4px 9px;border-radius:100px;font-size:10px;font-weight:700;
  border:var(--bw) solid rgba(var(--tx-rgb),.12);background:var(--inset);color:var(--mut)}
.sxb.on{background:var(--acc-sf);border-color:transparent;color:var(--on-acc)}
.sxb:active{opacity:.6}
.skhd{display:flex;align-items:baseline;gap:6px}
.sxadd{padding:3px 9px;border-radius:100px;font-size:10px;font-weight:800;
  border:var(--bw) dashed rgba(var(--tx-rgb),.25);background:none;color:var(--dim)}
.ai-sub{margin-top:5px;font-size:11px;color:var(--dim)}
.ai-total{display:flex;align-items:baseline;margin:14px 0 2px;padding-top:11px;border-top:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--mut)}
.ai-total .num{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--acc-br)}
.ai-total .num em{font-style:normal;color:var(--dim);font-weight:400}
.cdcard{background:var(--sheet-bg);border:1px solid var(--line);border-radius:var(--rad-s);padding:13px 14px 14px;margin-top:10px;box-shadow:inset 0 1px 0 var(--edge),0 2px 8px rgba(0,0,0,.45)}
.cdcard .t{display:flex;align-items:baseline}
.cdcard .lb{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
.cdcard .num{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--acc-br)}
.cdcard .num em{font-style:normal;color:var(--dim);font-weight:400;font-size:12px}
/* 목표를 채우면 색으로 알린다 — 「목표 달성」 이라고 적을 줄을 아낀다 */
.cdcard .num.done{color:var(--pos)}
.cdcard .sub2{display:flex;margin-top:7px;font-size:10px;color:var(--dim);letter-spacing:.05em}
.cdcard .sub2 b{color:var(--mut);font-weight:700}
.pacehint{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;min-height:14px}
.pacehint b{color:var(--mut)}
.ai-empty{margin:26px 0 14px;text-align:center;font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:700}
/* 넘쳤을 때 — 축 끝을 실적에 맞추고 목표 자리에 선을 긋는다.
   예전에는 100% 로 잘려 24/21 과 21/21 이 같은 꽉 찬 막대였다 */
.ai-bar.ov b{background:linear-gradient(90deg,var(--acc-dk),var(--sig))}
.ai-bar .gl{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:1px;
  background:var(--tx);opacity:.75;transform:translateX(-1px)}
/* 막대가 뜻을 갖지 않는 줄 */
.ai-row.nb .ai-bar{display:none}
/* 두 덩어리. 평평하게 늘어놓으면 어디까지가 '지금 바로' 이고 어디부터가
   'AI' 인지 알 수 없다 — 눈이 먼저 덩어리를 보고 그 다음 안을 본다. */
.zsec{margin-top:12px;padding:12px 13px 13px;border-radius:var(--rad-card);
  border:var(--bw) solid rgba(var(--tx-rgb),.1)}
.zsec.ai{border-color:rgba(var(--acc-rgb),.34);background:rgba(var(--acc-rgb),.045)}
.zhd{display:flex;align-items:baseline;margin:0 0 10px}
.zhd b{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--tx)}
.zsec.ai .zhd b{color:var(--acc-br)}
/* AI 구역은 강조 틴트를 깔아 갈라 두는데, 그 틴트가 --dim 을 밀어 올려
   다섯 팔레트에서 4.24~4.48 로 떨어졌다 — 틴트 위 흐린 글자는 이번이 세 번째다.
   틴트는 살리고 글자를 한 단계 올린다. */
.zhd i{font-style:normal;margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.zsec .console{margin-top:0}
/* 큰 카테고리 — 셋을 늘 펼쳐 둔다. 고른 칸은 강조색으로 채운다:
   틴트로는 팔레트에 따라 켜진 티가 안 나는 것을 이미 겪었다. */
.catseg{display:flex;gap:5px;margin:0 0 4px}
.catb{flex:1 1 0;min-width:0;height:46px;border:var(--bw) solid rgba(var(--tx-rgb),.16);
  border-radius:var(--rad-m);background:none;color:var(--mut);
  font-size:13.5px;font-weight:700;letter-spacing:.02em}
.catb:active{opacity:.6}
.catb.on{border-color:var(--acc-sf);background:var(--acc-sf);color:var(--on-acc);font-weight:800}
/* AI 세부 — 갈래 줄과 일부러 다르게 생겼다. 갈래는 보는 것을 바꾸고
   이것은 눌렀을 때 시킬 것을 바꾼다. */
.aitb{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px}
.aitp{flex:0 1 auto;min-height:44px;padding:0 13px;
  border:1px solid rgba(var(--tx-rgb),.18);border-radius:999px;background:none;
  color:var(--mut);font-size:11.5px;font-weight:700}
.aitp:active{opacity:.6}
.aitp.on{border-color:var(--acc-br);color:var(--acc-br);font-weight:800}
/* --dim 은 밝은 팔레트에서 4.24 로 AA 를 못 넘겼다. 이 줄은 고른 세부가
   무엇을 하는지 말하는 유일한 자리라 읽혀야 한다. */
.aidsc{margin:-2px 2px 9px;font-size:10.5px;line-height:1.4;color:var(--mut)}
/* 갈래 — 눈금이 아니라 보기 전환이므로 가볍게 */
.vzts{display:flex;gap:2px;margin:0 0 4px}
.vzt{flex:1 1 0;min-width:0;height:30px;border:0;border-radius:var(--rad-s);
  background:none;color:var(--dim);font-size:10.5px;font-weight:700;white-space:nowrap}
.vzt.on{background:rgba(var(--acc-rgb),.13);color:var(--acc-br);font-weight:800}
.vzt:active{opacity:.6}
/* 한 줄 — 이름 · 판정 · 숫자. 숫자를 판정 색으로 칠해 훑기만 해도 읽히게 */
.zrow{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  padding:9px 0;border-top:1px solid rgba(var(--tx-rgb),.06)}
.zrow:first-of-type{border-top:0}
.zrow .nm{font-size:13px;font-weight:700;color:var(--tx)}
.zrow .st{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim)}
.zrow .num{margin-left:auto;font-family:var(--mono);font-size:14px;font-weight:700;
  color:var(--mut);font-variant-numeric:tabular-nums}
.zrow .num em{font-style:normal;font-size:11px;color:var(--dim);font-weight:400}
.zrow .sub{flex:1 0 100%;font-size:10px;color:var(--dim);line-height:1.4}
.zrow.pos .num,.zrow.pos .st{color:var(--pos)}
.zrow.neg .num,.zrow.neg .st{color:var(--sig)}
.zrow.warn .num,.zrow.warn .st{color:var(--acc-br)}
/* ── 평균 탭 · 요일 격자 ──
   .zrow 블록 바로 뒤(1459행 근처)에 넣는다.
   이름 충돌 확인함 — index.html 에 .dgh .dgk .dgcp .dgv .dgun .dgsb .dggrid
   .dgb .dgo .dgu .dgd .dgt .dgw .dgwe .dgl .dgtal .dgi .dgnt 가 하나도 없다
   (.dgrp · .dgoal 은 있으나 정확 일치가 아니라 안 부딪친다).
   맨 표식 이름(.ov .un .up .on 따위)은 하나도 안 쓴다 — .ov 는 1038행이
   시트 뒤 오버레이로 position:fixed·opacity:0 을 얹어 표식을 통째로 지운다.

   평균 한 줄. .zrow 를 안 쓴 까닭 둘 —
   (1) .zrow.warn 의 숫자·칩이 --acc-br 이라 같은 카드에서 '초과' 가 격자의
       --sig 와 두 색이 된다. 한 낱말에 두 색이면 다른 뜻인지 짚어 보게 된다.
   (2) .zrow 한 줄이 57px 다. 격자를 얹으면 평균 탭이 380px 를 넘는다. */
.dgh{display:flex;align-items:baseline;gap:6px;padding:0 1px 1px}
.dgk{font-size:12.5px;font-weight:700;color:var(--tx)}
.dgcp{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim)}
/* 잰 값은 잘잘못이 아니다 — 큰 수는 늘 --tx 고 판정 색은 칩만 진다 */
.dgv{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:800;
  color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dgun{font-size:10px;font-weight:700;color:var(--dim)}
/* 칩 색이 격자 표식 색과 같다 — 줄과 그림이 같은 낱말을 같은 색으로 말한다 */
.dgh-ov .dgcp{color:var(--sig)}
.dgh-un .dgcp{color:var(--mut)}
.dgh-ok .dgcp{color:var(--pos)}
.dgsb{margin:1px 1px 0;font-family:var(--mono);font-size:10px;line-height:1.35;
  color:var(--dim);font-variant-numeric:tabular-nums}
.dgsb b{color:var(--mut);font-weight:700}
/* 단백질이 목표 밑이면 여기서만 붉힌다. .dgh 의 판정 클래스를 쓰면 열량
   판정을 덮어써 한 줄이 두 가지를 말하게 된다 */
.dgsb b.dgpr.lo{color:var(--sig)}

/* 격자. 높이는 viewBox 가 지고 여기서는 폭만 맡는다 — width:100% 라
   실폭 313px 에 앉아 가로 스크롤이 원리상 안 난다 */
.dggrid{width:100%;height:auto;display:block;margin:5px 0 0}
/* 요일 글자는 본문 폰트다 — 한글은 mono 에서 자간이 무너진다 */
.dggrid .dgw{font-size:9px;font-weight:700;fill:var(--dim)}
/* 주말 두 칸을 한 단계 밝게. 무늬가 주말에 몰리는 일이 잦아 눈이 짚을 데를 준다 */
.dggrid .dgwe{fill:var(--mut)}
.dggrid .dgl{font-family:var(--mono);font-size:8px;fill:var(--dim)}
/* 지킴 폭. 세는 줄 끝에 물러선 채로 붙는다 — 뜻풀이지 셈이 아니다 */
.dgbd{margin-left:auto;opacity:.75}
/* 판정 띠. 기록이 있는 날 위에만 이어 깔린다 — 끊긴 자리가 곧
   '그날은 안 왔다' 다. --inset 을 안 쓴 까닭은 어두운 팔레트에서 --plate 보다
   더 어두워 4px 두께로는 카드에 묻히기 때문이다. --tx 틴트는 밝은 판에서도
   어두운 판에서도 늘 판보다 도드라진다. */
.dggrid .dgb{fill:rgba(var(--tx-rgb),.10)}
/* 목표 안에 든 날 — 넘긴 것이 아니라 지킨 것이므로 --pos */
.dggrid .dgo{fill:var(--pos)}
/* 감량기에 눈이 가야 할 곳은 넘긴 날이다 */
.dggrid .dgu{fill:var(--sig)}
/* 덜 먹은 날도 어긴 것이지만 넘긴 날만큼 소리치면 스무 칸이 다 경고가 된다.
   방향(아래)이 이미 뜻을 지므로 색은 물러선다 */
.dggrid .dgd{fill:var(--mut)}
/* 오늘. 아직 안 끝났으므로 판정하지 않고 자리만 짚는다 */
.dggrid .dgt{fill:none;stroke:var(--acc-br);stroke-width:1.6;stroke-dasharray:2.2 2.2}

/* 세는 줄. 표식이 격자 속 표식과 같은 그림이라 범례를 따로 안 둔다 */
.dgtal{display:flex;flex-wrap:wrap;gap:2px 14px;margin:2px 1px 0;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);
  font-variant-numeric:tabular-nums;align-items:center}
.dgtal span{display:inline-flex;align-items:center}
.dgtal b{color:var(--tx);font-weight:700;margin:0 1px 0 4px}
.dgi{position:relative;display:inline-block;width:16px;height:14px;
  margin-right:4px;flex:0 0 auto}
.dgi::before{content:'';position:absolute;left:0;right:0;top:5px;height:4px;
  border-radius:2px;background:rgba(var(--tx-rgb),.10)}
/* 띠 위로 솟은 칸 · 띠 아래로 내린 칸 — 격자의 표식과 같은 짜임이다 */
.dgi::after{content:'';position:absolute;left:4px}
.dgi-on::after{top:3.4px;width:7px;height:7px;border-radius:50%;background:var(--pos)}
.dgi-up::after{top:0;width:8px;height:8px;border-radius:2px;background:var(--sig)}
.dgi-dn::after{bottom:0;width:8px;height:8px;border-radius:2px;background:var(--mut)}

/* 요일 노트. 그림 뜻을 푸는 각주가 아니라 그림에서 나온 판정이다 */
.dgnt{margin:3px 1px 0;font-family:var(--mono);font-size:10.5px;line-height:1.35;
  color:var(--dim);font-variant-numeric:tabular-nums}
.dgnt b{font-weight:700;color:var(--mut)}
.dgnt-up b{color:var(--sig)}
/* ── 손댈 것 · 진단 줄 ──
   이름/원인칩/숫자 + 근거 두 줄이 한 덩어리로 읽혀야 하는데 .zrow 의 윗선만
   으로는 서로 다른 줄처럼 갈린다. 왼쪽 레일이 그것을 묶고 판정을 글자 없이
   알린다 — 위 타일이 이미 센 '퇴행/정체' 를 네 번째로 적지 않기 위해서다.
   배경은 깔지 않는다: 틴트가 밀려 올라가 어두운 팔레트에서 대비가 무너진다
   (경고 배지에서 이미 세 번 겪었다). */
/* 누를 수 있는 타일. 51px 이라 크기는 이미 넉넉하다 */
/* 넷이 되면 한 칸이 좁아진다 — 글자를 한 단계 줄이고 여백을 조인다 */
.sttrow.four{gap:5px}
.sttrow.four .stt{padding:8px 2px}
.sttrow.four .stt b{font-size:15px}
.sttrow.four .stt i{font-size:8.5px;letter-spacing:.1em}
.stt[data-act]{cursor:pointer}
.stt[data-act]:active{opacity:.6}
/* 9% 틴트로는 켜진 티가 안 난다 — frost 계열에서 꺼진 타일과 1.02 로
   사실상 같은 색이었다. 강조색으로 채운다. --on-acc 가 바로 그 위에
   얹으라고 있는 글자색이라 대비가 팔레트와 무관하게 선다.
   .stt.up2/.dn2 의 초록·빨강도 이때는 덮는다 — 채운 칸에서 그 색을 그대로
   쓰면 대비가 팔레트마다 널뛴다. 색은 안 켜진 두 칸이 계속 나른다. */
.stt.on{border-color:var(--acc-sf);background:var(--acc-sf)}
.stt.on b,.stt.on i,.stt.on.up2 b,.stt.on.dn2 b{color:var(--on-acc)}
/* 타일이 편 목록 — .zrow 는 한 줄 50px 이라 열한 줄이면 550px 다.
   여기는 이름과 값만 있으면 되므로 좁은 줄을 따로 쓴다. */
.pgl{margin:8px 0 2px}
/* 부위 머리 — 긴 목록의 눈금. 오른쪽 실선이 개수까지 밀어 붙여 묶음의
   경계가 글자 없이도 보인다. */
.pgh{display:flex;align-items:center;gap:7px;margin:13px 0 1px;
  font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.pgh:first-child{margin-top:2px}
.pgh span{flex:0 0 auto}
/* .lmcap 의 --chrome + opacity 를 베꼈다가 3.2~3.5 로 AA 를 못 넘겼다.
   저것은 장식 캡션이고 이것은 긴 목록의 길잡이라 읽혀야 한다 — 색 대신
   크기·굵기·자간으로 줄과 구분한다. */
.pgh i{flex:0 0 auto;order:3;font-style:normal;font-family:var(--mono);
  font-size:9.5px;letter-spacing:0;color:var(--mut)}
.pgh::after{content:'';order:2;flex:1 1 auto;height:1px;background:rgba(var(--tx-rgb),.12)}
.pgli{display:flex;align-items:baseline;gap:8px;padding:7px 2px;
  border-top:1px solid rgba(var(--tx-rgb),.06)}
/* 줄 사이 선은 묶음 안에서만 — 머리 바로 밑에 선이 겹치면 두 줄로 보인다 */
.pgg>.pgli:first-child{border-top:0}
.pgli b{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--tx)}
.pgli i{flex:0 0 auto;font-style:normal;font-size:9.5px;font-weight:700;color:var(--mut)}
/* 값은 고정폭으로 두어 줄이 많아도 세로줄이 선다 */
.pgli u{margin-left:auto;flex:0 0 auto;min-width:56px;text-align:right;
  text-decoration:none;font-family:var(--mono);font-size:11.5px;
  color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.pgli.mt{color:var(--mut);font-size:11px}
/* 칩 풀이 — 세부 갈래의 lmlg 와 같은 자리, 같은 무게 */
.pglg{margin:9px 2px 2px;font-size:10px;line-height:1.55;color:var(--mut)}
.pglg b{font-weight:800;color:var(--tx)}
.pglg i{font-style:normal;margin:0 5px;color:var(--dim)}
.zrow.pgr{padding-left:9px;border-left:2px solid rgba(var(--tx-rgb),.14)}
.zrow.pgr.neg{border-left-color:var(--sig)}
/* 정체 레일에 금색(--acc-br)을 쓰면 다섯 팔레트(ember wine ruby crimson
   rust)에서 --sig 와 뜻이 정반대로 그려지고, mint·patina 에서는 바로 아래
   '순항' 과 바이트까지 같은 색이 된다. 색 가진 레일 하나와 안 가진 레일
   하나면 팔레트와 무관하게 갈린다 — 판정은 숫자 칸의 단위가 이미 나른다. */
.zrow.pgr.warn{border-left-color:rgba(var(--tx-rgb),.34)}
/* 긴 이름이 줄을 늘리지 않게. 라인명까지 붙으면 예산을 쉽게 넘긴다 */
.zrow.pgr .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 칩이 두 글자 판정어 대신 열여섯 가지 원인어를 나르게 됐다. 정보량이 는
   만큼 활자가 커져야 하고, 대문자 라틴용 자간은 한글 낱자를 흩는다. */
.zrow.pgr .st{font-size:10.5px;letter-spacing:0;color:var(--tx)}
/* --bw 가 0 인 테크가 열일곱이라 라이트 팔레트에서 카드가 4.3% 회색 한 겹만
   남는다. 여기서는 리터럴 1px 로 일부러 무시한다. --rad-m 이 999px 인
   테크에서는 카드가 스타디움이 되어 레일이 배경 밖으로 나가므로 상한을 건다.
   왼쪽 패딩은 0 — 그래야 편 줄의 레일과 접힌 줄의 레일이 한 기둥으로 선다. */
.lmsec.pgd{padding:9px 12px 4px 0;border-width:1px;border-radius:min(var(--rad-m),14px);
  border-color:rgba(var(--tx-rgb),.16)}
/* --acc-br 은 밝은 팔레트 다섯에서 4.41~4.46 으로 AA 를 못 넘고, 무엇보다
   레일에서 금색을 버렸으니 숫자만 금색으로 남을 이유가 없다. 정체는 색을
   안 쓴다 — 색은 퇴행 몫이다. 근거줄도 --dim 은 sage 에서 4.47 이라
   한 단계 올린다. 크기(10 대 11px)가 여전히 둘을 가른다. */
.zrow.pgr.warn .num,.zrow.pgr.warn .st{color:var(--tx)}
.zrow.pgr .sub{color:var(--mut)}
/* .sub 는 판정이 선 계산, .why 는 그 계산이 그렇게 나온 까닭 — 둘을 같은
   10px --dim 으로 두면 붙어 버려 두 줄 다 안 읽힌다. 한 단계만 올린다.
   margin-top 은 안 준다: .zrow 의 gap:7px 이 row-gap 이기도 해서 이미
   7px 이 들어가 있고, 거기에 5를 더하면 근거 두 줄 사이가 제목과 부제
   사이보다 더 벌어진다. */

/* 접힌 줄 — 누를 수 있으면 눌린다(.vzt·.lmlg 와 같은 관례).

.pgc[data-act]{cursor:pointer;display:inline-flex;align-items:center;

/* 그 날짜에 가장 가까운 인바디 체중. 어시스트 유효무게는 체중이 기준이라
   지금 체중으로 옛 기록을 다시 계산하면 감량 중에 같은 기록이 계속 가벼워진
   것으로 바뀐다 — 80에서 75kg 이 되면 -12.6% 퇴행으로 찍힌다. */
function bwOn(ds){
  var fb=(BW>0?BW:70);
  if(!ds)return fb;
  /* 매일 재는 체중이 있으면 그 무렵 7일 평균이 인바디보다 그날에 가깝다 */
  var sw=swAvg(ds,7);
  if(sw>0)return sw;
  var a=bhLoad();if(!a.length)return fb;
  var best=null,bd=1e9,i,t=new Date(ds).getTime();
  for(i=0;i<a.length;i++){
    var d=Math.abs((new Date(a[i].d).getTime()-t)/86400000);
    if(d<bd&&a[i].w>0){bd=d;best=a[i];}
  }
  return best?best.w:fb;
}
function effOf(m,w,ds){
  if(!isAssist(m))return +w||0;
  return Math.max(0,Math.round((bwOn(ds)-(+w||0))*10)/10);
}
function effSets(m,s,ds){
  if(!isAssist(m)||!s)return s;
  var o=[],i;
  for(i=0;i<s.length;i++){var c=s[i].slice();c[0]=effOf(m,c[0],ds);o.push(c);}
  return o;
}
/* 표시용 대표 무게 — 어시스트는 보조가 적을수록 어려우므로 최솟값이 최고 기록임 */
/* 개인 최고 — 세션 평균 e1RM 기준. ds 세션이 그 이전 전부를 넘었는지 판정함 */
function prOf(m,ds){
  if(!m||isCard(m.p))return null;
  var a=(S.l[m.i]||[]).filter(function(x){return x.s&&x.s.length;});
  var cur=null,best=0,bd='',i;
  for(i=0;i<a.length;i++){
    var v=e1rmAvg(effSets(m,a[i].s,a[i].d));
    if(a[i].d===ds){cur=v;continue;}
    if(a[i].d<ds&&v>best){best=v;bd=a[i].d;}
  }
  if(cur===null||!(cur>0))return null;
  return {cur:cur,best:best,bestDate:bd,isPR:(best>0&&cur>best),gain:best>0?Math.round((cur-best)/best*1000)/10:0};
}
function topOfM(m,s){
  if(!isAssist(m))return topOf(s);
  var t=null,i;
  for(i=0;i<s.length;i++){var w=+s[i][0]||0;if(t===null||w<t)t=w;}
  return t===null?0:t;
}
function cUnit(x){return fmtW(x[1])+(x[2]>0?'/'+fmtW(x[2])+'%':'');}
/* 러닝머신은 시속(km/h), 스텝밀은 기기 레벨 — 같은 칸에 다른 뜻이 들어간다 */
function cSpdU(n){return isTreadName(n)?'km/h':'Lv';}
/* 유산소는 최장 구간이 아니라 그날 합계가 주간 목표에 들어간다 */
function cMin(s){var t=0,i;for(i=0;i<(s||[]).length;i++)t+=+s[i][0]||0;return Math.round(t);}
/* 인터벌을 여러 번 하면 속도를 다 나열할 때 줄이 두세 겹으로 늘어난다.
   구간 수와 속도 범위로 줄이면 한 줄에 들어가면서 인터벌이었다는 사실도 남는다. */
function cSpdSum(s,n){
  if(!s||!s.length)return '';
  if(s.length===1)return cUnitN(s[0],n);
  var lo=null,hi=null,inc=0,i;
  for(i=0;i<s.length;i++){
    var v=+s[i][1]||0,c=+s[i][2]||0;
    if(lo===null||v<lo)lo=v;
    if(hi===null||v>hi)hi=v;
    if(c>inc)inc=c;
  }
  return TX1('{0}구간',s.length)+' '+(lo===hi?fmtW(lo):(fmtW(lo)+'–'+fmtW(hi)))+cSpdU(n)
    +(inc>0?' '+fmtW(inc)+'%':'');
}
function cKm(s,n){
  if(!isTreadName(n))return 0;
  var d=0,i;for(i=0;i<(s||[]).length;i++)d+=(+s[i][0]||0)/60*(+s[i][1]||0);
  return Math.round(d*10)/10;
}
function cUnitN(x,n){return fmtW(x[1])+cSpdU(n)+(x[2]>0?' '+fmtW(x[2])+'%':'');}
function repsOfC(s,card,n){
  if(!card)return repsOf(s);
  var a=[],i;for(i=0;i<s.length;i++)a.push(cUnitN(s[i],n));
  return a.join(' ');
}
function repsOf(s){var r=[];for(var i=0;i<s.length;i++)r.push(s[i][1]);return r.join('·');}
function sameW(s){for(var i=1;i<s.length;i++)if(s[i][0]!==s[0][0])return false;return true;}
function cardDetail(s,n){
  var a=[],i;
  for(i=0;i<s.length;i++)a.push(fmtW(s[i][0])+"' "+cUnitN(s[i],n));
  return a.join('  ');
}
function detailOf(s){
  if(!s.length)return '';
  if(sameW(s))return repsOf(s);
  var a=[];for(var i=0;i<s.length;i++)a.push(fmtW(s[i][0])+'×'+s[i][1]);
  return a.join('  ');
}
/* 세션 볼륨: 전 세트 합산 Σ(무게×반복) — 주간 누적 일량 지표 */
/* 볼륨은 톤수가 아니라 '실패 근처까지 간 세트 수'다 — MEV/MAV/MRV 가 원래
   그렇게 정의된 값이다. 30kg 20회와 60kg 근접실패는 톤수가 같아도 자극이 다르다.
   톤수(무게x횟수)는 판정에서 완전히 뺐다. */
var RIR_HARD=3;   /* 실패 3회 이내 = 유효 세트 (문헌의 hard set) */
function hardOf(s){
  var n=0,unk=0,easy=0,i;
  for(i=0;i<(s||[]).length;i++){
    var v=s[i][2];
    /* 버린 세트를 세어 둔다. 안 세면 '가볍게 여덟 세트' 와 '아예 안 함' 이
       화면에서 똑같이 'MEV 미만' 으로 보이고, 처방이 정반대로 나간다 —
       앞은 무게를 올릴 일이고 뒤는 세트를 늘릴 일이다. */
    if(v===0||v>0){ if(v<=RIR_HARD)n++; else easy++; }
    /* 미입력은 센다 — 안 세면 RIR 을 안 찍던 시절 기록이 통째로 사라진다.
       대신 몇 개가 미확인인지 따로 들고 다닌다. */
    else { n++; unk++; }
  }
  return {n:n,unk:unk,easy:easy};
}
/* 세션 e1RM(Epley): 세트 수에 불변인 진전 지표 — 증감 판정에 사용 */
function e1rm(s){var b=0;for(var i=0;i<s.length;i++){var v=(+s[i][0]||0)*(1+(+s[i][1]||0)/30);if(v>b)b=v;}return Math.round(b*10)/10;}
/* 세트별 e1RM 내림차순 배열 */
function e1rmArr(s){var a=[],i;for(i=0;i<(s||[]).length;i++){var w=+s[i][0]||0,r=+s[i][1]||0;if(w>0&&r>0)a.push(w*(1+r/30));}a.sort(function(x,y){return y-x;});return a;}
/* 상위 n세트 평균 e1RM — n 생략 시 전 세트 평균 */
function e1rmTopN(s,n){
  var a=e1rmArr(s);
  if(!a.length)return 0;
  n=Math.max(1,Math.min(n||a.length,a.length));
  var t=0,i;for(i=0;i<n;i++)t+=a[i];
  return Math.round(t/n*10)/10;
}
/* 세션 평균 e1RM — 그날 한 전 세트 기준 */
function e1rmAvg(s){return e1rmTopN(s,0);}
/* 두 세션 성장률 — 세트 수가 달라도 공통 세트 수(최대 4)로 맞춰 비교함 */
function e1rmGain(cur,prev){
  var ca=e1rmArr(cur),pa=e1rmArr(prev);
  if(!ca.length||!pa.length)return null;
  var n=Math.min(ca.length,pa.length,4);
  var c=e1rmTopN(cur,n),pv=e1rmTopN(prev,n);
  if(!(pv>0))return null;
  return {pct:Math.round((c-pv)/pv*1000)/10,n:n,cur:c,prev:pv,curN:ca.length,prevN:pa.length};
}
/* 목록 sub용 — 톱세트 무게의 세트만 표기 (혼합 무게 세션) */
function topDetail(s){
  if(!s.length)return '';
  if(sameW(s))return repsOf(s);
  var t=topOf(s),r=[],i;
  for(i=0;i<s.length;i++)if(s[i][0]===t)r.push(s[i][1]);
  return fmtW(t)+'×'+r.join('·');
}
/* ds 이전의 가장 최근 세션 (sess는 최신순) */
function prevSess(id,ds){var a=sess(id);for(var i=0;i<a.length;i++)if(a[i].d<ds&&a[i].s.length)return a[i];return null;}
/* 세션 전체 기준 성장률 배지 */
function gainTag(cur,prev){
  var g=e1rmGain(cur,prev);
  if(!g)return '';                    /* 비교할 직전 세션이 없으면 표시하지 않음 */
  if(g.pct===0)return '<i class="eq">'+TX('유지')+'</i>';
  return '<i class="'+(g.pct>0?'up':'dn')+'">'+(g.pct>0?'▲':'▼')+Math.abs(g.pct)+'%</i>';
}
/* RIR(남은 반복) — 미입력/0/1/2/3+ 순환. 0=실패 직전 */
function rirBtn(v,j){
  var has=(v===0||v>0);
  /* RIR_HARD 를 넘은 세트는 볼륨에 안 들어가므로 눈으로도 갈라 보인다 */
  var cls=has?(v>RIR_HARD?' easy':(v<=1?' hard':' on')):' off';
  return '<button class="rir'+cls+'" data-act="rr" data-v="'+j+'">'
    +(has?'<b>'+v+(v>RIR_HARD?'+':'')+'</b>':'RIR')+'</button>';
}
/* 4+ 가 없으면 '이 세트는 쉬웠다'를 적을 방법이 없어 유효 세트를 가릴 수 없다 */
function rirNext(v){
  if(v===0)return 1;
  if(v===1)return 2;
  if(v===2)return 3;
  if(v===3)return 4;
  if(v===4)return null;
  return 0;
}
/* 세션 평균 RIR — 입력된 세트만 대상, 없으면 null */
function rirAvg(s){
  var t=0,n=0,i;
  for(i=0;i<(s||[]).length;i++){var v=s[i][2];if(v===0||v>0){t+=v;n++;}}
  return n?Math.round(t/n*10)/10:null;
}
function machById(id){for(var i=0;i<S.m.length;i++)if(S.m[i].i===id)return S.m[i];return null;}
function machStep(id){if(isCardId(id))return 5;var m=machById(id);return (m&&m.st>0)?m.st:2.5;}
function anyDirty(){for(var k in UI.dirty)if(UI.dirty[k])return true;return false;}
function nmWalk(n){n=String(n||'').toLowerCase();return n.indexOf('walk')>=0||n.indexOf('걷기')>=0||n.indexOf('산책')>=0||n.indexOf('워킹')>=0;}
function isWalkName(x){return cKind(x)==='walk';}
/* 걷기는 NEAT 다 — wkCardio 가 이미 걷기 분을 nt 로 갈라 담고 화면에도
   '걷기 N분 별도' 라 적는다. 훈련으로 세는 자리에서는 빼야 셈이 한 가지로
   된다. 종목 id 로 묻는 자리가 여럿이라 여기 하나로 둔다. */
function isWalkId(id){var m=machById(id);return !!(m&&isCard(m.p)&&isWalkName(m));}
function ensureCardio(){
  var i,has=false,hasWalk=false;
  for(i=0;i<S.m.length;i++){
    if(S.m[i].p==='CARDIO'){
      has=true;
      if(isWalkName(S.m[i]))hasWalk=true;
    }
  }
  if(!has){
    S.m.push({i:uid(),n:'Treadmill',p:'CARDIO',b:''});
    S.m.push({i:uid(),n:'Stair Climber',p:'CARDIO',b:''});
  }
  if(!hasWalk)S.m.push({i:uid(),n:'Walking',p:'CARDIO',b:'NEAT'});
}
function hasLogs(){for(var k in S.l){var a=S.l[k];if(a&&a.length)return true;}return false;}
/* ── 데모 모드: 빈 상태에서만 메모리에 샘플 로드, 저장소엔 절대 기록 안 됨, 첫 실제 저장 시 소멸 ── */

function demoSeed(){
  if(hasLogs())return;
  function fnd(p,kw){
    var i,mm;
    for(i=0;i<S.m.length;i++){mm=S.m[i];if(mm.p===p&&mm.n.toLowerCase().indexOf(kw)>=0)return mm.i;}
    for(i=0;i<S.m.length;i++)if(S.m[i].p===p)return S.m[i].i;
    return null;
  }
  var sd=fnd('SHOULDERS','lateral'),sp=fnd('SHOULDERS','press'),rr=fnd('SHOULDERS','rear'),
      lt=fnd('BACK','pulldown'),rw=fnd('BACK','row'),
      cp=fnd('CHEST','press'),ic=fnd('CHEST','incline'),
      lp=fnd('LEGS','press'),lc=fnd('LEGS','curl'),
      bc=fnd('ARMS·ETC','biceps'),tp=fnd('ARMS·ETC','triceps'),
      td=fnd('CARDIO','tread');
  function iso(off){var d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function r5(x){return Math.round(x*2)/2;}
  function push(id,off,sets){
    if(!id)return;
    (S.l[id]=S.l[id]||[]).push({d:iso(off),s:sets,dm:1});
  }
  for(var off=69;off>=1;off--){
    var d=new Date();d.setDate(d.getDate()-off);
    var gd=d.getDay();
    if(gd===1||gd===4)continue; /* 월·목 휴식 */
    var wk=Math.floor((69-off)/7);
    if(gd===2||gd===6){ /* 화·토 등+팔 */
      push(lt,off,[[r5(47+wk*1.2),12],[r5(47+wk*1.2),11],[r5(47+wk*1.2),9],[r5(47+wk*1.2),8]]);
      push(rw,off,[[Math.min(50+wk,57),12],[Math.min(50+wk,57),10],[Math.min(50+wk,57),9]]);
      push(bc,off,[[r5(18+wk*0.5),12],[r5(18+wk*0.5),10]]);
      push(sd,off,[[r5(7+wk*0.5),15],[r5(7+wk*0.5),14],[r5(7+wk*0.5),12]]);
    }
    if(gd===3){ /* 수 가슴+어깨 */
      push(cp,off,[[r5(40+wk*1.5),12],[r5(40+wk*1.5),10],[r5(40+wk*1.5),8]]);
      push(ic,off,[[r5(30+wk),12],[r5(30+wk),10],[r5(30+wk),9]]);
      push(sd,off,[[r5(7+wk*0.5),15],[r5(7+wk*0.5),13],[r5(7+wk*0.5),12]]);
      push(sp,off,[[r5(30+wk),12],[r5(30+wk),10]]);
      push(td,off,[[30,6.5,1.5]]);
    }
    if(gd===5){ /* 금 하체+어깨 */
      push(lp,off,[[120+wk*5,12],[120+wk*5,10],[120+wk*5,10]]);
      push(lc,off,[[r5(40+wk*2),12],[r5(40+wk*2),12],[r5(40+wk*2),10]]);
      push(sd,off,[[r5(7+wk*0.5),15],[r5(7+wk*0.5),14]]);
      push(rr,off,[[r5(30+wk),15],[r5(30+wk),13]]);
      push(td,off,[[35,6.5,1.5]]);
    }
    if(gd===0){ /* 일 가슴+하체+어깨 */
      push(cp,off,[[r5(40+wk*1.5),11],[r5(40+wk*1.5),9]]);
      push(lp,off,[[120+wk*5,12],[120+wk*5,11]]);
      push(sd,off,[[r5(7+wk*0.5),15],[r5(7+wk*0.5),12]]);
      push(tp,off,[[r5(25+wk),12],[r5(25+wk),10]]);
      push(td,off,[[30,6.5,1.5]]);
    }
  }
  for(var k in S.l)S.l[k].sort(function(a,b){return a.d<b.d?1:-1;});
  DEMO=true;
}
var toastT=null;

/* ── 렌더 ── */

    +(bmr(BW,BF)?(function(){

function partDot(part){
  if(isCard(part))return '';

  if(set[0])return '';
  if(DOT.r){var hot=true,i;for(i=1;i<=DOT.rd;i++)if(!set[i]){hot=false;break;}if(hot)return 'hot';}
  /* 쉬기로 한 날은 방치가 아니다 — DOT.yd 가 기본 2라 이틀만 쉬면 다섯
     부위에 전부 방치 경고가 붙었다. 쉰 날은 건너뛰고 훈련할 수 있었던
     날만 센다. 빨간 점(연속 수행)은 손대지 않는다 — 쉬면 연속이 실제로
     끊기므로 지금 동작이 맞다. */
  if(DOT.y){
    var st2=true,j2=1,cnt=0;
    while(cnt<DOT.yd&&j2<=DOT.yd+14){
      if(!isOff(dsAgo(j2))){if(set[j2]){st2=false;break;}cnt++;}

    }

  }

function spark(list){
  var w=260,h=38,pad=5;
  var min=list[0],max=list[0];
  for(var i=1;i<list.length;i++){if(list[i]<min)min=list[i];if(list[i]>max)max=list[i];}
  if(max===min){min-=1;max+=1;}
  var pts=[],lx=0,ly=0;
  for(var j=0;j<list.length;j++){
    lx=pad+j*(w-2*pad)/(list.length-1);
    ly=h-pad-(list[j]-min)/(max-min)*(h-2*pad);
    pts.push(lx.toFixed(1)+','+ly.toFixed(1));
  }
  return '<svg class="spk" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    +'<polyline points="'+pts.join(' ')+'"/>'
    +'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3"/></svg>';
}
