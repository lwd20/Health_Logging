var ANLDEF={
cut:'당신은 감량기 관리에 정통한 보디빌딩 코치다. 아래 데이터로 감량이 계획대로 가고 있는지 진단한 한국어 보고서를 써라.\n핵심은 세 가지를 맞대는 것이다: (1) body의 실제 체중·체지방 변화 속도, (2) paceTarget(주간 목표 감량 kg), (3) nutrition의 avgIntake 대 targetIntake.\n체중이 목표대로 안 줄면 원인을 섭취 부족/과다와 훈련량 중 어디로 볼지 데이터로 가려라. 섭취가 목표보다 많은데 체중이 준다면 targetIntake 산출의 활동계수가 낮게 잡힌 것일 수 있음을 지적하라.\n근손실 위험도 보라 — 적자가 지나치게 크거나(하루 1000kcal 초과) 단백질이 체중당 1.6g 미만이면 경고하라.\nnutrition이 null이면 섭취 판단을 하지 말고 체중 추이만 다루되, 삼성헬스 기록을 시작하면 무엇을 더 볼 수 있는지 한 줄로 안내하라.',
mac:'당신은 스포츠 영양 전문가다. 아래 nutrition 데이터로 매크로 배분을 평가한 한국어 보고서를 써라.\n기준: 감량기 단백질은 체중당 1.6~2.2g(proteinPerKg로 이미 계산돼 있음), 지방은 총열량의 20~30%, 나머지는 탄수화물.\nbyDay로 날마다의 편차를 보라 — 평균만 맞고 날마다 출렁이면 그것도 문제다. 훈련일과 휴식일(restDays)에 탄수화물 배분이 다른지도 확인하라.\nnutrition이 null이거나 daysLogged가 3 미만이면 판단할 데이터가 부족하다고 밝히고, 며칠치가 더 필요한지만 적어라.',
acsm:'당신은 ACSM 가이드라인에 정통한 운동처방 전문가다. 아래 훈련 데이터를 ACSM 저항성·유산소 운동 권고 기준으로 평가한 한국어 보고서를 써라.\n평가 기준: 주요 근군당 주 2회 이상 자극(빈도는 freqThisWeek 값을 그대로 인용하고 직접 세지 말 것), 근비대 반복역 6~12회 중심, 동일 근군 48시간 회복, 유산소 중강도 주 150분(또는 고강도 75분) 및 주 3회 분산, 주간 부하 증가는 전주 대비 20% 이내의 점진적 과부하.\n구성:\n[빈도]\n- freqThisWeek의 부위별 수행 일수를 그대로 인용해 주 2회 기준과 대조하고 부위별 한 줄씩 씀. 앱이 확정한 값이므로 log로 다시 세지 말 것이며 freqThisWeek에 없는 부위는 0회임. 표기는 부위 n/2회 형식임.\n[유산소]\n- thisWeek.CARDIO 분과 회수를 150분·주 3회 기준과 대조해 한 줄로 판정함.\n[강도]\n- log의 반복수 분포가 근비대역(6~12회)에 드는 비율을 평가하고 이탈 종목을 지적함.\n[회복]\n- 연속 훈련일은 computed.streakDays를 그대로 인용하고 3일 이상이면 경고함. 같은 부위의 48시간 미만 재자극만 log 날짜로 점검함.\n[과부하]\n- volThisWeek를 volLastWeek와 부위별로 대조해 20% 초과 급증 또는 급감을 지적함.\n[종합]\n- 충족 항목과 미충족 항목을 각각 한 줄로 요약하고 다음 주 권고를 1~2줄로 마감함.\n\n',
vol:'당신은 볼륨 랜드마크(MEV·MAV·MRV) 이론에 정통한 보디빌딩 코치다. 아래 훈련 데이터의 부위·세부별 주간 세트를 랜드마크와 대조한 한국어 보고서를 써라.\n랜드마크 기준(주당 직접 세트, 일반치): 가슴 MEV8·MAV12~20·MRV22, 등 10·14~22·25, 어깨측면 8·16~22·26, 어깨후면 6·16~22·26, 어깨전면 0·6~8·12(프레스 간접 감안), 대퇴사두 8·12~18·20, 햄스트링 6·10~16·20, 둔근 0·4~12·16, 이두 8·14~20·26, 삼두 6·10~14·18, 종아리 8·12~16·20, 복근 0·16~20·25.\n감량기 보정: 회복 저하로 MRV를 20% 낮춰 적용하고 이를 명시함.\n앱 위젯이 메인·세부 전체의 랜드마크 위치를 그래프로 표시하므로 세부별 나열은 쓰지 않음.\n구성:\n[초과 위험]\n- 보정 MRV의 90% 이상이거나 초과한 세부를 수치와 함께 지적함. 없으면 "MRV 접근 세부 없음"이라 씀.\n[증량 여지]\n- 옷맵시 우선 세부(측면·광배) 중 MAV까지 여유가 있는 곳과 추가 가능 세트 수를 씀.\n[처방]\n- 다음 주 세부별 세트 조정을 최대 3줄로 지시함. 조정 폭은 세부당 2~4세트 이내로 함.\n\n',
prog:'당신은 점진적 과부하 진단 전문가다. 아래 훈련 데이터의 tops(종목별 톱세트 이력)를 근거로 종목별 진전 상태를 판정한 한국어 보고서를 써라.\n판정 정의: e1RM=무게×(1+반복/30)이며 tops의 e값은 그날 한 전 세트(보통 2~4세트)의 평균 e1RM임. 진전 판정은 톱세트 하나가 아니라 이 e값의 세션 간 변화율로 하고 성장률을 퍼센트로 제시함. 세트 수가 다른 두 세션은 적은 쪽 세트 수에 맞춰 비교하며 변화율 ±0.5퍼센트 이내는 무진전으로 봄. RIR 활용: 무진전인데 평균 RIR이 3 이상이면 정체가 아니라 강도 부족으로 보고 증량 또는 근접실패 관리를 지시함. 무진전이면서 평균 RIR이 1 이하면 실제 정체로 보고 재빌드나 디로드를 검토함. e값과 RIR이 함께 내려가면 피로 누적으로 판정함. RIR 미입력 세션은 강도 판정 없이 e값만으로 판단함. 디로드 판정: 3주 내 3세션 이상인 종목에서 e값 변화가 +0.5퍼센트 이하이면서 평균 RIR이 1회 이상 낮아진 종목이 2개 이상이면 정체가 아니라 회복 부족으로 보고 디로드 주간(볼륨 40~50퍼센트 감축)을 권고함. 연속 두 세션 무진전=정체, 연속 두 세션 하락=퇴행(근손실 위험 신호). 인접 세션 간격 14일 초과면 "간격 n일로 보류"로만 표기함. 이력 2회 이하 종목은 언급하지 않음.\n구성:\n[진전]\n- 최근 세션에서 무게 또는 반복이 오른 종목을 "Lat Pulldown 59→66kg, e1RM +8%" 식 수치와 함께 한 줄씩 씀. 없으면 "신규 진전 없음"이라 씀.\n[정체]\n- 정체 종목을 마지막 갱신 날짜·수치와 함께 한 줄씩 씀. 없으면 "정체 종목 없음"만 씀.\n[퇴행]\n- 퇴행 종목을 두 세션의 수치 흐름과 함께 씀. body의 제지방·골격근 추세가 함께 하락 중이면 근손실 경고를 덧붙임. 없으면 "퇴행 종목 없음"만 씀.\n[처방]\n- 정체·퇴행 종목별로 무게 유지, 5% 감량 재빌드(재빌드 무게 명시), 반복 목표 상향 중 하나를 택해 한 줄씩 지시함. 옷맵시 핵심 종목을 우선 다룸.\n\n',
recov:'당신은 회복·피로 관리 전문 코치다. 아래 훈련 데이터로 감량기 회복 상태를 진단한 한국어 보고서를 써라. 감량기는 회복 자원이 평시보다 낮음을 전제로 보수적으로 판정함.\n구성:\n[연속·간격]\n- 연속 훈련일은 computed.streakDays를 그대로 인용하고 직접 세지 말 것이며 3일 이상이면 경고함. 같은 부위의 48시간 미만 재자극을 날짜와 함께 지적함.\n[휴식 준수]\n- 이번 주 무기록일 수를 restDays 계획과 대조해 판정함. 주 중반이면 현재까지의 사실만 씀.\n[세션 피로]\n- log에서 한 종목의 마지막 세트 반복이 그 종목 최고 반복보다 3회 이상 또는 25% 이상 낮은 세션을 피로 급락으로 찾아 종목·수치와 함께 지적함. 없으면 "세션 내 피로 급락 없음"이라 씀.\n[부하 변동]\n- volThisWeek와 volLastWeek를 부위별로 대조해 20% 초과 급증을 회복 부채로, 30% 초과 급감을 디로드 여부 확인 대상으로 지적함.\n[신체 신호]\n- body의 제지방 또는 골격근 추세가 하락이면 회복 부족·근손실 신호로 최우선 경고함. body가 비어 있으면 이 섹션은 생략함.\n[처방]\n- 휴식일 배치, 볼륨 감축 대상 부위, 유지 대상을 합쳐 2~3줄로 지시함.\n\n',
bal:'당신은 근육 발달 균형 분석 전문가다. 아래 훈련 데이터의 세트 배분 비율을 평가한 한국어 보고서를 써라.\n기준 비율(주간 직접 세트): 당기기(등 전체+이두) 대 밀기(가슴+어깨전면+삼두)는 1:1이 표준이며 사용자의 옷맵시 목표상 당기기 우세 1.2:1까지 이상적임. 대퇴사두 대 햄스트링은 1:0.6~0.8을 권장함. 상체 대 하체는 목표가 상체 프레임 확장이므로 2:1까지 허용하되 하체가 주 8세트 미만이면 최소선 미달로 봄. 어깨 내부는 측면이 전면·후면 합보다 크거나 같아야 옷맵시 배분으로 봄.\n구성:\n[당기기·밀기]\n- exercises를 세부 귀속 규칙으로 분류해 실제 세트 비율을 계산하고 기준과 대조해 한 줄로 판정함.\n[사두·햄]\n- 두 세부의 세트 비율을 계산해 권장 구간과 대조함. 햄이 약점 보강 대상임을 감안함.\n[상체·하체]\n- 비율과 하체 최소선 충족 여부를 한 줄로 판정함.\n[어깨 내부]\n- 측면 대 전면+후면 비율을 계산해 옷맵시 배분 여부를 판정함.\n[처방]\n- 비율 이탈이 큰 순서로 최대 3줄, 옮길 세트 수를 명시해 지시함. 이탈 없으면 "배분 균형 양호로 유지 요망"만 씀.\n\n',
vt:'당신은 상체 프레임 확장과 옷맵시(V테이퍼) 특화 코치다. 아래 훈련 데이터를 옷맵시 기준선과 대조한 한국어 보고서를 써라.\n기준선: 측면 어깨 주 18~21세트(주 3~5회 빈도), 광배 주 16~18세트, 가슴 상부 우선, 햄스트링 약점 보강, 승모 직접 자극 0세트(위반 시 최우선 지적). 어깨 너비와 광배 확장이 허리 시각비를 좌우함을 전제로 함.\n구성:\n[핵심 타겟]\n- 측면 어깨와 광배의 이번 주 세트·빈도를 기준선과 대조해 각 한 줄씩 판정함. 주 중반이면 잔여 훈련일로 도달 가능한지로 판정함.\n[보조 타겟]\n- 가슴 상부 대 중하부 배분과 햄스트링 세트를 점검해 각 한 줄로 씀.\n[금기]\n- exercises에 승모 계열(셰러그·업라이트로우·하이풀) 자극이 있으면 세트 수와 함께 위반으로 지적하고, 없으면 "승모 회피 준수"라 씀.\n[배분 판정]\n- 총 세트 중 옷맵시 핵심(측면+광배) 비중을 계산해 배분 집중도를 한 줄로 판정함.\n[처방]\n- 잔여 훈련일에 핵심 타겟을 몇 세트씩 배치할지와 다음 주 조정 방향을 2~3줄로 지시함.\n\n'
};

  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    for(i=0;i<S.l[k].length;i++)if(S.l[k][i].d===td&&S.l[k][i].s.length)return true;
  }
  return false;
}

/* ── 로컬 신호 판정 (프롬프트 규칙 21 포팅: 퇴행 > 회복 부채 > 옷맵시 페이스 > 정상) ── */
function wkSets(){
  var nowd=new Date(),dw=(nowd.getDay()+6)%7;
  var mon=new Date(nowd);mon.setDate(nowd.getDate()-dw);
  function is2(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
  var days={},q,t;
  for(q=0;q<7;q++){t=new Date(mon);t.setDate(mon.getDate()+q);days[is2(t)]=1;}
  var pid={},i,k,cnt={};
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    for(i=0;i<S.l[k].length;i++){
      if(!days[S.l[k][i].d])continue;
      cnt[m.p]=(cnt[m.p]||0)+S.l[k][i].s.length;
    }
  }
  return cnt;
}
function heroStreak(){
  var pid={},i,k,days={};
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    for(i=0;i<S.l[k].length;i++)if(S.l[k][i].s.length)days[daysAgo(S.l[k][i].d)]=1;
  }
  var d=days[0]?0:1;
  if(!days[d])return 0;
  var st=0;
  while(days[d]){st++;d++;}
  return st;
}
function heroTop(s){var t=s[0],i;for(i=1;i<s.length;i++){if(s[i][0]>t[0]||(s[i][0]===t[0]&&s[i][1]>t[1]))t=s[i];}return t;}
function heroProg(onDate){
  var up=0,down=0,stall=0,regName='',regTxt='',i,dnN=[],stN=[];
  function gapD(x,y){return Math.round((new Date(x.d)-new Date(y.d))/86400000);}
  /* 세션 전체(2~4세트) 평균 e1RM 성장률로 판정하며 ±0.5%는 노이즈로 봄 */
  var DB=0.5;
  function gp(m,x,y){var r=e1rmGain(effSets(m,x.s),effSets(m,y.s));return r?r.pct:0;}
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];if(isCard(m.p))continue;
    var a=(S.l[m.i]||[]).filter(function(x){return x.s&&x.s.length;});
    if(a.length<2)continue;
    if(onDate&&a[0].d!==onDate)continue;   /* 그날 수행한 종목만 */
    if(gapD(a[0],a[1])>14)continue;
    var p01=gp(m,a[0],a[1]);
    if(p01>DB){up++;continue;}
    if(a.length<3||gapD(a[1],a[2])>14)continue;
    var p12=gp(m,a[1],a[2]);
    if(p01<-DB&&p12<-DB){
      down++;
      if(dnN.length<3)dnN.push(m.n);
      if(!regName){regName=m.n;regTxt=fmtW(e1rmAvg(a[2].s))+'→'+fmtW(e1rmAvg(a[0].s))+'kg';}
    }else if(p01<=DB&&p12<=DB){stall++;if(stN.length<3)stN.push(m.n);}
  }
  return {up:up,down:down,stall:stall,regName:regName,regTxt:regTxt,dnN:dnN,stN:stN};
}
/* 디로드 감지 — 진전이 멈췄는데 RIR까지 내려가면 회복 부족으로 봄 */
function deloadSignal(){
  var hits=[],names=[],i;
  for(i=0;i<S.m.length;i++){
    var m=S.m[i];if(isCard(m.p))continue;
    var a=(S.l[m.i]||[]).filter(function(x){return x.s&&x.s.length;});
    if(a.length<3)continue;
    if(Math.round((new Date(a[0].d)-new Date(a[2].d))/86400000)>21)continue;
    var g=e1rmGain(effSets(m,a[0].s),effSets(m,a[2].s));
    if(!g||g.pct>0.5)continue;              /* 진전이 있으면 대상 아님 */
    var r0=rirAvg(a[0].s),r2=rirAvg(a[2].s);  /* RIR은 무게 무관 */
    if(r0===null||r2===null)continue;        /* RIR 미입력이면 판정 보류 */
    if(r2-r0>=1){hits.push({n:m.n,d:Math.round((r2-r0)*10)/10,p:g.pct});names.push(m.n);}
  }
  if(hits.length<2)return null;
  hits.sort(function(x,y){return y.d-x.d;});
  return {n:hits.length,top:hits[0],names:names.slice(0,3)};
}
/* 실제 오늘 수행한 내용 요약 */
function todaySum(){
  var td=today(),pid={},i,k,parts={},sets=0,vol=0,ex=0;
  for(i=0;i<S.m.length;i++)pid[S.m[i].i]=S.m[i];
  for(k in S.l){
    var m=pid[k];if(!m||isCard(m.p))continue;
    var a=S.l[k];
    for(i=0;i<a.length;i++){
      if(a[i].d!==td||!a[i].s.length)continue;
      ex++;sets+=a[i].s.length;
      parts[m.p]=(parts[m.p]||0)+a[i].s.length;
      vol+=volOf(effSets(m,a[i].s));
    }
  }
  return {ex:ex,sets:sets,vol:vol,parts:parts};
}
function heroSignal(){

  var ts=hasT?todaySum():null;
  var seg=[],k;

  /* 1) 오늘 무엇을 했는가 — 총 볼륨(t)은 종목 구성이 바뀌면 널뛰어 뺐고,

  if(ts&&ts.sets){

function shrinkThenOcr(f){
  var rd=new FileReader();
  rd.onload=function(){
    var res=String(rd.result||'');
    var rawB64=res.substring(res.indexOf(',')+1);
    var rawMime=f.type||'image/jpeg';
    try{
      var settled=false;
      var img=new Image();
      setTimeout(function(){
        if(!settled){settled=true;ocrInbody(rawB64,rawMime);}
      },6000);
      img.onload=function(){
        if(settled)return;settled=true;
        try{
          var MAX=1600,w2=img.width,h2=img.height;
          if(w2>MAX||h2>MAX){var sc=MAX/Math.max(w2,h2);w2=Math.round(w2*sc);h2=Math.round(h2*sc);}
          var cv=document.createElement('canvas');
          cv.width=w2;cv.height=h2;
          var cx=cv.getContext('2d');
          if(!cx)throw new Error('no ctx');
          cx.fillStyle='#fff';cx.fillRect(0,0,w2,h2);
          cx.drawImage(img,0,0,w2,h2);
          var du=cv.toDataURL('image/jpeg',0.85);
          if(du&&du.indexOf(',')>0)ocrInbody(du.substring(du.indexOf(',')+1),'image/jpeg');
          else ocrInbody(rawB64,rawMime);
        }catch(e2){ocrInbody(rawB64,rawMime);}
      };
      img.onerror=function(){if(settled)return;settled=true;ocrInbody(rawB64,rawMime);};
      img.src=res;
    }catch(e1){ocrInbody(rawB64,rawMime);}
  };
  rd.readAsDataURL(f);
}

  /* 부위별 주간 볼륨(kg, 전 세트 합산) — 유산소 제외 */
  function weekVol(off){

        var lsb=isCard(m.p)?'':subName(subOf(m));

      }

  })();

  /* 종목별 이번 주 세트 수 — 세부 타겟(측면/광배/사두 등) 집계의 근거 */
  var exs=[],ecnt={};
  (function(){

      }

  })();
  var now=new Date();

  var tops=[];

    }).join(' ');

    subAvoid:(function(){var a2=[],sq2;for(sq2=0;sq2<SUBS.length;sq2++)if(STG[SUBS[sq2].k]===0)a2.push(subLabel(SUBS[sq2]));return a2;})(),
    repMax:repMax,restDays:RD.map(function(x){return DN2[x];}),paceTarget:WR,

    log:log,today:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' ('+yo+'), 주는 월요일 시작',thisWeek:weekOf(0),lastWeek:weekOf(1),volThisWeek:weekVol(0),volLastWeek:weekVol(1),targets:WTGT};

/* 삼성헬스에서 들어온 섭취 실측 — 없으면 통째로 빼서 AI 가 0 을 굶은 것으로
   읽지 않게 한다. 모르는 것과 안 먹은 것은 다르다. */
function nutriFacts(){
  var ks=[],k;
  for(k in (HC.days||{}))if(HC.days[k]&&HC.days[k].n>0)ks.push(k);
  if(!ks.length)return null;
  ks.sort();ks=ks.slice(-21);
  var td=dayTDEE(today()),dfc=Math.round(WR*7700/7);
  var rows={},sum=0,pk=0,i,d;
  for(i=0;i<ks.length;i++){
    d=HC.days[ks[i]];
    rows[ks[i]]={kcal:d.kcal,protein:d.p,carb:d.c,fat:d.f};
    sum+=d.kcal;pk+=d.p;
  }
  return {
    source:'Samsung Health',
    daysLogged:ks.length,
    targetIntake:Math.max(0,td-dfc),
    tdee:td,
    avgIntake:Math.round(sum/ks.length),

    byDay:rows
  };
}

/* 앱이 확정한 파생 지표 — AI가 다시 계산하다 틀리는 것을 막기 위해 그대로 전달함 */
function computedFacts(){
  var now=new Date(),dow=(now.getDay()+6)%7;
  var TR={},n=0,d;
  for(d=0;d<7;d++){var gd=(d+1)%7;if(RD.indexOf(gd)<0){TR[d]=1;n++;}}
  var iso=todayISO(),hasToday=false,k;
  for(k in S.l){
    var a=S.l[k],i;
    for(i=0;i<a.length;i++)if(a[i].d===iso&&a[i].s.length){hasToday=true;break;}
    if(hasToday)break;
  }
  var E=0;
  for(d=0;d<=dow;d++){if(!TR[d])continue;if(d===dow&&!hasToday)continue;E++;}
  var pr=heroProg(),dl=deloadSignal();
  return {
    weekPhase:['결산','초반','초반','중반','중반','중반','마감'][dow],
    trainDaysPerWeek:n,
    elapsedTrainDays:E,
    remainTrainDays:Math.max(0,n-E),
    streakDays:heroStreak(),
    progressedCount:pr.up,
    stalledCount:pr.stall,
    regressedCount:pr.down,
    stalledNames:pr.stN,
    regressedNames:pr.dnN,
    deloadCandidates:dl?dl.n:0
  };
}
function paceLeft(){
  try{
    var now=new Date();
    var dow=(now.getDay()+6)%7; /* 월=0 */
    var TR={},td3;
    for(td3=0;td3<7;td3++){
      var gd=(td3+1)%7; /* 월0→getDay1 */
      if(RD.indexOf(gd)<0)TR[td3]=1;
    }
    var iso=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var hasToday=false,k;
    for(k in S.l){
      var a=S.l[k],i;
      for(i=0;i<a.length;i++)if(a[i].d===iso&&a[i].s.length){hasToday=true;break;}
      if(hasToday)break;
    }
    var TN=0,d3;
    for(d3=0;d3<7;d3++)if(TR[d3])TN++;
    if(!TN)return -1;
    var E=0,d2;
    for(d2=0;d2<=dow;d2++){
      if(!TR[d2])continue;
      if(d2===dow&&!hasToday)continue;
      E++;
    }
    return Math.round(E*100/TN);
  }catch(e){return -1;}
}
var AINEG=['과다','부족','미달','위험','우려','초과','부채','이탈','정체로','저조'];
var AIPOS=['달성','양호','잘 ','준수','유지함','회피','안정','적절','성공'];
function hlNum(t){

          .replace(/(\d+\s*회)/g,'<b class="hl">$1</b>')

}
/* 판정어 → 칩 라벨·톤. 구체적인 것부터 검사함 */
var AISTAT=[

  ['위반','위반','neg'],['퇴행','퇴행','neg'],['재빌드','재빌드','neg'],['시급','시급','neg'],
  ['미달','미달','neg'],['부족','부족','neg'],['빈약','부족','neg'],['과중','과중','neg'],
  ['초과','초과','warn'],['부채','부채','warn'],['이탈','이탈','warn'],['정체','정체','warn'],
  ['간섭','간섭','warn'],['보류','보류','warn'],
  ['증량 성공','증량','pos'],['증량 준비','준비','pos'],['달성','달성','pos'],['순항','순항','pos'],
  ['우수','우수','pos'],['양호','양호','pos'],['준수','준수','pos'],['확보','확보','pos'],
  ['적절','적절','pos'],['가능','가능','pos'],['유지','유지',''],
  ['첫 기록','신규','']
];
function aiStat(t){
  for(var i=0;i<AISTAT.length;i++)if(t.indexOf(AISTAT[i][0])>=0)return AISTAT[i];
  return null;
}
/* 불렛 한 줄 → 라벨·상태칩·수치바 카드 */
function aiTr(body,tone,hl){
  var ix=body.indexOf(' — ');
  if(ix<1)ix=body.indexOf(' - ');
  if(ix<1||ix>26)ix=-1;
  var k=ix>0?body.slice(0,ix):body, v=ix>0?body.slice(ix+3):'';
  if(hl){k=hlNum(k);v=hlNum(v);}
  var st=aiStat(v||k), cls=tone==='neg'?'neg':'';
  if(st&&!cls)cls=st[2]==='neg'?'neg':(st[2]==='pos'?'pos':'');
  /* "5/10" 형태가 있으면 미니 바로 시각화 */
  var mb='',m=(k+' '+v).match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
  if(m){
    var cv=parseFloat(m[1]),gv=parseFloat(m[2]);
    if(gv>0)mb='<div class="mini"><b style="width:'+Math.max(0,Math.min(100,Math.round(cv*100/gv)))+'%"></b></div>';
  }
  return '<div class="ai-tr'+(cls?' '+cls:'')+'">'
    +'<div class="kr"><span class="k">'+k+'</span>'
    +(st?'<span class="st">'+st[1]+'</span>':'')+'</div>'
    +(v?'<span class="v">'+v+'</span>':'')+mb+'</div>';
}
function bhHead(body){
  var ix=body.indexOf(' — ');
  if(ix<1)ix=body.indexOf(' - ');
  if(ix<1||ix>26)return body;
  return '<b class="bh">'+body.slice(0,ix)+'</b><em class="bd2">—</em>'+body.slice(ix+3);
}
function aiFmt(txt,ck,ph){
  ck=ck||[];
  var ckOn=ph!=='post';
  var esc=String(txt).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  var lines=esc.split(/\n/),out='',i,ln,m,sec='',ckIdx=0;
  for(i=0;i<lines.length;i++){
    ln=lines[i].trim();
    if(!ln)continue;
    m=ln.match(/^\[(.+)\]$/);
    if(m){sec=m[1];out+='<div class="ai-h">'+m[1]+'</div>';continue;}

    if(sec.indexOf('금주')>=0||sec.indexOf('분석')>=0||sec.indexOf('결산')>=0){
      var ln2=ln.replace(/^-\s+/,'');
      /* 합계 줄 */
      m=ln2.match(/^(?:주간\s*)?총\s*(\d+)\s*\/\s*(\d+)\s*세트[,\s]*(.*)$/);
      if(m){
        var tr=(m[3]||'').replace(/[.\s]+$/,'');
        out+='<div class="ai-total"><span>TOTAL'+(tr?' · '+tr:'')+'</span>'
          +'<span class="num">'+parseInt(m[1],10)+'<em>/'+parseInt(m[2],10)+'</em></span></div>';
        continue;
      }
      /* 부위 줄 — 한/영 부위명, 0패딩, '기대'·'세부' 표기 흡수 */
      m=ln2.match(/^([A-Za-z가-힣·]{1,12})\s*(?:총)?\s*(\d+)\s*\/\s*(\d+)\s*(?:세트|분)?\s*(?:\((.*)\))?\.?$/);
      if(m){
        var cv=parseInt(m[2],10),gv=parseInt(m[3],10);
        var pc=Math.max(0,Math.min(100,gv>0?Math.round(cv*100/gv):0));
        var sub=(m[4]||'').replace(/[,·]?\s*기대\s*\d+(?:\.\d+)?\s*세트/g,'').replace(/세부\s*:?\s*/g,'').replace(/^[\s,:·]+|[\s,:·]+$/g,'').trim();
        var pl=paceLeft(),mk='';
        if(pl>0&&pl<100)mk='<i class="mk" style="left:'+pl+'%"></i>';
        out+='<div class="ai-row"><div class="t"><span class="nm">'+m[1]+'</span>'
          +'<span class="num">'+cv+'<em>/'+gv+'</em></span></div>'
          +'<div class="ai-bar"><b data-w="'+pc+'" style="width:'+(AIFRESH?0:pc)+'%"></b>'+mk+'</div>'
          +(sub?('<div class="ai-sub">'+sub+'</div>'):'')
          +'</div>';
        continue;
      }
    }
    if(ln.indexOf('- ')===0){
      var body=ln.slice(2),tone='',ki;
      /* 처방·방향 섹션은 탭 가능한 체크 항목으로 */
      if(ckOn&&(sec.indexOf('방향')>=0||sec.indexOf('처방')>=0)){
        var done=ck.indexOf(ckIdx)>=0;
        out+='<button class="ai-ck'+(done?' done':'')+'" data-act="ckp" data-v="'+ckIdx+'"><i>'+(done?'✓':'')+'</i><span>'+bhHead(body)+'</span></button>';
        ckIdx++;
        continue;
      }
      for(ki=0;ki<AIPOS.length;ki++)if(body.indexOf(AIPOS[ki])>=0){tone='pos';break;}
      if(!tone)for(ki=0;ki<AINEG.length;ki++)if(body.indexOf(AINEG[ki])>=0){tone='neg';break;}
      out+=aiTr(body,tone,sec.indexOf('정체')>=0);
      continue;
    }
    out+='<div class="ai-p">'+ln+'</div>';
  }
  return out;
}

function grabBind(){
  var sh=document.getElementById('sheet');
  var g=sh?sh.querySelector('.grab'):null;
  if(!g||g.dataset.bound)return;
  g.dataset.bound='1';
  var y0=0,dy=0,drag=false,h0=0;
  function down(e){
    var t=e.touches?e.touches[0]:e;
    y0=t.clientY;dy=0;drag=true;
    h0=sh.getBoundingClientRect().height;
    sh.classList.add('drag');
  }
  function move(e){
    if(!drag)return;
    var t=e.touches?e.touches[0]:e;
    dy=t.clientY-y0;
    if(dy>0){
      sh.style.transform='translateY('+dy+'px)';
    }else{
      var grow=Math.min(-dy,window.innerHeight*0.9-h0);
      if(grow>0)sh.style.height=(h0+grow)+'px';
    }
    if(e.cancelable)e.preventDefault();
  }
  function up(){
    if(!drag)return;
    drag=false;
    sh.classList.remove('drag');
    sh.style.transform='';
    if(dy>90){
      navDrop();
      if(UI.open)closeEx();
      UI.sheet=null;UI.arm=null;render();
    }
  }
  g.addEventListener('touchstart',down,{passive:true});
  g.addEventListener('touchmove',move,{passive:false});
  g.addEventListener('touchend',up);
  g.addEventListener('touchcancel',up);
  g.addEventListener('mousedown',function(e){down(e);
    var mm=function(ev){move(ev);},mu=function(){up();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
}

        raw=raw.slice(a,b+1);
        var o=null;
        try{o=JSON.parse(raw);}catch(err){toast('Format error — paste the full backup');return;}
        var chk=(o&&o.v===2&&o.S)?o.S:o;
        if(!chk||Object.prototype.toString.call(chk.m)!=='[object Array]'||!chk.m.length){
          toast('Backup has no exercise data');return;
        }
        if(!chk.l||typeof chk.l!=='object')chk.l={};
        applyBackup(o);UI.dtab='diet';UI.open=null;UI.sheet=null;UI.arm=null;UI.draft={};UI.dirty={};
        save();saveDraft();
        var c=0,k;for(k in S.l)if(S.l[k]&&S.l[k].length)c++;
        toast('<em>Restored</em> '+S.m.length+' ex · '+c+' days');
        render();
      })();

    case 'prsv':
      (function(){
        var el=document.getElementById('pr');
        var v=el?String(el.value).trim():'';
        if(!v||v===DEFPR.trim()){

      toast('<em>Default restored</em>');

    case 'aksv':
      (function(){
        var m={gem:'akg',oai:'ako',ant:'aka'},any=false;

          var el=document.getElementById(m[sl]);
          if(!el)continue;
          var k=String(el.value).trim();
          KS[sl]=k;
          if(canLS){try{
            if(k)localStorage.setItem(KEY+'.ak.'+sl,k);

    case 'aiprev':

      break;
    case 'ainext':
      if(AIVIEW>0){AIVIEW--;AIFRESH=false;renderSheet();}
      break;
    case 'gmopen':
      GMOPEN=!GMOPEN;if(GMOPEN)ANLOPEN=false;
      renderSheet();
      break;
    case 'gmpick':
      (function(){
        var parts=v.split('|');
        LM=parts[0];
        if(LM==='gem'&&parts[1]&&GMN[parts[1]]){
          GM=parts[1];
          if(canLS){try{localStorage.setItem(KEY+'.gm',GM);}catch(e2){}}
        }
        if(canLS){try{localStorage.setItem(KEY+'.lm',LM);}catch(e2){}}

        renderSheet();
      })();
      break;
    case 'airun':
      if(AIRUN||aiBgPending()){toast('이미 생성 중');break;}
      if(!KS[LM]){UI.sheet='data';render();toast('Save your '+LMN[LM]+' key in settings first');break;}
      if(window.AndroidAI&&AndroidAI.run){
        try{
          var bgSpec=buildAiReq();

          if(canLS){try{localStorage.setItem(KEY+'.aibg',JSON.stringify({ts:Date.now(),eng:bgSpec.eng}));}catch(eBg){}}

          render();
          break;
        }catch(eB){}
      }
      runAI();
      break;
    case 'ai':
      UI.sheet='ai';render();
      break;
    case 'px':UI.editRx=+v;render();break;
    case 'psk':UI.editSk=(v&&SUBRX[v])?v:'';UI.pickOpen='';render();break;
    case 'pkop':UI.pickOpen=(UI.pickOpen===v)?'':v;render();break;
    case 'pb':UI.addBrand=v;UI.addLine='';UI.pickOpen=v?'line':'';render();break;
    case 'pas':UI.editAs=(v==='1');UI.pickOpen='';render();break;
    case 'patpick':
      if(patOk(v)){
        PAT=v;
        if(canLS){try{localStorage.setItem(KEY+'.pat',PAT);}catch(eG){}}
        applyTheme();render();
      }
      break;
    case 'palpick':
      if(palOk(v)){
        PAL=v;
        if(canLS){try{localStorage.setItem(KEY+'.pal',PAL);}catch(eP){}}
        applyTheme();render();
      }
      break;
    case 'techpick':
      if(techOk(v)){
        TECH=v;
        if(canLS){try{localStorage.setItem(KEY+'.tech',TECH);}catch(eT){}}
        applyTheme();render();
      }
      break;
    case 'em2':
      (function(){
        var m=machById(v);
        if(!m)return;
        UI.sheet='edit';UI.editId=m.i;
        UI.addName=m.n;UI.addBrand=m.b||'';UI.addLine=m.ln||'';UI.addPart=m.p;UI.editRx=(m.rx>0?m.rx:12);UI.editSk=(m.sk&&SUBRX[m.sk])?m.sk:'';UI.editAs=!!m.as;UI.pickOpen='';
        UI.editStep=(m.st>0)?m.st:2.5;
        render();
      })();
      break;
    case 'anlopen':
      ANLOPEN=!ANLOPEN;if(ANLOPEN)GMOPEN=false;renderSheet();break;
    case 'anlpick':
      ANL=(ANLL[v]?v:'wk');ANLOPEN=false;anlSave();renderSheet();break;
    case 'ckp':
      (function(){
        var cur2=AIH[AIVIEW];if(!cur2)return;
        cur2.ck=cur2.ck||[];
        var ix=+v,pos=cur2.ck.indexOf(ix);
        if(pos>=0)cur2.ck.splice(pos,1);else cur2.ck.push(ix);
        if(canLS){try{localStorage.setItem(KEY+'.aih',JSON.stringify(AIH));}catch(e){}}

      })();break;
    case 'dcd':
      UI.draft={};UI.dirty={};saveDraft();
      if(PENDWD!==null){var pw=PENDWD;PENDWD=null;setWd(pw);}

    case 'dtr':
      DOT.r=DOT.r?0:1;dotSave();renderChips();renderSheet();break;
    case 'dty':
      DOT.y=DOT.y?0:1;dotSave();renderChips();renderSheet();break;
    case 'rdt':

        if(canLS){try{localStorage.setItem(KEY+'.rd',JSON.stringify(RD));}catch(eR){}}

    case 'cald':
      (function(){
        var el=document.getElementById('bhD');
        if(el)el.value=v;
        calClose();
      })();
      break;
    case 'bha':
      (function(){
        var dd=(document.getElementById('bhD')||{}).value||today();
        var w2=parseFloat(String((document.getElementById('bhW')||{}).value||'').replace(',','.'));
        var f2=parseFloat(String((document.getElementById('bhF')||{}).value||'').replace(',','.'));
        var m2=parseFloat(String((document.getElementById('bhM')||{}).value||'').replace(',','.'));
        var ok=bhCommit(dd,w2,f2,m2);
        if(!ok){toast('<em>WT·FAT%</em> 확인 필요');return;}
        toast('<em>Record saved</em> '+ok);
        render();
      })();
      break;
    case 'bhd':
      bhDel(v);toast('<em>Deleted</em> '+v);render();break;
    case 'bhoc':
      (function(){
        if(!KS.gem&&!KS.oai&&!KS.ant){toast('<em>API key</em> 필요 — 설정에서 등록');return;}
        var fe=document.getElementById('bhFile');if(fe)fe.click();
      })();
      break;
    case 'wg':
      (function(){
        var ids=['wt0','wt1','wt2','wt3','wt4','wt5'],ks=['CHEST','BACK','SHOULDERS','LEGS','ARMS·ETC','CARDIO'],i;
        for(i=0;i<ids.length;i++){
          var el=document.getElementById(ids[i]);if(!el)continue;
          var n=Math.floor(+String(el.value).replace(/[^0-9]/g,''));
          var mx=(ks[i]==='CARDIO')?600:60;
          if(n>=1&&n<=mx)WTGT[ks[i]]=n;
        }
        var ivEl=document.getElementById('iv0');
        if(ivEl){
          var nv=Math.floor(+String(ivEl.value).replace(/[^0-9]/g,''));
          if(nv>=30&&nv<=600){IVs=nv;tmrMark=Math.floor(tmrMs()/(IVs*1000));tmrDraw();}
        }
        var drEl=document.getElementById('dr0');
        if(drEl&&!drEl.disabled){
          var dv2=Math.floor(+String(drEl.value).replace(/[^0-9]/g,''));
          if(dv2>=1&&dv2<=6)DOT.rd=dv2;
        }
        var dyEl=document.getElementById('dy0');
        if(dyEl&&!dyEl.disabled){
          var yv2=Math.floor(+String(dyEl.value).replace(/[^0-9]/g,''));
          if(yv2>=1&&yv2<=7)DOT.yd=yv2;
        }
        dotSave();
        var hrEl=document.getElementById('hr0');
        if(hrEl){
          var hv=Math.floor(+String(hrEl.value).replace(/[^0-9]/g,''));
          if(hv>=120&&hv<=220){HRM=hv;if(canLS){try{localStorage.setItem(KEY+'.hrm',String(hv));}catch(e4){}}}
        }
        var bwEl=document.getElementById('bw0');
        if(bwEl){
          var bv=parseFloat(String(bwEl.value).replace(',','.'));
          if(bv>=30&&bv<=200){BW=Math.round(bv*10)/10;if(canLS){try{localStorage.setItem(KEY+'.bw',String(BW));}catch(e5){}}}
        }
        var bfEl=document.getElementById('bf0');
        if(bfEl){
          var fv=parseFloat(String(bfEl.value).replace(',','.'));
          if(fv>=3&&fv<=60){BF=Math.round(fv*10)/10;if(canLS){try{localStorage.setItem(KEY+'.bf',String(BF));}catch(e6){}}}
        }
        var si;
        for(si=0;si<SUBS.length;si++){
          var sEl=document.getElementById('st'+si);if(!sEl)continue;
          var sv=String(sEl.value).replace(/[^0-9]/g,'');
          if(sv===''){STG[SUBS[si].k]=-1;continue;}
          var sn=Math.floor(+sv);
          if(sn>=0&&sn<=30)STG[SUBS[si].k]=sn;
        }
        if(document.getElementById('st0')&&canLS){try{localStorage.setItem(KEY+'.st',JSON.stringify({v:2,t:STG}));}catch(eS){}}
        var pcEl=document.getElementById('pc0');
        if(pcEl){
          var pw2=parseFloat(String(pcEl.value).replace(',','.'));
          if(pw2>=0.1&&pw2<=1.5){WR=Math.round(pw2*100)/100;if(canLS){try{localStorage.setItem(KEY+'.wr',String(WR));}catch(ePc){}}}
        }
        var acEl=document.getElementById('ac0');
        if(acEl){
          var av=parseFloat(String(acEl.value).replace(',','.'));
          if(av>=1.1&&av<=1.9){ACT=Math.round(av*100)/100;if(canLS){try{localStorage.setItem(KEY+'.act',String(ACT));}catch(e8){}}}
        }
        var gfEl=document.getElementById('gf0');
        if(gfEl){
          var gv=parseFloat(String(gfEl.value).replace(',','.'));
          if(gv>=3&&gv<=40){GF=Math.round(gv*10)/10;if(canLS){try{localStorage.setItem(KEY+'.gf',String(GF));}catch(e7){}}}
        }
        if(canLS){
          try{localStorage.setItem(KEY+'.wt',JSON.stringify(WTGT));}catch(e2){}
          try{localStorage.setItem(KEY+'.iv',String(IVs));}catch(e3){}
        }
        widgetSync();restNotify();
        toast('<em>Settings saved</em>');
        render();
        renderSheet();

    case 'rs':

        if(canLS){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'.d');localStorage.removeItem(KEY+'.bk');}catch(err){}}
        mem=null;S=load();

      }else{UI.arm='rs';render();}
      break;
  }
});

document.addEventListener('change',function(e){
  if(e.target.id!=='impF')return;
  var f=e.target.files&&e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var txt=String(r.result||'').replace(/[\uFEFF]/g,'').trim();
      var o=JSON.parse(txt);
      var chk2=(o&&o.v===2&&o.S)?o.S:o;
      if(chk2&&Object.prototype.toString.call(chk2.m)==='[object Array]'&&chk2.m.length){
        if(!chk2.l||typeof chk2.l!=='object')chk2.l={};
        applyBackup(o);UI.dtab='diet';UI.open=null;UI.sheet=null;UI.draft={};UI.dirty={};
        save();saveDraft();
        toast('<em>Restored</em> backup file');
        render();
      }else{toast('Invalid format');}
    }catch(err){toast('Invalid format');}
  };
  r.readAsText(f);
  e.target.value='';
});

/* 스테퍼 길게 누르기: 0.45초 후 연속 증감 */
var HOLD={t1:null,t2:null,skip:false};
function holdClear(){clearTimeout(HOLD.t1);clearInterval(HOLD.t2);HOLD.t1=HOLD.t2=null;}
if(window.PointerEvent){
  document.addEventListener('pointerdown',function(e){
    var t=e.target.closest('[data-act]');if(!t)return;
    var a=t.getAttribute('data-act');
    if(a!=='w+'&&a!=='w-'&&a!=='r+'&&a!=='r-')return;
    holdClear();
    HOLD.t1=setTimeout(function(){
      HOLD.skip=true;
      syncFromDom();
      var k=a[0],d=a[1]==='+'?1:-1;
      step(k,d);
      HOLD.t2=setInterval(function(){step(k,d);},110);
    },450);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    document.addEventListener(ev,function(){if(HOLD.t2)setTimeout(holdClear,0);else holdClear();});
  });
}

document.addEventListener('focusin',function(e){
  var id=e.target&&e.target.id;
  if(id==='inW'||id==='inR'||id==='inI'){try{e.target.select();}catch(err){}}
});

window.addEventListener('beforeunload',function(e){
  if(anyDirty()){e.preventDefault();e.returnValue='';}
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing)return;
  var id=e.target&&e.target.id;
  if(id==='addName'||id==='addBrand'||id==='addLine'){
    e.preventDefault();
    var b=document.querySelector('[data-act="am"],[data-act="em"]');
    if(b)b.click();
  }
  if(id==='inW'||id==='inR'||id==='inI'||id==='q'){
    e.preventDefault();
    e.target.blur();
  }
});

document.addEventListener('input',function(e){
  if(e.target.id==='q'){UI.q=e.target.value;renderChips();renderList();return;}
  if(e.target.id==='inW'){UI.w=e.target.value;syncBtns();hintRefresh();}
  if(e.target.id==='inR'){UI.r=e.target.value;syncBtns();hintRefresh();}
  if(e.target.id==='inI'){UI.ci=e.target.value;hintRefresh();}
  if(e.target.id==='addName'){
    UI.addName=e.target.value;
    var b=document.querySelector('[data-act="am"],[data-act="em"]');
    if(b)b.className='okbtn'+(UI.addName.trim()?' rdy':'');
  }
  if(e.target.id==='gf0'||e.target.id==='pc0'||e.target.id==='ac0'){
    var bi=document.getElementById('bdInfo');
    if(bi){
      var gv2=function(id,dv){var el2=document.getElementById(id);var n2=parseFloat(String(el2?el2.value:'').replace(',','.'));return isNaN(n2)?dv:n2;};
      bi.innerHTML=bodyLine(gv2('bw0',BW),gv2('bf0',BF),gv2('gf0',GF),gv2('hr0',HRM),gv2('ac0',ACT));
    }
  }
  if(e.target.id==='addBrand')UI.addBrand=e.target.value;
  if(e.target.id==='addLine')UI.addLine=e.target.value;
});
function hintRefresh(){
  var el=document.getElementById('paceHint');
  if(!el)return;
  var m=machById(UI.open);
  if(m)el.innerHTML=hintHtml(m.n);
}
function syncBtns(){
  var b=document.querySelector('.plusbtn');if(!b)return;
  var rdy=parseFloat(String(UI.w).replace(',','.'))>0&&parseInt(UI.r,10)>0;
  var wasUpd=b.classList.contains('upd');
  b.className='plusbtn'+(rdy?'':' dis')+(wasUpd?' upd':'');
}

ensureCardio();
appReady=true;

demoSeed();
render();
mirrorPush(true);
if(restored)setTimeout(function(){try{toast('<em>복구됨</em> 기기 저장소가 비어 있어 사본에서 되살림');}catch(e){}},700);
if(DEMO)setTimeout(function(){try{toast('샘플 데이터 표시 중 — 실제 기록 저장 시 사라짐');}catch(e){}},600);
tmrDraw();
widgetSync();
setTimeout(autoBackup,1500);
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
aiBgPoll();
tmrNativeSync();
hcPull(14);
/* 음식은 다른 앱에서 적고 돌아오는 게 보통이라 복귀 시에도 다시 읽는다 */
addEventListener('visibilitychange',function(){if(!document.hidden)hcPull(3);});
addEventListener('scroll',function(){
  var t=document.querySelector('.top');
  if(t)t.classList.toggle('lift',(window.scrollY||document.documentElement.scrollTop||0)>2);
},{passive:true});
document.addEventListener('visibilitychange',function(){

  aiBgPoll();tmrNativeSync();
});
if(window.AndroidAI)setInterval(function(){
  var was=aiBgPending();

},15000);
